let _tFunc;
function agendarFuncionarios(){ clearTimeout(_tFunc); _tFunc = setTimeout(listarFuncionarios, 180); }
async function listarFuncionarios(){
  const posse = await qu('almox_vw_posse','funcionario_id,quantidade');
  const porFunc = {}; posse.forEach(p=> porFunc[p.funcionario_id] = (porFunc[p.funcionario_id]||0)+p.quantidade);
  const t = buscaFunc.trim().toLowerCase();
  let lista = S.funcionarios.filter(f=> !t || (f.nome+' '+(f.setor||'')+' '+(f.cargo||'')+' '+(f.matricula||'')).toLowerCase().includes(t));
  if(filtroVinculo === 'ATIVOS')        lista = lista.filter(f=>f.ativo);
  else if(filtroVinculo === 'INATIVOS')  lista = lista.filter(f=>!f.ativo);
  else if(filtroVinculo === 'LIDERANCA') lista = lista.filter(f=>f.ativo && f.lideranca);
  else if(filtroVinculo === 'PRAZO') lista = lista.filter(f=>{
    const d = diasAte(f.vinculo_ate); return f.ativo && d!==null && d<=7; });
  else if(filtroVinculo.startsWith('S:')) lista = lista.filter(f=>f.ativo && f.setor===filtroVinculo.slice(2));
  else if(filtroVinculo.startsWith('F:')) lista = lista.filter(f=>f.ativo && f.cargo===filtroVinculo.slice(2));
  else if(filtroVinculo !== 'TODOS')     lista = lista.filter(f=>f.ativo && (f.vinculo||'EFETIVO')===filtroVinculo);
  lista.sort((a,b)=> (a.setor||'').localeCompare(b.setor||'')
                  || (a.cargo||'').localeCompare(b.cargo||'')
                  || a.nome.localeCompare(b.nome));
  $('#funcLista').innerHTML = lista.length? `
    <div class="card-h"><h3>${lista.length} funcionários de ${esc(S.unidade.nome)}</h3><div class="sp"></div>
      <span class="small muted">${S.funcionarios.filter(f=>f.ativo).length} ativos ·
        ${S.funcionarios.filter(f=>!f.ativo).length} desligados</span></div>
    <div class="tbl-wrap"><table>
    <thead><tr><th>Nome</th><th>Setor</th><th>Função</th><th>Vínculo</th><th class="num">Peças em posse</th><th></th></tr></thead>
    <tbody>${lista.map(f=>`<tr style="cursor:pointer" onclick="fichaFuncionario(${f.id})">
      <td><div class="it-nome">${esc(f.nome)}</div>
        <div class="it-meta">${esc(f.matricula||'sem matrícula')}${f.ativo?'':' · desligado '+dt(f.data_desligamento)}</div></td>
      <td><span class="tag brand">${esc(f.setor||'—')}</span></td>
      <td class="small">${esc(f.cargo||'—')}${f.nivel?` <span class="tag">${f.nivel}</span>`:''}
        ${f.lideranca?'<div class="it-meta">liderança</div>':''}</td>
      <td><span class="tag ${f.vinculo==='EFETIVO'?'ok':f.vinculo==='ADAPTACAO'?'zero':f.vinculo==='EXPERIENCIA'?'low':'brand'}">${VINCULOS[f.vinculo||'EFETIVO']}</span>
        ${(()=>{ const d=diasAte(f.vinculo_ate); return d===null?'' :
          `<div class="it-meta" ${d<=2?'style="color:var(--red);font-weight:600"':''}>${
            d<0?`venceu há ${-d} dia(s)` : d===0?'vence hoje' : `faltam ${d} dia(s)`}</div>`; })()}</td>
      <td class="num" style="font-weight:600">${porFunc[f.id]||0}</td>
      <td style="text-align:right"><button class="btn sm">Ficha</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty"><b>Nenhum funcionário</b>Cadastre a equipe para começar a registrar entregas.</div>';
}
async function fichaFuncionario(id){
  const f = S.funcionarios.find(x=>x.id===id);
  const [posse, emps, hist, dota, entregas, cobs] = await Promise.all([
    q('almox_vw_posse','*',b=>b.eq('funcionario_id',id)),
    q('almox_vw_emprestimos','*',b=>b.eq('funcionario_id',id).order('data_saida',{ascending:false}).limit(20)),
    q('almox_vw_movimentacoes','*',b=>b.eq('funcionario_id',id).order('data',{ascending:false}).limit(40)),
    q('almox_vw_dotacao','*',b=>b.eq('funcionario_id',id)),
    q('almox_vw_entregas','*',b=>b.eq('funcionario_id',id).order('data',{ascending:false}).limit(20)),
    q('almox_vw_cobrancas','*',b=>b.eq('funcionario_id',id).order('data',{ascending:false}).limit(20))
  ]);
  drawer({titulo:f.nome, sub:`${esc(f.cargo||'—')} · ${esc(f.setor||'—')}${f.matricula?' · '+esc(f.matricula):''}`, corpo:`
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">
      ${podeOperar()?`<button class="btn sm pri" onclick="formSaidaFuncionario(null,${id})">Entregar peça</button>
      <button class="btn sm" onclick="formEmprestimo(null,${id})">Emprestar</button>`:''}
      ${ehGestor()?`<button class="btn sm" onclick="formFuncionario(${id})">Editar cadastro</button>`:''}
      ${ehGestor() && f.ativo?`<button class="btn sm dan" onclick="formDesligar(${id})">Registrar desligamento</button>`:''}
      ${ehGestor() && !f.ativo?`<button class="btn sm" onclick="reativarFuncionario(${id})">Reativar</button>`:''}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center">
      <button class="btn sm" onclick="formTermoUniforme(${id})">Termo de compromisso</button>
      <button class="btn sm" onclick="fichaEPI(${id})">Ficha de EPI</button>
      ${f.termo_assinado_em
        ? `<span class="tag ok">termo assinado em ${dt(f.termo_assinado_em)}</span>
           ${ehGestor()?`<button class="btn sm" onclick="formTermoAssinado(${id})">Alterar data</button>`:''}`
        : `<span class="tag zero">sem termo assinado</span>
           ${ehGestor()?`<button class="btn sm pri" onclick="formTermoAssinado(${id})">Registrar assinatura</button>`:''}`}
    </div>
    ${(f.observacoes||'').includes('SETOR A CONFIRMAR')?`<div class="card" style="border-color:#E8D28C;background:var(--amber-l);margin-bottom:18px">
      <div class="card-b" style="padding:10px 12px"><b style="color:var(--amber)">Setor a confirmar</b>
      <p class="small" style="margin:4px 0 0">${esc(f.observacoes)}</p></div></div>`:''}
    ${!f.termo_assinado_em?`<div class="card" style="border-color:#EBC7C3;background:var(--red-l);margin-bottom:18px">
      <div class="card-b" style="padding:10px 12px"><b style="color:var(--red)">Termo de compromisso pendente</b>
      <p class="small" style="margin:4px 0 0">Sem termo assinado, cobrança por peça não devolvida depende de dolo
      comprovado. Imprima o termo, colha a assinatura e registre a data aqui.</p></div></div>`:''}
    ${!f.ativo && posse.length?`<div class="card" style="border-color:#EBC7C3;background:var(--red-l);margin-bottom:18px">
      <div class="card-b" style="padding:12px 14px"><b style="color:var(--red)">Pendência de devolução</b>
      <p class="small" style="margin:4px 0 0">Saiu da empresa com ${posse.reduce((s,p)=>s+p.quantidade,0)} peça(s)
      sem devolver. Fica registrado como pendência e não afeta o estoque.</p></div></div>`:''}
    ${dota.length?`<h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Dotação</h4>
    <div class="lista-itens" style="margin-bottom:20px">${dota.map(d=>`
      <div class="li"><span class="sp">${esc(d.grupo)}</span>
        <span class="mono small muted">${d.em_posse} de ${d.quantidade_minima}${d.emprestado?` · ${d.emprestado} emprestada(s)`:''}</span>
        <span class="tag ${d.falta?'zero':'ok'}">${d.falta? 'faltam '+d.falta : 'completo'}</span></div>`).join('')}</div>`:''}
    <h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Em posse hoje</h4>
    ${posse.length?`<div class="lista-itens" style="margin-bottom:20px">${posse.map(p=>`
      <div class="li"><span class="qt">${p.quantidade}×</span><span class="sp">${esc(p.item)} · ${esc(p.tamanho)}</span>
      <span class="small muted">desde ${dt(p.ultima_entrega)}</span></div>`).join('')}</div>`
      : '<p class="small muted" style="margin-bottom:20px">Nenhuma peça entregue em definitivo.</p>'}
    <h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Empréstimos</h4>
    ${emps.length?`<div class="lista-itens" style="margin-bottom:20px">${emps.map(e=>`
      <div class="li"><span class="mono">${esc(e.codigo)}</span><span class="sp small muted">${dt(e.data_saida)}</span>
      <span class="tag ${e.atrasado?'zero':e.status==='DEVOLVIDO'?'ok':'brand'}">${STATUS_EMP[e.status]}</span>
      <button class="btn sm" onclick="abrirEmprestimo(${e.id})">Ver</button></div>`).join('')}</div>`
      : '<p class="small muted" style="margin-bottom:20px">Nenhum empréstimo.</p>'}
    <h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Termos de entrega</h4>
    ${entregas.length?`<div class="lista-itens" style="margin-bottom:20px">${entregas.map(t=>`
      <div class="li"><span class="mono small">${esc(t.codigo)}</span>
        <span class="sp small muted">${dt(t.data)} · ${t.total_pecas} peça(s)</span>
        <button class="btn sm" onclick="termoEntrega('${esc(t.codigo)}')">Imprimir</button></div>`).join('')}</div>`
      : '<p class="small muted" style="margin-bottom:20px">Nenhum termo emitido.</p>'}
    ${cobs.length?`<h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Cobranças</h4>
    <div class="lista-itens" style="margin-bottom:20px">${cobs.map(x=>`
      <div class="li"><span class="mono small">${esc(x.codigo)}</span>
        <span class="sp small">${esc(x.item||'Uniforme')} · ${brl(x.valor_total)}</span>
        <span class="tag ${x.status==='PENDENTE'?'zero':x.status==='DESCONTADA'?'ok':''}">${STATUS_COB[x.status]}</span>
      </div>`).join('')}</div>`:''}
    <h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Histórico</h4>
    ${hist.length?`<div class="tbl-wrap"><table><tbody>${hist.map(m=>`
      <tr${m.cancelada?' style="opacity:.45"':''}><td class="small muted" style="width:86px">${dth(m.data)}</td>
      <td><span class="tag ${m.e_entrada?'in':'out'}">${m.e_entrada?'+':'−'}${m.quantidade}</span>
        <div class="it-meta">${esc(m.item)} ${esc(m.tamanho)} — ${esc(m.justificativa||'')}</div></td></tr>`).join('')}
      </tbody></table></div>`:'<p class="small muted">Sem movimentações.</p>'}`});
}
function formFuncionario(id=null){
  if(!exigeGestor()) return;
  const f = id? S.funcionarios.find(x=>x.id===id) : {};
  modal({titulo: id?'Editar funcionário':'Novo funcionário em '+S.unidade.nome, corpo:`
    <label class="field"><span>Nome completo <em>*</em></span><input class="inp" id="nNome" value="${esc(f.nome||'')}"></label>
    <div class="row">
      <label class="field"><span>Matrícula</span><input class="inp" id="nMat" value="${esc(f.matricula||'')}"></label>
      <label class="field"><span>CPF</span><input class="inp" id="nCpf" value="${esc(f.cpf||'')}"></label>
      <label class="field"><span>Setor <em>*</em></span><select class="inp" id="nSetor">
        <option value="">Selecione…</option>
        ${SETORES.map(x=>`<option value="${x}" ${f.setor===x?'selected':''}>${x}</option>`).join('')}
      </select></label>
      <label class="field"><span>Função <em>*</em></span><select class="inp" id="nFuncao">
        <option value="">Selecione o setor primeiro…</option>
      </select></label>
      <label class="field"><span>Admissão</span><input class="inp" id="nAdm" type="date" value="${f.data_admissao||''}"></label>
      <label class="field"><span>Vínculo <em>*</em></span><select class="inp" id="nVinc">
        ${Object.entries(VINCULOS).map(([k,v])=>
          `<option value="${k}" ${(f.vinculo||'EFETIVO')===k?'selected':''}>${v}</option>`).join('')}
      </select></label>
      <label class="field" id="nAteBox"><span>Período vai até</span>
        <input class="inp" id="nAte" type="date" value="${f.vinculo_ate||''}"></label>
      <label class="field"><span>Nível</span><select class="inp" id="nNivel">
        <option value="">—</option>
        ${Object.entries(NIVEIS).map(([k,v])=>
          `<option value="${k}" ${f.nivel===k?'selected':''}>${k} · ${v}</option>`).join('')}
      </select></label>
    </div>
    <label class="field"><span>Observações</span><textarea class="inp" id="nObs">${esc(f.observacoes||'')}</textarea></label>
    <label class="check"><input type="checkbox" id="nLider" ${f.lideranca?'checked':''}>
      É liderança (coordenação, chefia ou supervisão)</label>
    <p class="small muted" style="margin:-6px 0 10px">A função define o setor e o cargo que aparece nos
    documentos. Trocar de função ou de setor é só editar aqui — o histórico de entregas continua intacto.</p>
    <label class="check"><input type="checkbox" id="nAtivo" ${f.ativo!==false?'checked':''}> Funcionário ativo</label>
    ${id && f.ativo===false && f.data_desligamento?`<p class="small muted" style="margin:0">Desligado em ${dt(f.data_desligamento)}.</p>`:''}`,
    aoAbrir:o=>{
      const selS = o.querySelector('#nSetor'), selF = o.querySelector('#nFuncao');
      const preencher = (marcar)=>{
        const fs = funcoesDoSetor(selS.value);
        selF.innerHTML = selS.value
          ? (fs.length ? fs.map(x=>`<option value="${x.id}" ${marcar===x.id?'selected':''}>${esc(x.nome)}${x.lideranca?' (liderança)':''}</option>`).join('')
                       : '<option value="">Nenhuma função cadastrada neste setor</option>')
          : '<option value="">Selecione o setor primeiro…</option>';
        const escolhida = S.funcoes.find(x=>x.id===Number(selF.value));
        if(escolhida && escolhida.lideranca) o.querySelector('#nLider').checked = true;
      };
      selS.onchange = ()=>preencher(null);
      preencher(f.funcao_id || null);

      const sv = o.querySelector('#nVinc'), sa = o.querySelector('#nAte'), box = o.querySelector('#nAteBox');
      const ajustar = ()=>{
        const dias = VINC_PRAZO[sv.value];
        box.classList.toggle('hide', !dias);
        if(dias && !sa.value){
          const base = o.querySelector('#nAdm').value || hoje();
          const d = new Date(base+'T12:00:00'); d.setDate(d.getDate()+dias);
          sa.value = d.toISOString().slice(0,10);
        }
        if(!dias) sa.value = '';
      };
      sv.onchange = ajustar; ajustar();
    },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Salvar',classe:'pri',acao:async(o,fe,b)=>{
      const nome = o.querySelector('#nNome').value.trim();
      if(!nome) return toast('Informe o nome.','err');
      if(!o.querySelector('#nSetor').value) return toast('Selecione o setor.','err');
      if(!o.querySelector('#nFuncao').value) return toast('Selecione a função.','err');
      b.disabled=true;
      const reg = {nome, matricula:o.querySelector('#nMat').value.trim()||null, cpf:o.querySelector('#nCpf').value.trim()||null,
        funcao_id:Number(o.querySelector('#nFuncao').value)||null,
        data_admissao:o.querySelector('#nAdm').value||null, observacoes:o.querySelector('#nObs').value||null,
        vinculo:o.querySelector('#nVinc').value, lideranca:o.querySelector('#nLider').checked,
        nivel:o.querySelector('#nNivel').value||null,
        vinculo_ate:o.querySelector('#nAte').value||null,
        ativo:o.querySelector('#nAtivo').checked, unidade_id:S.unidade?.id??null};
      try{
        const { error } = id ? await S.sb.from('almox_funcionarios').update(reg).eq('id',id)
                             : await S.sb.from('almox_funcionarios').insert(reg);
        if(error) throw error;
        fe(); $('#drawer').innerHTML=''; await carregarBase(); toast('Cadastro salvo.','ok'); render();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
</script>
<script>
/* =====================================================================
   CADASTROS — itens, categorias, grades/tamanhos, fornecedores, usuários
   ===================================================================== */
let abaCad = 'itens';
async function viewCadastros(){
  const abas = [['itens','Itens'],['grades','Grades e tamanhos'],['categorias','Categorias'],
                ['regras','Regras de dotação'],['fornecedores','Fornecedores'],
                ['funcoes','Setores e funções'],['unidades','Minha unidade'],['usuarios','Logins e acessos']];
  $('#view').innerHTML = `<div class="tabs">${abas.map(([k,t])=>
      `<button data-a="${k}" class="${abaCad===k?'on':''}">${t}</button>`).join('')}</div>
    <div id="cadArea"></div>`;
  $$('.tabs button').forEach(b=> b.onclick = ()=>{ abaCad=b.dataset.a;
    $$('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.a===abaCad)); pintarCadastro(); });
  pintarCadastro();
}
function pintarCadastro(){
  ({itens:cadItens, grades:cadGrades, categorias:cadCategorias, regras:cadRegras,
    fornecedores:cadFornecedores, funcoes:cadFuncoes, unidades:cadUnidades,
    usuarios:cadUsuarios})[abaCad]();
}

/* --- itens ---------------------------------------------------------- */
function cadItens(){
  $('#topAcoes').innerHTML = ehGestor()? `<button class="btn pri" onclick="formItem()">Novo item</button>`:'';
  const saldos = {}; S.estoque.forEach(e=> saldos[e.item_id]=(saldos[e.item_id]||0)+e.saldo);
  $('#cadArea').innerHTML = `<div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Item</th><th>Setores que usam</th><th>Grade</th><th>Dotação</th><th class="num">Mínimo</th>
      <th class="num">Custo ref.</th><th class="num">Saldo</th><th>Marcações</th><th></th></tr></thead>
    <tbody>${S.itens.map(i=>`<tr${i.ativo?'':' style="opacity:.5"'}>
      <td><div class="it-linha">
        ${i.foto_url?`<img class="mini" src="${esc(i.foto_url)}" alt="" loading="lazy">`:'<div class="mini-vazia"></div>'}
        <div><div class="it-nome">${esc(i.nome)}</div>
        <div class="it-meta">${esc(i.codigo||'')}${i.cor?' · '+esc(i.cor):''}</div></div></div></td>
      <td class="small">${(i.setores_uso||[]).length
          ? (i.setores_uso||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')
          : '<span class="muted">—</span>'}
        ${i.observacao_uso?`<div class="it-meta">${esc(i.observacao_uso)}</div>`:''}</td>
      <td class="small">${esc(S.grades.find(g=>g.id===i.grade_id)?.nome||'—')}</td>
      <td class="small">${i.grupo_dotacao?`<span class="tag brand">${esc(i.grupo_dotacao)}</span>`:'—'}</td>
      <td class="num">${i.estoque_minimo}</td>
      <td class="num">${brl(i.custo_referencia)}</td>
      <td class="num" style="font-weight:600">${num(saldos[i.id]||0)}</td>
      <td>${i.epi?'<span class="tag low">EPI</span> ':''}${i.exige_devolucao?'<span class="tag brand">devolução</span>':''}${i.ativo?'':'<span class="tag">inativo</span>'}</td>
      <td style="text-align:right">${ehGestor()?`<button class="btn sm" onclick="formItem(${i.id})">Editar</button>`:''}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}
function formItem(id=null){
  if(!exigeGestor()) return;
  const i = id? S.itens.find(x=>x.id===id) : {};
  modal({titulo: id?'Editar item':'Novo item de uniforme', wide:true, corpo:`
    <div class="row">
      <label class="field"><span>Nome <em>*</em></span><input class="inp" id="iNome" value="${esc(i.nome||'')}"
        placeholder="Ex.: CAMISA (COM LOGO) VERDE"></label>
      <label class="field"><span>Código interno</span><input class="inp mono" id="iCod" value="${esc(i.codigo||'')}"
        placeholder="CAM-VER"></label>
    </div>
    <div class="row-3">
      <label class="field"><span>Categoria</span><select class="inp" id="iCat">
        ${S.categorias.map(c=>`<option value="${c.id}" ${i.categoria_id===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}
      </select></label>
      <label class="field"><span>Grade de tamanhos <em>*</em></span><select class="inp" id="iGrade">
        ${S.grades.map(g=>`<option value="${g.id}" ${i.grade_id===g.id?'selected':''}>${esc(g.nome)}</option>`).join('')}
      </select></label>
      <label class="field"><span>Cor</span><input class="inp" id="iCor" value="${esc(i.cor||'')}"></label>
    </div>
    <div class="row-3">
      <label class="field"><span>Estoque mínimo</span><input class="inp mono" id="iMin" type="number" min="0"
        value="${i.estoque_minimo??3}"></label>
      <label class="field"><span>Custo de referência (R$)</span><input class="inp mono" id="iCusto" type="number"
        min="0" step="0.01" value="${i.custo_referencia??0}"></label>
      <label class="field"><span>Vida útil (meses)</span><input class="inp mono" id="iVida" type="number" min="0"
        value="${i.vida_util_meses??''}"></label>
    </div>
    <div class="field"><span>Foto do item</span>
      <div style="display:flex;gap:12px;align-items:center">
        <div id="iFotoPrev" class="foto-prev">${i.foto_url
          ? `<img src="${esc(i.foto_url)}" alt="">` : '<span>sem foto</span>'}</div>
        <div style="flex:1">
          <input class="inp" id="iFoto" type="file" accept="image/*">
          <p class="small muted" style="margin:6px 0 0">JPG, PNG ou WebP até 5 MB. A foto aparece na matriz de
          estoque e nos lançamentos, para conferir a peça na hora.</p>
          ${i.foto_url?`<button type="button" class="btn sm dan" id="iFotoDel" style="margin-top:6px">Remover foto</button>`:''}
        </div></div>
      <input type="hidden" id="iFotoUrl" value="${esc(i.foto_url||'')}">
    </div>
    <div class="field"><span>Setores que usam esta peça</span>
      <div style="display:flex;gap:14px;flex-wrap:wrap;padding:8px 0">
        ${SETORES.map(x=>`<label class="check" style="margin:0">
          <input type="checkbox" class="iSetor" value="${x}" ${(i.setores_uso||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}
      </div>
      <input class="inp" id="iObsUso" value="${esc(i.observacao_uso||'')}"
        placeholder="Detalhe opcional: Cumim, Garçons, Operador de câmara fria…">
      <p class="small muted" style="margin:6px 0 0">Serve como orientação de quem usa o quê.
      <b>Não bloqueia a entrega</b> para outro setor — o gestor decide na hora.</p>
    </div>
    <label class="field"><span>Grupo de dotação</span>
      <input class="inp" id="iGrupo" list="gruposDot" value="${esc(i.grupo_dotacao||'')}"
        placeholder="Ex.: Camisa, Calça/Bermuda — deixe vazio se não conta para a dotação mínima">
      <datalist id="gruposDot">${[...new Set([...S.dotacoes.map(d=>d.grupo), ...S.itens.map(x=>x.grupo_dotacao)])]
        .filter(Boolean).map(g=>`<option>${esc(g)}</option>`).join('')}</datalist></label>
    <div class="row">
      <label class="check"><input type="checkbox" id="iEpi" ${i.epi?'checked':''}> É EPI</label>
      <label class="field ${i.epi?'':'hide'}" id="iCaBox"><span>Nº do CA</span>
        <input class="inp mono" id="iCa" value="${esc(i.ca_epi||'')}"></label>
    </div>
    <label class="check"><input type="checkbox" id="iDev" ${i.exige_devolucao?'checked':''}> Exige devolução ao desligamento</label>
    <label class="check"><input type="checkbox" id="iAtivo" ${i.ativo!==false?'checked':''}> Item ativo</label>
    <p class="small muted">Ao salvar, o sistema cria a posição de estoque zerada para cada tamanho da grade,
    nesta unidade. O item existe só aqui — outras unidades têm o catálogo delas.</p>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Salvar item',classe:'pri',acao:async(o,f,b)=>{
      const nome = o.querySelector('#iNome').value.trim();
      if(!nome) return toast('Informe o nome do item.','err');
      b.disabled=true;
      const reg = {nome, codigo:o.querySelector('#iCod').value.trim()||null,
        categoria_id:Number(o.querySelector('#iCat').value)||null, grade_id:Number(o.querySelector('#iGrade').value),
        cor:o.querySelector('#iCor').value.trim()||null, estoque_minimo:Number(o.querySelector('#iMin').value||0),
        custo_referencia:Number(o.querySelector('#iCusto').value||0),
        vida_util_meses:o.querySelector('#iVida').value? Number(o.querySelector('#iVida').value):null,
        grupo_dotacao:o.querySelector('#iGrupo').value.trim()||null,
        foto_url:o.querySelector('#iFotoUrl').value||null,
        setores_uso:[...o.querySelectorAll('.iSetor:checked')].map(c=>c.value),
        observacao_uso:o.querySelector('#iObsUso').value.trim()||null,
        epi:o.querySelector('#iEpi').checked, ca_epi:o.querySelector('#iCa').value.trim()||null,
        exige_devolucao:o.querySelector('#iDev').checked, ativo:o.querySelector('#iAtivo').checked,
        atualizado_em:new Date().toISOString(), unidade_id:S.unidade.id};
      try{
        let itemId = id;
        if(id){ const {error} = await S.sb.from('almox_itens').update(reg).eq('id',id); if(error) throw error; }
        else { const {data,error} = await S.sb.from('almox_itens').insert(reg).select().single();
               if(error) throw error; itemId = data.id; }
        await sincronizarVariacoes(itemId);
        f(); await carregarBase(); await carregarEstoque(); montarNav(); toast('Item salvo.','ok'); pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]
    ,aoAbrir:o=>{
      o.querySelector('#iEpi').onchange = e=>
        o.querySelector('#iCaBox').classList.toggle('hide', !e.target.checked);
      const del = o.querySelector('#iFotoDel');
      if(del) del.onclick = ()=>{ o.querySelector('#iFotoUrl').value='';
        o.querySelector('#iFotoPrev').innerHTML='<span>sem foto</span>'; del.remove(); };
      o.querySelector('#iFoto').onchange = async e =>{
        const arq = e.target.files[0]; if(!arq) return;
        const prev = o.querySelector('#iFotoPrev');
        prev.innerHTML = '<span>enviando…</span>';
        const url = await enviarFoto(arq);
        if(url){ o.querySelector('#iFotoUrl').value = url;
                 prev.innerHTML = `<img src="${url}" alt="">`; }
        else prev.innerHTML = '<span>falhou</span>';
      };
    }});
}
// Envia a foto para o bucket "uniformes" e devolve a URL publica.
async function enviarFoto(arquivo){
  try{
    if(arquivo.size > 5*1024*1024){ toast('Imagem acima de 5 MB.','err'); return null; }
    const ext = (arquivo.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const caminho = `itens/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await S.sb.storage.from('uniformes')
      .upload(caminho, arquivo, {cacheControl:'31536000', upsert:false});
    if(error) throw error;
    const { data } = S.sb.storage.from('uniformes').getPublicUrl(caminho);
    return data.publicUrl;
  }catch(e){ erro(e); return null; }
}

function formTamanho(gradeId){
  if(!exigeGestor()) return;
  const ord = Math.max(0,...S.tamanhos.filter(t=>t.grade_id===gradeId).map(t=>t.ordem))+1;
  modal({titulo:'Novo tamanho', corpo:`
    <div class="row">
      <label class="field"><span>Rótulo <em>*</em></span><input class="inp mono" id="tRot" placeholder="Ex.: 52 ou XGG"></label>
      <label class="field"><span>Ordem na régua</span><input class="inp mono" id="tOrd" type="number" value="${ord}"></label>
    </div>
    <p class="small muted">O tamanho será criado para todos os itens desta grade nesta unidade, com saldo zero.</p>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Adicionar',classe:'pri',acao:async(o,f,b)=>{
      const rot=o.querySelector('#tRot').value.trim(); if(!rot) return toast('Informe o rótulo.','err');
      b.disabled=true;
      try{
        const {error}=await S.sb.from('almox_tamanhos').insert(
          {grade_id:gradeId, rotulo:rot, ordem:Number(o.querySelector('#tOrd').value||ord), unidade_id:S.unidade.id});
        if(error) throw error;
        await carregarBase();
        for(const it of S.itens.filter(i=>i.grade_id===gradeId)) await sincronizarVariacoes(it.id);
        f(); await carregarEstoque(); toast('Tamanho adicionado.','ok'); pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
function removerTamanho(id){
  if(!exigeGestor()) return;
  const t = S.tamanhos.find(x=>x.id===id);
  const comSaldo = S.estoque.filter(e=>e.tamanho_id===id && e.saldo>0);
  confirmar('Remover tamanho',
    comSaldo.length? `Existem ${comSaldo.length} posições com saldo neste tamanho. Ele será apenas desativado e sairá da grade, preservando o histórico.`
                   : `O tamanho <b>${esc(t.rotulo)}</b> sairá da grade. Posições sem movimentação são apagadas; as demais ficam desativadas.`,
    async()=>{
      const { error } = await S.sb.from('almox_tamanhos').update({ativo:false}).eq('id',id);
      if(error) throw error;
      await S.sb.from('almox_variacoes').update({ativo:false}).eq('tamanho_id',id);
      await carregarBase(); await carregarEstoque(); montarNav(); toast('Tamanho removido da grade.','ok'); pintarCadastro();
    },'Remover');
}

        <div class="d">${remessas.filter(r=>r.demorada).length} parado(s) há mais de 4 dias</div></div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1.3fr;align-items:start">
      <div class="card">
        <div class="card-h"><h3>Peças sujas por item</h3><div class="sp"></div>
          <span class="small muted">na fila · em lavagem</span></div>
        ${S.lavanderia.length?`<div class="tbl-wrap"><table><tbody>${S.lavanderia.map(l=>`
          <tr><td><div class="it-nome">${esc(l.item)}</div><div class="it-meta">${esc(l.tamanho)} · ${esc(l.categoria||'—')}</div></td>
            <td class="num" style="width:120px">
              <span class="tag ${l.aguardando_envio?'low':''}">${l.aguardando_envio}</span>
              <span class="tag brand">${l.enviado}</span></td></tr>`).join('')}</tbody></table></div>`

        <div class="tabs" style="margin:0;padding:0 12px">
          ${[['abertas','Em lavagem'],['recebidas','Concluídos'],['todas','Todos']]

function formEnviarLavanderia(){
  if(!podeOperar()) return toast('Sem permissão.','err');
  const disp = S.lavanderia.filter(l=>l.aguardando_envio>0);
  if(!disp.length) return toast('Não há peças aguardando envio.','err');
  modal({titulo:'Enviar lote para a lavanderia interna', wide:true, corpo:`
    <p class="small muted" style="margin-top:0">Lote enviado para a lavanderia interna, na sala ao lado do RH.</p>
    <div class="row">
      <label class="field"><span>Quem vai lavar</span>
        <input class="inp" id="rResp" list="responsaveis" placeholder="Nome de quem ficou com o lote">
        <datalist id="responsaveis">${S.funcionarios.filter(f=>f.ativo)
          .map(f=>`<option>${esc(f.nome)}</option>`).join('')}</datalist></label>
      <label class="field"><span>Observações</span><input class="inp" id="rObs" placeholder="Ex.: lote de segunda"></label>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button type="button" class="btn sm" id="rTudo">Selecionar tudo</button>
      <button type="button" class="btn sm" id="rNada">Limpar</button></div>
    <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:6px"><table>
      <thead><tr><th>Peça</th><th class="num">Aguardando</th><th class="num">Enviar</th></tr></thead>
      <tbody>${disp.map(l=>`<tr>
        <td><div class="it-nome">${esc(l.item)}</div><div class="it-meta">${esc(l.tamanho)}</div></td>
        <td class="num muted">${l.aguardando_envio}</td>
        <td class="num"><input class="inp mono" style="width:80px;text-align:right" type="number" min="0"
          max="${l.aguardando_envio}" value="${l.aguardando_envio}" data-v="${l.variacao_id}"></td>
      </tr>`).join('')}</tbody></table></div>`,
    aoAbrir:o=>{
      o.querySelector('#rTudo').onclick = ()=> o.querySelectorAll('input[data-v]').forEach(i=>i.value=i.max);
      o.querySelector('#rNada').onclick = ()=> o.querySelectorAll('input[data-v]').forEach(i=>i.value=0);
    },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Abrir lote',classe:'pri',acao:async(o,f,b)=>{
      const itens = [...o.querySelectorAll('input[data-v]')]
        .map(i=>({variacao_id:Number(i.dataset.v), quantidade:Number(i.value||0)}))
        .filter(x=>x.quantidade>0);

      b.disabled=true;
      try{
        const {data,error} = await S.sb.rpc('almox_enviar_lavanderia',{
          p_itens:itens, p_responsavel:o.querySelector('#rResp').value||null,
          p_observacoes:o.querySelector('#rObs').value||null, p_unidade_id:S.unidade?.id??null});
        if(error) throw error;
        f(); await depoisDeMovimentar('Lote '+data.codigo+' aberto.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

async function formReceberLavanderia(id){
  const [rem] = await q('almox_vw_remessas','*',b=>b.eq('id',id));
  const itens = await q('almox_remessa_itens','*, almox_variacoes(almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('remessa_id',id));
  const pend = itens.filter(i=>i.quantidade > i.quantidade_retornada + i.quantidade_condenada);
  if(!pend.length) return toast('Remessa já totalmente baixada.','err');
  const nome = i => `${i.almox_variacoes.almox_itens.nome} · ${i.almox_variacoes.almox_tamanhos?.rotulo||'ÚNICO'}`;
  modal({titulo:'Concluir lote '+rem.codigo, wide:true, corpo:`
    <p class="small muted" style="margin-top:0">O que voltou limpo entra no estoque disponível. O que não teve
    conserto sai de vez, com a baixa registrada.</p>

      <thead><tr><th>Peça</th><th class="num">Pendente</th><th class="num">Voltou limpa</th><th class="num">Condenada</th></tr></thead>
      <tbody>${pend.map(i=>{ const p = i.quantidade - i.quantidade_retornada - i.quantidade_condenada;
        return `<tr><td>${esc(nome(i))}</td><td class="num muted">${p}</td>
        <td class="num"><input class="inp mono" style="width:74px;text-align:right" type="number" min="0" max="${p}"
          value="${p}" data-ret="${i.id}"></td>
        <td class="num"><input class="inp mono" style="width:74px;text-align:right" type="number" min="0" max="${p}"
          value="0" data-con="${i.id}"></td></tr>`; }).join('')}</tbody></table></div>
    <div class="row">
      <label class="field"><span>Custo da lavagem (R$)</span><input class="inp mono" id="rCusto" type="number"
        min="0" step="0.01" placeholder="opcional" value="${rem.custo??''}"></label>
      <label class="field"><span>Observações</span><input class="inp" id="rObs2" value="${esc(rem.observacoes||'')}"></label>
    </div>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar retorno',classe:'pri',acao:async(o,f,b)=>{
      const mapa = {};
      o.querySelectorAll('input[data-ret]').forEach(i=> mapa[i.dataset.ret] = {remessa_item_id:Number(i.dataset.ret),
        retornadas:Number(i.value||0), condenadas:0});
      o.querySelectorAll('input[data-con]').forEach(i=> mapa[i.dataset.con].condenadas = Number(i.value||0));
      const lista = Object.values(mapa).filter(x=>x.retornadas>0||x.condenadas>0);
      if(!lista.length) return toast('Informe ao menos uma quantidade.','err');
      b.disabled=true;
      try{
        const {error} = await S.sb.rpc('almox_receber_lavanderia',{

let FD = 'faltando', buscaDot = '';
async function viewDotacao(){
  const dados = await qu('almox_vw_dotacao','*',b=>b.order('funcionario').order('grupo'));
  $('#topAcoes').innerHTML = `
    <input class="inp" style="width:200px" placeholder="Buscar funcionário…" value="${esc(buscaDot)}"
      oninput="buscaDot=this.value;pintarDotacao()">
    <button class="btn" onclick="exportarDotacaoCSV()">Exportar CSV</button>
    ${ehGestor()?`<button class="btn" onclick="abaCad='regras';irPara('cadastros')">Editar regras</button>`:''}`;

  window._dot = dados;
  const porFunc = {};
  dados.forEach(d=>{ (porFunc[d.funcionario_id] ||= {nome:d.funcionario, setor:d.setor, cargo:d.cargo, linhas:[]});
    porFunc[d.funcionario_id].linhas.push(d); });
  window._dotFunc = porFunc;

  $('#view').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-b" style="padding:12px 16px">
      <p class="small muted" style="margin:0">A dotação mede o que cada funcionário tem <b>em posse definitiva</b>.
      Peça emprestada não conta — ela volta. Peça na lavanderia também não, porque ainda não foi entregue a ninguém.</p>
    </div></div>
    <div class="tabs">
      ${[['faltando','Abaixo do mínimo'],['completos','Completos'],['todos','Todos']]
        .map(([k,t])=>`<button data-d="${k}" class="${FD===k?'on':''}">${t}</button>`).join('')}
    </div>
    <div class="card"><div id="dotLista"></div></div>`;
  $$('.tabs button[data-d]').forEach(b=> b.onclick = ()=>{ FD=b.dataset.d;
    $$('.tabs button[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===FD)); pintarDotacao(); });
  pintarDotacao();
}
function pintarDotacao(){
  const t = buscaDot.trim().toLowerCase();
  let lista = Object.entries(window._dotFunc||{}).map(([id,f])=>({id:Number(id),...f,
    falta: f.linhas.reduce((s,l)=>s+l.falta,0)}));
  if(FD==='faltando')  lista = lista.filter(f=>f.falta>0);
  if(FD==='completos') lista = lista.filter(f=>f.falta===0);
  if(t) lista = lista.filter(f=>(f.nome+' '+(f.setor||'')+' '+(f.cargo||'')).toLowerCase().includes(t));
  lista.sort((a,b)=> b.falta-a.falta || a.nome.localeCompare(b.nome));

  const grupos = [...new Set((window._dot||[]).map(d=>d.grupo))].sort();
  $('#dotLista').innerHTML = lista.length? `
    <div class="card-h"><h3>${lista.length} funcionários de ${esc(S.unidade.nome)}</h3><div class="sp"></div>
      <span class="small muted">${lista.reduce((s,f)=>s+f.falta,0)} peças faltando no total</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Funcionário</th><th>Cargo / setor</th>
        ${grupos.map(g=>`<th class="num" style="text-align:center">${esc(g)}</th>`).join('')}
        <th class="num">Falta</th><th></th></tr></thead>
      <tbody>${lista.map(f=>`<tr>
        <td><div class="it-nome">${esc(f.nome)}</div></td>
        <td class="small muted">${esc(f.cargo||'—')}${f.setor?' · '+esc(f.setor):''}</td>
        ${grupos.map(g=>{ const l = f.linhas.find(x=>x.grupo===g);
          if(!l) return '<td class="num muted" style="text-align:center">–</td>';
          return `<td class="num" style="text-align:center"><span class="tag ${l.falta?'zero':'ok'}">
            ${l.em_posse}/${l.quantidade_minima}</span></td>`; }).join('')}
        <td class="num" style="font-weight:600">${f.falta||'—'}</td>
        <td style="text-align:right">
          <button class="btn sm" onclick="fichaFuncionario(${f.id})">Ficha</button>
          ${f.falta&&podeOperar()?`<button class="btn sm pri" onclick="formSaidaFuncionario(null,${f.id})">Entregar</button>`:''}
        </td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty"><b>Nada aqui</b>Nenhum funcionário nesta situação.</div>';
}
function exportarDotacaoCSV(){
  const l = [['Funcionario','Matricula','Cargo','Setor','Grupo','Minimo','Em posse','Emprestado','Falta']];
  (window._dot||[]).forEach(d=>l.push([d.funcionario,d.matricula||'',d.cargo||'',d.setor||'',
    d.grupo,d.quantidade_minima,d.em_posse,d.emprestado,d.falta]));
  const csv = l.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`dotacao-${hoje()}.csv`; a.click();
}

function formRegra(id=null){

  const d = id? S.dotacoes.find(x=>x.id===id):{};
  const grupos = [...new Set([...S.itens.map(i=>i.grupo_dotacao), ...S.dotacoes.map(x=>x.grupo)])].filter(Boolean);
  modal({titulo:id?'Editar regra de dotação':'Nova regra de dotação', corpo:`

      <label class="field"><span>Só para o cargo</span><input class="inp" id="dCargo" list="cargosD" value="${esc(d.cargo||'')}">
        <datalist id="cargosD">${[...new Set(S.funcionarios.map(f=>f.cargo).filter(Boolean))]
          .map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></label>
      <label class="field"><span>Só para o setor</span><input class="inp" id="dSetor" list="setoresD" value="${esc(d.setor||'')}">
        <datalist id="setoresD">${[...new Set(S.funcionarios.map(f=>f.setor).filter(Boolean))]

    </div>
    <label class="field"><span>Observação</span><input class="inp" id="dObsR" value="${esc(d.observacoes||'')}"></label>
    <label class="check"><input type="checkbox" id="dAtivo" ${d.ativo!==false?'checked':''}> Regra ativa</label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Salvar regra',classe:'pri',acao:async(o,f,b)=>{
      const grupo = o.querySelector('#dGrupo').value.trim();

        observacoes:o.querySelector('#dObsR').value.trim()||null, ativo:o.querySelector('#dAtivo').checked,

      try{ const {error} = id? await S.sb.from('almox_dotacoes').update(reg).eq('id',id)
                             : await S.sb.from('almox_dotacoes').insert(reg);

        f(); await carregarBase(); await carregarDotacao(); montarNav(); toast('Regra salva.','ok'); pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
</script>

      <b>não afetam o saldo nem travam a operação</b>. Ficam aqui como registro do que não voltou, para cobrança,
      acerto de rescisão ou só para você saber o tamanho do rombo. Peça que reaparecer é lançada em
      Movimentações → Devolução, e sai desta lista sozinha.</p>
    </div></div>

    <div class="card"><div id="pendLista"></div></div>`;

  $('#pendLista').innerHTML = lista.length ? `
    <div class="card-h"><h3>${lista.length} ex-funcionários</h3><div class="sp"></div>
      <span class="tag zero">${num(lista.reduce((s,f)=>s+f.total,0))} peças em aberto</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Ex-funcionário</th><th>Vínculo</th><th>Desligamento</th><th>Peças não devolvidas</th>
        <th class="num">Qtd</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>${lista.map(f=>`<tr>
        <td><div class="it-nome">${esc(f.funcionario)}</div>
          <div class="it-meta">${esc(f.cargo||'—')}${f.setor?' · '+esc(f.setor):''}</div></td>
        <td><span class="tag">${VINCULOS[f.vinculo||'EFETIVO']}</span></td>
        <td class="small">${dt(f.data_desligamento)}
          ${f.dias_desde_desligamento!=null?`<div class="it-meta">há ${f.dias_desde_desligamento} dias</div>`:''}</td>
        <td class="small">${f.itens.map(i=>`${i.quantidade}× ${esc(i.item)} ${esc(i.tamanho)}
          ${i.tem_cobranca?'<span class="tag low">cobrado</span>':''}`).join('<br>')}</td>
        <td class="num" style="font-weight:600">${f.total}</td>
        <td class="num">${brl(f.valor)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn sm" onclick="fichaFuncionario(${f.funcionario_id})">Ficha</button>
          ${ehGestor()?`<button class="btn sm pri" onclick="formCobrarPendencia(${f.funcionario_id})">Cobrar</button>`:''}
        </td></tr>`).join('')}</tbody></table></div>`
    : `<div class="empty"><b>Nenhuma pendência</b>Todo mundo que saiu devolveu o uniforme.</div>`;

  window._pend = linhas;
}

function exportarPendenciasCSV(){
  const l = [['Ex-funcionario','Matricula','Vinculo','Cargo','Setor','Desligamento','Dias','Item','Tamanho','Qtd','Valor']];
  (window._pend||[]).forEach(x=>l.push([x.funcionario,x.matricula||'',VINCULOS[x.vinculo||'EFETIVO'],
    x.cargo||'',x.setor||'',x.data_desligamento||'',x.dias_desde_desligamento??'',
    x.item,x.tamanho,x.quantidade,x.valor_estimado]));
  const csv = l.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`uniformes-nao-devolvidos-${hoje()}.csv`; a.click();
}

async function formCobrarPendencia(funcId){
  if(!exigeGestor()) return;
  const itens = (window._pend||[]).filter(x=>x.funcionario_id===funcId && !x.tem_cobranca);
  if(!itens.length) return toast('Todas as peças deste ex-funcionário já têm cobrança.','err');
  const padrao = param('custo_extravio_uniforme', 50);
  const fnc = S.funcionarios.find(x=>x.id===funcId) || {};
  modal({titulo:'Gerar cobrança pelas peças não devolvidas', wide:true, corpo:`
    <p class="small muted" style="margin-top:0">Registra a cobrança para acerto de rescisão. Nasce pendente e
    depende da anuência do ex-funcionário para virar desconto (CLT art. 462, §1º), limitada a um mês de
    remuneração no acerto rescisório (art. 477, §5º).</p>
    ${!fnc.termo_assinado_em?`<div class="card" style="border-color:#EBC7C3;background:var(--red-l);margin-bottom:12px">
      <div class="card-b" style="padding:10px 12px"><b style="color:var(--red)">Sem termo de compromisso assinado</b>
      <p class="small" style="margin:4px 0 0">Não há acordo prévio registrado para esta pessoa. A cobrança pode
      ser lançada, mas o desconto dependerá de negociação ou de dolo comprovado.</p></div></div>`:''}
    <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:6px;margin-bottom:14px"><table>
      <thead><tr><th>Peça</th><th class="num">Qtd</th><th class="num">Valor por peça</th></tr></thead>
      <tbody>${itens.map(i=>`<tr>
        <td>${esc(i.item)} · ${esc(i.tamanho)}</td>
        <td class="num">${i.quantidade}</td>
        <td class="num"><input class="inp mono" style="width:96px;text-align:right" type="number" min="0" step="0.01"
          value="${(Number(i.custo_unitario)>0? Number(i.custo_unitario):padrao).toFixed(2)}"
          data-v="${i.variacao_id}" data-q="${i.quantidade}"></td></tr>`).join('')}</tbody></table></div>
    <label class="field"><span>Motivo <em>*</em></span><input class="inp" id="pcMot"
      value="Uniforme não devolvido no desligamento"></label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Gerar cobrança',classe:'pri',acao:async(o,f,b)=>{
      const mot = o.querySelector('#pcMot').value.trim();
      if(!mot) return toast('Informe o motivo.','err');
      const linhas = [...o.querySelectorAll('input[data-v]')].map(i=>({
        variacao_id:Number(i.dataset.v), quantidade:Number(i.dataset.q),
        valor_unitario:Number(i.value||0)})).filter(x=>x.valor_unitario>0);
      if(!linhas.length) return toast('Informe ao menos um valor.','err');
      b.disabled=true;
      try{
        const uni = S.unidade?.codigo || 'VIX';
        for(const l of linhas){
          const { data: cod, error: e1 } = await S.sb.rpc('almox_gerar_codigo',
            {p_prefixo:'COB', p_unidade:uni});
          if(e1) throw e1;
          const { error } = await S.sb.from('almox_cobrancas').insert({
            codigo:cod, unidade_id:S.unidade?.id??null, funcionario_id:funcId,
            variacao_id:l.variacao_id, quantidade:l.quantidade, valor_unitario:l.valor_unitario,
            motivo:mot, usuario_id:S.user.id});
          if(error) throw error;
        }
        f(); await depoisDeMovimentar('Cobrança gerada.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formTermoAssinado(id){
  if(!exigeGestor()) return;
  const f = S.funcionarios.find(x=>x.id===id);
  modal({titulo:'Registrar assinatura do termo', corpo:`
    <p class="small muted" style="margin-top:0">Anote a data em que ${esc(f.nome.split(' ')[0])} assinou o termo
    de compromisso de uniforme. É esse acordo prévio que sustenta a cobrança por peça não devolvida.</p>
    <label class="field"><span>Data da assinatura</span>

    não substitui o papel.</p>`,
    acoes:[ ...(f.termo_assinado_em?[{rotulo:'Limpar', classe:'dan', acao:async(o,fe,b)=>{
        b.disabled=true;
        try{ const {error}=await S.sb.from('almox_funcionarios').update({termo_assinado_em:null}).eq('id',id);

        try{ const {error}=await S.sb.from('almox_funcionarios').update({termo_assinado_em:d}).eq('id',id);
          if(error) throw error; fe(); $('#drawer').innerHTML='';
          await carregarBase(); toast('Assinatura registrada.','ok'); render();
        }catch(e){ erro(e); b.disabled=false; } }}]});
}

function formDesligar(id){
  if(!exigeGestor()) return;
  const f = S.funcionarios.find(x=>x.id===id);
  modal({titulo:'Registrar desligamento', corpo:`
    <p style="margin-top:0">${esc(f.nome)} passa a inativo. Se ficou com uniforme, a peça vira pendência de
    devolução — o estoque não é afetado, porque ela já tinha saído na entrega.</p>
    <label class="field"><span>Data do desligamento</span>
      <input class="inp" id="dgData" type="date" value="${hoje()}"></label>
    <label class="field"><span>Observação</span><input class="inp" id="dgObs"
      placeholder="Ex.: pediu demissão, devolveu 2 camisas"></label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar desligamento',classe:'dan',acao:async(o,fe,b)=>{
      b.disabled=true;
      try{
        const {error} = await S.sb.rpc('almox_desligar_funcionario',{
          p_funcionario_id:id, p_data:o.querySelector('#dgData').value||hoje(),
          p_observacoes:o.querySelector('#dgObs').value||null});
        if(error) throw error;
        fe(); $('#drawer').innerHTML=''; await carregarBase(); await depoisDeMovimentar('Desligamento registrado.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
function reativarFuncionario(id){
  if(!exigeGestor()) return;
  confirmar('Reativar funcionário','O cadastro volta a aparecer nas listas e a contar para a dotação.',
    async()=>{ const {error} = await S.sb.rpc('almox_reativar_funcionario',{p_funcionario_id:id});
      if(error) throw error; $('#drawer').innerHTML=''; await carregarBase();
      await depoisDeMovimentar('Funcionário reativado.'); }, 'Reativar');
}

<script>
/* =====================================================================
   UNIDADES — cadastro e abertura de nova unidade
   ===================================================================== */
async function cadUnidades(){
  $('#topAcoes').innerHTML = ehAdminSistema()
    ? `<button class="btn pri" onclick="formNovaUnidade()">Abrir nova unidade</button>` : '';
  const u = S.unidade;
  const pecas = S.estoque.reduce((t,e)=>t+e.saldo+e.saldo_lavanderia,0);
  $('#cadArea').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-b">
      <p class="small muted" style="margin:0">Cada unidade é um almoxarifado independente: catálogo, tamanhos,
      categorias, fornecedores, regras, estoque, equipe, documentos e logins são só dela. Nada do que você faz
      aqui aparece em outra unidade, e nada de outra unidade aparece aqui.</p>
    </div></div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-h"><h3>Unidade em que você está</h3><div class="sp"></div>
        ${ehGestor()?`<button class="btn sm" onclick="formDadosUnidade()">Dados para documentos</button>`:''}</div>
      <div class="card-b">
        <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
          <div class="kpi"><div class="l">Código</div><div class="v" style="font-size:22px">${esc(u.codigo)}</div>
            <div class="d">${esc(u.nome)}</div></div>
          <div class="kpi"><div class="l">Catálogo</div><div class="v">${num(S.itens.length)}</div>
            <div class="d">itens · ${S.grades.length} grades · ${S.categorias.length} categorias</div></div>
          <div class="kpi"><div class="l">Estoque</div><div class="v">${num(pecas)}</div>
            <div class="d">peças em ${num(S.estoque.length)} posições</div></div>
          <div class="kpi"><div class="l">Equipe</div><div class="v">${num(S.funcionarios.filter(f=>f.ativo).length)}</div>
            <div class="d">funcionários ativos</div></div>
        </div>
      </div>
    </div>

    ${S.acessos.length>1?`<div class="card">
      <div class="card-h"><h3>Suas outras unidades</h3></div>
      <div class="card-b"><div class="uni-lista">
        ${S.acessos.filter(a=>a.id!==u.id).map(a=>`<button class="uni-op" onclick="trocarUnidade(${a.id})">
          <span class="cod">${esc(a.codigo)}</span>
          <span><b>${esc(a.nome)}</b><small>${{GESTOR:'Gestor',OPERADOR:'Operador',LEITURA:'Consulta'}[a.papel]}</small></span>
          <span class="seta">→</span></button>`).join('')}
      </div></div></div>`:''}`;
}

function formNovaUnidade(){
  if(!ehAdminSistema()) return toast('Só o administrador do sistema abre unidade nova.','err');
  modal({titulo:'Abrir nova unidade', corpo:`
    <div class="row">
      <label class="field"><span>Código <em>*</em></span>
        <input class="inp mono" id="unCod" maxlength="8" placeholder="Ex.: SRA"></label>
      <label class="field"><span>Nome <em>*</em></span>
        <input class="inp" id="unNomeN" placeholder="Ex.: Ilha Serra"></label>
    </div>
    <label class="field"><span>Copiar o catálogo de</span><select class="inp" id="unCopia">
      <option value="">Começar do zero</option>
      ${S.acessos.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join('')}
    </select></label>
    <p class="small muted" style="margin:0">Copiar traz itens, grades, tamanhos, categorias e regras já prontos,
    com estoque zerado. A partir daí a unidade segue sozinha — mudar lá não mexe aqui.</p>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Abrir unidade',classe:'pri',acao:async(o,f,b)=>{
      const cod = o.querySelector('#unCod').value.trim().toUpperCase();
      const nome = o.querySelector('#unNomeN').value.trim();
      if(!cod || !nome) return toast('Preencha código e nome.','err');
      b.disabled=true;
      try{
        const {data,error} = await S.sb.rpc('almox_criar_unidade',{
          p_codigo:cod, p_nome:nome, p_copiar_de:o.querySelector('#unCopia').value || null});
        if(error) throw error;
        f(); toast(`Unidade ${data.codigo} aberta. Você entrou como gestor dela.`,'ok');
        location.reload();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

/* =====================================================================
   LOGINS DA UNIDADE — cada gestor cuida dos seus
   ===================================================================== */
async function cadUsuarios(){
  $('#topAcoes').innerHTML = ehGestor()
    ? `<button class="btn pri" onclick="formNovoLogin()">Criar login</button>` : '';
  if(!ehGestor()) return $('#cadArea').innerHTML =
    '<div class="card"><div class="empty">Somente o gestor desta unidade administra os acessos.</div></div>';

  const ac = await q('almox_acessos','id, papel, ativo, usuario_id, almox_usuarios(nome, email, ativo)',
    b=>b.eq('unidade_id', S.unidade.id));

  $('#cadArea').innerHTML = `<div class="card">
    <div class="card-h"><h3>${ac.length} logins em ${esc(S.unidade.codigo)}</h3><div class="sp"></div>
      <span class="small muted">acessos desta unidade apenas</span></div>
    ${ac.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Nome</th><th>E-mail</th><th>Papel nesta unidade</th><th>Ativo</th><th></th></tr></thead>
      <tbody>${ac.map(a=>`<tr${a.ativo?'':' style="opacity:.55"'}>
        <td class="it-nome">${esc(a.almox_usuarios?.nome||'—')}${a.usuario_id===S.user.id?' <span class="tag">você</span>':''}</td>
        <td class="small mono">${esc(a.almox_usuarios?.email||'—')}</td>
        <td><select class="inp" style="width:140px" ${a.usuario_id===S.user.id?'disabled':''}
              onchange="mudarPapelAcesso(${a.id}, this.value)">
          ${['GESTOR','OPERADOR','LEITURA'].map(p=>`<option value="${p}" ${a.papel===p?'selected':''}>
            ${{GESTOR:'Gestor',OPERADOR:'Operador',LEITURA:'Consulta'}[p]}</option>`).join('')}
        </select></td>
        <td><label class="check" style="margin:0"><input type="checkbox" ${a.ativo?'checked':''}
          ${a.usuario_id===S.user.id?'disabled':''} onchange="mudarAtivoAcesso(${a.id}, this.checked)"></label></td>
        <td style="text-align:right">${a.usuario_id===S.user.id?'':
          `<button class="btn sm dan" onclick="removerAcesso(${a.id},'${esc(a.almox_usuarios?.nome||'')}')">Remover</button>`}</td>
      </tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">Nenhum login vinculado ainda.</div>'}
    <div class="card-b small muted" style="border-top:1px solid var(--line)">
      <b>Gestor</b> faz tudo na unidade, inclusive administrar estes logins.
      <b>Operador</b> lança entrada, entrega, empréstimo, devolução e contagem, mas não mexe em cadastro
      nem cancela lançamento. <b>Consulta</b> só lê.
      Remover o acesso não apaga o login da pessoa — ela apenas deixa de enxergar esta unidade.
    </div></div>`;
}

function formNovoLogin(){
  if(!exigeGestor()) return;
  modal({titulo:'Criar login para '+S.unidade.codigo, corpo:`
    <p class="small muted" style="margin-top:0">O login nasce vinculado só a esta unidade. Se a pessoa já tem
    login em outra unidade, use o e-mail dela: o acesso é somado, sem criar cadastro novo.</p>
    <label class="field"><span>Nome <em>*</em></span><input class="inp" id="nlNome" placeholder="Como a pessoa será chamada"></label>
    <div class="row">
      <label class="field"><span>E-mail <em>*</em></span><input class="inp" id="nlMail" type="email" autocomplete="off"></label>
      <label class="field"><span>Papel <em>*</em></span><select class="inp" id="nlPapel">
        <option value="OPERADOR">Operador — lançamentos</option>
        <option value="GESTOR">Gestor — tudo na unidade</option>
        <option value="LEITURA">Consulta — só leitura</option>
      </select></label>
    </div>
    <label class="field"><span>Senha provisória <em>*</em></span>
      <input class="inp mono" id="nlSenha" value="${'Ilha@'+Math.random().toString(36).slice(2,8)}"></label>
    <p class="small muted" style="margin:0">Anote e entregue à pessoa. Ela pode trocar depois em Configurações.</p>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Criar login',classe:'pri',acao:async(o,f,b)=>{
      const nome  = o.querySelector('#nlNome').value.trim();
      const email = o.querySelector('#nlMail').value.trim().toLowerCase();
      const senha = o.querySelector('#nlSenha').value;
      const papel = o.querySelector('#nlPapel').value;
      if(!nome || !email || senha.length < 6)
        return toast('Preencha nome, e-mail e uma senha de ao menos 6 caracteres.','err');
      b.disabled = true;
      try{
        // cliente separado: criar o login não derruba a sua sessão
        const aux = supabase.createClient(cfg().url, cfg().key, {auth:{persistSession:false, autoRefreshToken:false}});
        const { data, error } = await aux.auth.signUp({email, password:senha, options:{data:{nome}}});
        let uid = data?.user?.id;
        if(error){
          if(/registered|exists/i.test(error.message))
            return toast('Já existe login com esse e-mail. Peça o nome exato e use "Vincular login existente".','err');
          throw error;
        }
        if(!uid) throw new Error('Não foi possível criar o login.');
        const { error: e2 } = await S.sb.from('almox_acessos')
          .insert({usuario_id:uid, unidade_id:S.unidade.id, papel});
        if(e2) throw e2;
        await S.sb.from('almox_usuarios').update({nome}).eq('id', uid);
        f();
        modal({titulo:'Login criado', corpo:`
          <p style="margin-top:0">Entregue estes dados a <b>${esc(nome)}</b>:</p>
          <div class="lista-itens"><div class="li"><span class="sp">E-mail</span>
            <span class="mono">${esc(email)}</span></div>
            <div class="li"><span class="sp">Senha provisória</span><span class="mono">${esc(senha)}</span></div>
            <div class="li"><span class="sp">Unidade</span><span class="mono">${esc(S.unidade.codigo)}</span></div></div>
          <p class="small muted" style="margin:12px 0 0">Se o Supabase estiver exigindo confirmação de e-mail,
          a pessoa só entra depois de confirmar. Para equipe interna, desligue isso em
          Authentication → Providers → Email → Confirm email.</p>`, acoes:[{rotulo:'Entendi',classe:'pri'}]});
        pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

async function mudarPapelAcesso(id, papel){
  const {error} = await S.sb.from('almox_acessos').update({papel}).eq('id',id);
  error? erro(error) : toast('Papel atualizado.','ok');
}
async function mudarAtivoAcesso(id, ativo){
  const {error} = await S.sb.from('almox_acessos').update({ativo}).eq('id',id);
  error? erro(error) : toast(ativo?'Acesso liberado.':'Acesso bloqueado.','ok');
}
function removerAcesso(id, nome){
  confirmar('Remover acesso', `<b>${esc(nome)}</b> deixa de enxergar ${esc(S.unidade.codigo)}.
    O login continua existindo e mantém o acesso a outras unidades, se tiver.`,
    async()=>{ const {error} = await S.sb.from('almox_acessos').delete().eq('id',id);
      if(error) throw error; toast('Acesso removido.','ok'); pintarCadastro(); }, 'Remover');
}
</script>
<script>
/* =====================================================================
   DOCUMENTOS LEGAIS
   Termo de compromisso de uniforme e Ficha de controle de EPI (NR-6).
   Base legal citada no rodapé de cada documento. Não substitui a revisão
   do RH ou do advogado trabalhista da empresa.
   ===================================================================== */

const BASE_UNIFORME = [
  'CLT, art. 2º — o poder diretivo e disciplinar do empregador abrange a definição do padrão de apresentação e a aplicação de advertência.',
  'CLT, art. 456-A — cabe ao empregador definir o padrão de vestimenta no ambiente de trabalho, e ao empregado a higienização do uniforme, salvo quando exigir procedimento ou produto diverso do uso comum.',
  'CLT, art. 462, §1º — o desconto por dano causado pelo empregado depende de acordo expresso ou de comprovação de dolo.',
  'CLT, art. 482, alíneas "e" e "h" — a desídia e a indisciplina reiteradas podem configurar falta grave, precedidas das medidas disciplinares cabíveis.',
  'RDC ANVISA nº 216/2004, itens 4.6.4 a 4.6.6 — o manipulador de alimentos deve usar uniforme compatível com a atividade, limpo, em bom estado de conservação, trocado diariamente, e proteção para os cabelos.'
];
const BASE_EPI = [
  'CLT, art. 157, I e II — cabe ao empregador cumprir e fazer cumprir as normas de segurança e instruir os empregados quanto às precauções para evitar acidentes e doenças ocupacionais.',
  'CLT, art. 158, parágrafo único, alínea "b" — constitui ato faltoso do empregado a recusa injustificada ao uso dos equipamentos de proteção individual fornecidos pela empresa.',
  'CLT, art. 166 — a empresa está obrigada a fornecer gratuitamente EPI adequado ao risco e em perfeito estado de conservação e funcionamento.',
  'NR-6, item 6.6.1 — cabe ao empregador adquirir o EPI adequado, exigir seu uso, fornecê-lo gratuitamente, orientar e treinar, substituir quando danificado ou extraviado, responsabilizar-se pela higienização e manutenção, e registrar o seu fornecimento ao trabalhador.',
  'NR-6, item 6.7.1 — cabe ao empregado usar o EPI apenas para a finalidade a que se destina, responsabilizar-se pela guarda e conservação, comunicar qualquer alteração que o torne impróprio e cumprir as determinações do empregador sobre seu uso.',
  'NR-6, item 6.9.3 — o registro do fornecimento pode ser feito em livro, ficha ou sistema eletronizado.'
];
const BASE_FRIO = 'CLT, art. 253 e NR-15, Anexo 9 — o trabalho em câmara frigorífica exige vestimenta adequada ao frio e intervalo de 20 minutos de repouso a cada 1h40 de trabalho contínuo.';

function blocoLegal(titulo, itens){
  return `<div style="border-top:1px solid #999;margin-top:18px;padding-top:8px">
    <div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:4px">${titulo}</div>
    <ol style="margin:0;padding-left:16px;font-size:8.5px;line-height:1.5;color:#333">
      ${itens.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
}
function dadosFuncionario(f){
  return `<div class="rec-dados">
    <div><b>Funcionário</b>${esc(f.nome)}</div>
    <div><b>Matrícula</b>${esc(f.matricula||'—')}</div>
    <div><b>CPF</b>${esc(f.cpf||'—')}</div>
    <div><b>Cargo</b>${esc(f.cargo||'—')}${f.lideranca?' (liderança)':''}</div>
    <div><b>Setor</b>${esc(f.setor||'—')}</div>
    <div><b>Vínculo</b>${VINCULOS[f.vinculo||'EFETIVO']}</div>
    <div><b>Admissão</b>${dt(f.data_admissao)}</div>
    <div><b>Unidade</b>${esc(S.unidade.nome)}</div>
  </div>`;
}

/* ---------- 1. TERMO DE COMPROMISSO DE UNIFORME ---------- */
async function formTermoUniforme(funcId){
  const f = S.funcionarios.find(x=>x.id===funcId);
  if(!f) return;
  const posse = await q('almox_vw_posse','*',b=>b.eq('funcionario_id',funcId));
  modal({titulo:'Termo de compromisso de uniforme', wide:true, corpo:`
    <p class="small muted" style="margin-top:0">Marque as peças que constarão do termo. Vêm marcadas as que
    ${esc(f.nome.split(' ')[0])} tem em posse hoje; dá para incluir qualquer outra e ajustar a quantidade.</p>
    <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:6px;max-height:320px;overflow:auto">
      <table><thead><tr><th style="width:34px"></th><th>Peça</th><th class="num" style="width:90px">Qtd</th></tr></thead>
      <tbody>${S.estoque.filter(e=>e.item_ativo && e.variacao_ativa)
        .sort((a,b)=>a.item.localeCompare(b.item)||a.tamanho_ordem-b.tamanho_ordem)
        .map(e=>{ const p = posse.find(x=>x.variacao_id===e.variacao_id);
        return `<tr><td><input type="checkbox" class="tuSel" value="${e.variacao_id}" ${p?'checked':''}></td>
          <td>${esc(e.item)} · ${esc(e.tamanho)}${p?' <span class="tag ok">em posse</span>':''}</td>
          <td class="num"><input class="inp mono" style="width:70px;text-align:right" type="number" min="1"
            value="${p?p.quantidade:1}" data-v="${e.variacao_id}"></td></tr>`; }).join('')}
      </tbody></table></div>
    <label class="field" style="margin-top:12px"><span>Observação no termo</span>
      <input class="inp" id="tuObs" placeholder="Opcional"></label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Imprimir termo',classe:'pri',acao:(o,fe)=>{
      const linhas = [...o.querySelectorAll('.tuSel:checked')].map(c=>{
        const e = S.estoque.find(x=>x.variacao_id===Number(c.value));
        const q = Number(o.querySelector(`input[data-v="${c.value}"]`).value||1);
        return {q, n:e.item, t:e.tamanho, s:e.sku, epi:e.epi};
      });
      if(!linhas.length) return toast('Selecione ao menos uma peça.','err');
      fe(); imprimirTermoUniforme(f, linhas, o.querySelector('#tuObs').value);
    }}]});
}

function imprimirTermoUniforme(f, linhas, obs){
  const temEpi = linhas.some(l=>l.epi);
  imprimir(`${cabecalhoRecibo('Termo de compromisso de uniforme',
      'TCU-'+(S.unidade.codigo)+'-'+hoje().replace(/-/g,'').slice(2))}
    <div style="background:#eee;border:1px solid #999;padding:5px 8px;font-size:10px;
                letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:14px">
      Via da empresa — arquivar no dossiê do funcionário</div>
    ${dadosFuncionario(f)}
    ${tabelaRecibo(linhas)}
    ${obs?`<p style="font-size:11px;margin:-6px 0 12px"><b>Observação:</b> ${esc(obs)}</p>`:''}
    <div class="rec-termo">
      <b>DECLARAÇÃO E COMPROMISSO</b><br><br>
      Declaro ter recebido de ${esc(CONFIG.EMPRESA)} — ${esc(S.unidade.nome)} as peças de uniforme
      relacionadas acima, nas quantidades e tamanhos discriminados, conferidas por mim e em perfeitas
      condições de uso, e assumo os seguintes compromissos:<br><br>

      <b>1. Uso e apresentação.</b> Comprometo-me a comparecer ao trabalho devidamente uniformizado em toda a
      jornada, com o uniforme limpo, íntegro e adequado à minha função, observando o padrão de vestimenta
      definido pela empresa e as regras de higiene aplicáveis aos serviços de alimentação.<br><br>

      <b>2. Conservação e higienização.</b> Responsabilizo-me pela guarda, conservação e higienização das peças
      recebidas, devolvendo-as sempre que substituídas e no ato do desligamento.<br><br>

      <b>3. Esquecimento ou não uso.</b> Estou ciente de que comparecer ao trabalho sem o uniforme completo,
      ou com o uniforme em condições inadequadas, caracteriza descumprimento de norma interna e poderá
      ensejar a aplicação de <b>advertência</b>, no exercício regular do poder disciplinar do empregador,
      sem prejuízo das medidas cabíveis em caso de reiteração.<br><br>

      <b>4. Empréstimo de peça.</b> Quando eu receber peça a título de empréstimo, comprometo-me a devolvê-la
      no prazo combinado e <b>nas mesmas condições em que a recebi</b>, ressalvado o desgaste natural do uso.
      Estou ciente de que a não devolução, ou a devolução em estado que inviabilize o reaproveitamento por
      dano decorrente de uso indevido, poderá gerar cobrança do valor de reposição, cujo desconto em folha
      <b>depende da minha anuência expressa</b> ou da comprovação de dolo, nos termos da lei.<br><br>

      <b>5. Extravio e dano.</b> Estou ciente de que a perda, o extravio ou o dano causado por uso indevido
      poderão ser objeto de reposição ou de ressarcimento, observada a mesma regra do item anterior, e de que
      me será assegurado o direito de apresentar justificativa antes de qualquer desconto.
      ${temEpi?`<br><br><b>6. Equipamentos de proteção individual.</b> Declaro ter recebido orientação sobre o uso
      correto, a guarda e a conservação dos EPI acima assinalados, e estou ciente de que a recusa injustificada
      ao seu uso constitui ato faltoso, conforme a legislação de segurança do trabalho.`:''}
    </div>
    ${assinaturas(f.nome)}
    ${blocoLegal('Fundamentação legal', temEpi ? BASE_UNIFORME.concat([BASE_EPI[1]]) : BASE_UNIFORME)}
    <div style="margin-top:10px;font-size:8.5px;color:#666">
      Documento gerado pelo ${esc(CONFIG.SISTEMA)} em ${new Date().toLocaleString('pt-BR')}.
      Recomenda-se a revisão do texto pelo RH ou pela assessoria jurídica trabalhista da empresa antes da adoção
      em larga escala.</div>`);
}

/* ---------- 2. FICHA DE CONTROLE DE EPI (NR-6) ---------- */
async function fichaEPI(funcId){
  const f = S.funcionarios.find(x=>x.id===funcId);
  if(!f) return;
  const movs = await q('almox_vw_movimentacoes','*',
    b=>b.eq('funcionario_id',funcId).eq('cancelada',false)
        .in('tipo',['SAIDA_FUNCIONARIO','SAIDA_EMPRESTIMO','ENTRADA_DEVOLUCAO','ENTRADA_RETORNO_EMPRESTIMO'])
        .order('data'));
  const epis = new Set(S.itens.filter(i=>i.epi).map(i=>i.nome));
  const linhas = movs.filter(m=>epis.has(m.item));
  if(!linhas.length) return toast('Este funcionário ainda não recebeu nenhum EPI.','err');

  const caDe = nome => S.itens.find(i=>i.nome===nome)?.ca_epi || '';
  const semCA = [...new Set(linhas.filter(l=>!caDe(l.item)).map(l=>l.item))];

  imprimir(`${cabecalhoRecibo('Ficha de controle de EPI',
      'EPI-'+(S.unidade.codigo)+'-'+String(f.id).padStart(4,'0'))}
    <div style="background:#eee;border:1px solid #999;padding:5px 8px;font-size:10px;
                letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px">
      Registro de fornecimento de equipamento de proteção individual — NR-6, item 6.6.1</div>
    <div style="font-size:9.5px;color:#444;margin-bottom:12px">
      ${esc(CONFIG.EMPRESA)} — ${esc(S.unidade.nome)}${S.unidade.cnpj?' · CNPJ '+esc(S.unidade.cnpj):''}
      ${S.unidade.endereco?'<br>'+esc(S.unidade.endereco):''}</div>
    ${dadosFuncionario(f)}
    <table><thead><tr>
      <th style="width:70px">Data</th><th>Equipamento</th><th style="width:70px">Tamanho</th>
      <th style="width:70px">CA</th><th style="width:34px">Qtd</th><th style="width:78px">Motivo</th>
      <th style="width:150px">Assinatura do empregado</th></tr></thead>
      <tbody>${linhas.map(l=>`<tr>
        <td class="mono" style="font-size:10px">${dt(l.data)}</td>
        <td style="font-size:10.5px">${esc(l.item)}</td>
        <td style="text-align:center;font-size:10.5px">${esc(l.tamanho)}</td>
        <td class="mono" style="font-size:10px;text-align:center">${esc(caDe(l.item) || '—')}</td>
        <td style="text-align:center" class="mono">${l.quantidade}</td>
        <td style="font-size:9px">${l.e_entrada ? 'Devolução'
            : l.tipo==='SAIDA_EMPRESTIMO' ? 'Empréstimo' : 'Fornecimento'}</td>
        <td></td></tr>`).join('')}
        ${Array.from({length:Math.max(0, 6-linhas.length)}).map(()=>
          `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}
      </tbody></table>
    ${semCA.length?`<p style="font-size:9.5px;color:#8a2b00;border:1px solid #d9a06a;background:#fdf3e9;
       padding:6px 8px;margin:-6px 0 12px"><b>Atenção:</b> sem número de CA cadastrado para:
       ${esc(semCA.join('; '))}. O Certificado de Aprovação é exigido pela fiscalização — preencha no cadastro do item.</p>`:''}
    <div class="rec-termo">
      <b>DECLARAÇÃO DO EMPREGADO</b><br>
      Declaro que recebi gratuitamente da empresa os equipamentos de proteção individual acima relacionados,
      adequados ao risco da minha atividade e em perfeito estado de conservação e funcionamento, e que fui
      orientado e treinado quanto ao seu uso correto, guarda, conservação e higienização.<br><br>
      Comprometo-me a: usar o EPI apenas para a finalidade a que se destina e durante toda a exposição ao risco;
      responsabilizar-me pela guarda e conservação; comunicar imediatamente ao responsável qualquer alteração
      que o torne impróprio para uso; e cumprir as determinações da empresa sobre o seu uso.<br><br>
      Estou ciente de que <b>a recusa injustificada ao uso do EPI constitui ato faltoso</b>, sujeito às medidas
      disciplinares cabíveis, e de que a perda ou danificação por uso indevido deve ser comunicada para
      substituição.
    </div>
    <div class="rec-ass">
      <div>${esc(f.nome)}<br><span style="font-size:10px;color:#555">Empregado — assinatura e data</span></div>
      <div>${esc(S.unidade.responsavel_epi || S.perfil.nome)}<br>
        <span style="font-size:10px;color:#555">Responsável pela entrega — assinatura e data</span></div>
    </div>
    ${blocoLegal('Fundamentação legal', BASE_EPI.concat(
       linhas.some(l=>/TÉRMICA|JAPONA|BALACLAVA/i.test(l.item)) ? [BASE_FRIO] : []))}
    <div style="margin-top:10px;font-size:8.5px;color:#666">
      Ficha gerada pelo ${esc(CONFIG.SISTEMA)} em ${new Date().toLocaleString('pt-BR')} a partir dos
      lançamentos registrados. Guardar assinada e disponível para a fiscalização.
      Registro eletrônico admitido pela NR-6, item 6.9.3.</div>`);
}

/* ---------- dados da unidade para os documentos ---------- */
function formDadosUnidade(){
  if(!exigeGestor()) return;
  const u = S.unidade;
  modal({titulo:'Dados da unidade nos documentos', corpo:`
    <p class="small muted" style="margin-top:0">Aparecem no cabeçalho da ficha de EPI, que é o documento
    que a fiscalização pede.</p>
    <label class="field"><span>Razão social / nome no documento</span>
      <input class="inp" id="duNome" value="${esc(u.nome)}"></label>
    <label class="field"><span>CNPJ</span><input class="inp mono" id="duCnpj" value="${esc(u.cnpj||'')}"
      placeholder="00.000.000/0000-00"></label>
    <label class="field"><span>Endereço</span><input class="inp" id="duEnd" value="${esc(u.endereco||'')}"></label>
    <label class="field"><span>Responsável pela entrega de EPI</span>
      <input class="inp" id="duResp" value="${esc(u.responsavel_epi||'')}"
        placeholder="Quem assina a ficha pela empresa"></label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Salvar',classe:'pri',acao:async(o,f,b)=>{
      b.disabled=true;
      const reg = {nome:o.querySelector('#duNome').value.trim(),
        cnpj:o.querySelector('#duCnpj').value.trim()||null,
        endereco:o.querySelector('#duEnd').value.trim()||null,
        responsavel_epi:o.querySelector('#duResp').value.trim()||null};
      if(!reg.nome) return toast('Informe o nome.','err');
      try{ const {error} = await S.sb.from('almox_unidades').update(reg).eq('id',u.id);
        if(error) throw error;
        Object.assign(S.unidade, reg);
        const a = S.acessos.find(x=>x.id===u.id); if(a) Object.assign(a, reg);
        f(); pintarUnidade(); toast('Dados salvos.','ok'); pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
</script>
</body>
