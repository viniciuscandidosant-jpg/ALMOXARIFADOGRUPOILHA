/* --------------------- ESTOQUE : MATRIZ ITEM x TAMANHO --------------- */
let filtroCat = 'todas', filtroBusca = '';

async function viewEstoque(){
  await carregarEstoque();
  $('#topAcoes').innerHTML = `
    <input class="inp" style="width:200px" placeholder="Buscar item…" value="${esc(filtroBusca)}"
      oninput="filtroBusca=this.value;agendarMatriz()">
    <select class="inp" style="width:180px" onchange="filtroCat=this.value;desenharMatriz()">
      <option value="todas">Todas as categorias</option>
      ${S.categorias.map(c=>`<option value="${c.id}" ${filtroCat==String(c.id)?'selected':''}>${esc(c.nome)}</option>`).join('')}
    </select>
    <button class="btn" onclick="exportarEstoqueCSV()">Exportar CSV</button>
    ${ehGestor()?`<button class="btn" onclick="recalcularSaldos()">Recalcular saldos</button>`:''}`;
  $('#view').innerHTML = `<div id="matrizes"></div>`;
  desenharMatriz();
}

let _tMatriz;
function agendarMatriz(){ clearTimeout(_tMatriz); _tMatriz = setTimeout(desenharMatriz, 180); }
function desenharMatriz(){
  const busca = filtroBusca.trim().toLowerCase();
  let dados = S.estoque.filter(e=>e.variacao_ativa && e.item_ativo);
  if(filtroCat!=='todas') dados = dados.filter(e=>String(e.categoria_id)===filtroCat);
  if(busca) dados = dados.filter(e=>(e.item+' '+(e.categoria||'')+' '+(e.cor||'')).toLowerCase().includes(busca));

  if(!dados.length) return $('#matrizes').innerHTML =
    `<div class="card"><div class="empty"><b>Nada encontrado</b>Ajuste a busca ou cadastre itens em “Itens e grades”.</div></div>`;

  // agrupa por grade -> item
  const porGrade = {};
  dados.forEach(e=>{ (porGrade[e.grade_id] ||= {grade:e.grade, grade_id:e.grade_id, itens:{}});
    (porGrade[e.grade_id].itens[e.item_id] ||= {nome:e.item, cat:e.categoria, cor:e.cor, epi:e.epi,
      foto:(S.itens.find(x=>x.id===e.item_id)||{}).foto_url, cels:{}, total:0});
    porGrade[e.grade_id].itens[e.item_id].cels[e.tamanho_id ?? 'u'] = e;
    porGrade[e.grade_id].itens[e.item_id].total += e.saldo;
  });

  $('#matrizes').innerHTML = Object.values(porGrade).map(g=>{
    const tams = tamanhosDaGrade(g.grade_id);
    const itens = Object.values(g.itens).sort((a,b)=>a.nome.localeCompare(b.nome));
    const totalGrade = itens.reduce((s,i)=>s+i.total,0);
    return `<div class="matriz">
      <div class="matriz-h"><h3>${esc(g.grade)}</h3>
        <span class="g">${itens.length} itens · ${num(totalGrade)} peças</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th class="item-col">Item</th>
          ${tams.map(t=>`<th class="num" style="text-align:center">${esc(t.rotulo)}</th>`).join('')}
          <th class="num">Total</th></tr></thead>
        <tbody>${itens.map(it=>`<tr>
          <td class="item-col"><div class="it-linha">
            ${it.foto?`<img class="mini" src="${esc(it.foto)}" alt="" loading="lazy">`:'<div class="mini-vazia"></div>'}
            <div><div class="it-nome">${esc(it.nome)}</div>
            <div class="it-meta">${esc(it.cat||'—')}${it.epi?' · EPI':''}</div></div></div></td>
          ${tams.map(t=>{
            const c = it.cels[t.id];
            if(!c) return `<td><button class="cel na" disabled>–</button></td>`;
            const cls = c.saldo<=0?'zero':(c.situacao==='BAIXO'?'low':'');
            return `<td><button class="cel ${cls}" onclick="drawerVariacao(${c.variacao_id})"
                      title="${esc(it.nome)} ${esc(t.rotulo)} — disponível ${c.saldo}, mínimo ${c.estoque_minimo}${c.saldo_lavanderia?', '+c.saldo_lavanderia+' na lavanderia':''}">${c.saldo}
                      ${c.saldo_lavanderia?`<span class="lav">+${c.saldo_lavanderia} lav</span>`:
                        c.situacao!=='OK'?`<span class="m">mín ${c.estoque_minimo}</span>`:''}</button></td>`;
          }).join('')}
          <td class="num" style="font-weight:600">${num(it.total)}</td>
        </tr>`).join('')}</tbody></table></div></div>`;
  }).join('');
}

async function drawerVariacao(id){
  const e = S.estoque.find(x=>x.variacao_id===id);
  if(!e) return;
  const d = drawer({
    titulo: e.item,
    sub: `${esc(e.tamanho)} · ${esc(e.categoria||'—')} · <span class="mono">${esc(e.sku||'')}</span>${
      (S.itens.find(x=>x.id===e.item_id)?.setores_uso||[]).length
        ? '<br>Usado por: '+esc((S.itens.find(x=>x.id===e.item_id).setores_uso||[]).join(', '))
          + (S.itens.find(x=>x.id===e.item_id).observacao_uso
             ? ' — '+esc(S.itens.find(x=>x.id===e.item_id).observacao_uso) : '')
        : ''}`,
    corpo: `
      ${(S.itens.find(x=>x.id===e.item_id)||{}).foto_url
        ? `<img src="${esc(S.itens.find(x=>x.id===e.item_id).foto_url)}" alt=""
             style="width:100%;max-height:190px;object-fit:cover;border-radius:8px;margin-bottom:16px;border:1px solid var(--line)">`
        : ''}
      <div class="kpis" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px">
        <div class="kpi ${e.situacao==='ZERADO'?'bad':e.situacao==='BAIXO'?'warn':'good'}" style="padding:12px 14px">
          <div class="l">Disponível</div><div class="v" style="font-size:24px">${e.saldo}</div></div>
        <div class="kpi ${e.saldo_lavanderia?'warn':''}" style="padding:12px 14px">
          <div class="l">Lavanderia</div><div class="v" style="font-size:24px">${e.saldo_lavanderia}</div></div>
        <div class="kpi" style="padding:12px 14px"><div class="l">Mínimo</div><div class="v" style="font-size:24px">${e.estoque_minimo}</div></div>
        <div class="kpi" style="padding:12px 14px"><div class="l">Valor</div><div class="v" style="font-size:16px">${brl(e.valor_estoque)}</div></div>
      </div>
      ${podeOperar()?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
        <button class="btn sm" onclick="formEntradaCompra(${id})">Entrada</button>
        <button class="btn sm" onclick="formSaidaFuncionario(${id})">Entregar</button>
        <button class="btn sm" onclick="formEmprestimo(${id})">Emprestar</button>
        <button class="btn sm" onclick="formDevolucao(${id})">Devolução</button>
        <button class="btn sm dan" onclick="formDescarte(${id})">Descarte</button>
      </div>`:''}
      <h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-family:var(--mono);margin-bottom:8px">Últimas movimentações</h4>
      <div id="histVar" class="muted small">Carregando…</div>`
  });
  const h = await q('almox_vw_movimentacoes','*',b=>b.eq('variacao_id',id).order('data',{ascending:false}).limit(30));
  const el = d.ovl.querySelector('#histVar');
  el.innerHTML = h.length ? `<div class="tbl-wrap"><table><tbody>${h.map(m=>`
    <tr${m.cancelada?' style="opacity:.45;text-decoration:line-through"':''}>
      <td style="width:88px" class="small muted">${dth(m.data)}</td>
      <td><span class="tag ${m.e_entrada?'in':'out'}">${m.e_entrada?'+':'−'}${m.quantidade}</span>
        <div class="it-meta" style="margin-top:3px">${esc(TIPOS[m.tipo])}${m.funcionario?' · '+esc(m.funcionario):''}</div></td>
      <td class="num small muted">${m.saldo_posterior ?? ''}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">Sem movimentações.</div>';
}

async function recalcularSaldos(){
  if(!exigeGestor()) return;
  confirmar('Recalcular saldos','Os saldos serão reconstruídos a partir do histórico de movimentações. Use quando desconfiar de divergência.',
    async()=>{ const {data,error}=await S.sb.rpc('almox_recalcular_saldos',{p_unidade_id:S.unidade.id}); if(error) throw error;
      toast(data.length? `${data.length} saldo(s) corrigido(s).`:'Nenhuma divergência encontrada.','ok');
      await carregarEstoque(); desenharMatriz(); montarNav(); }, 'Recalcular');
}
function exportarEstoqueCSV(){
  const linhas = [['Categoria','Item','Tamanho','SKU','Saldo','Minimo','Situacao','Custo','Valor']];
  S.estoque.filter(e=>e.variacao_ativa && e.item_ativo).forEach(e=>linhas.push([e.categoria,e.item,e.tamanho,e.sku,e.saldo,e.estoque_minimo,e.situacao,e.custo_referencia,e.valor_estoque]));
  const csv = linhas.map(l=>l.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8'}));
  a.download = `estoque-uniformes-${hoje()}.csv`; a.click();
}
</script>
<script>
/* =====================================================================
   SELETOR DE ITENS (usado em todos os lançamentos)
   ===================================================================== */
function htmlSeletor(comCusto=false){
  return `<div class="pick">
      <label class="field"><span>Item</span>
        <select class="inp" id="selItem"><option value="">Selecione…</option>
        ${S.itens.filter(i=>i.ativo).map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('')}
        </select></label>
      <label class="field" style="max-width:130px"><span>Tamanho</span>
        <select class="inp" id="selTam"><option value="">—</option></select></label>
      <label class="field" style="max-width:88px"><span>Qtd</span>
        <input class="inp mono" id="selQtd" type="number" min="1" value="1"></label>
      ${comCusto?`<label class="field" style="max-width:120px"><span>Custo un. (R$)</span>
        <input class="inp mono" id="selCusto" type="number" min="0" step="0.01" placeholder="0,00"></label>`:''}
      <button type="button" class="btn" id="btnAdd">Adicionar</button>
    </div>
    <div id="selInfo" class="small muted" style="margin:-6px 0 10px"></div>
    <div class="lista-itens" id="listaSel"><div class="li muted">Nenhum item incluído.</div></div>`;
}
function ligarSeletor(ovl, preVarId=null, comCusto=false){
  ovl._itens = [];
  const si=ovl.querySelector('#selItem'), st=ovl.querySelector('#selTam'),
        sq=ovl.querySelector('#selQtd'), sc=ovl.querySelector('#selCusto'),
        info=ovl.querySelector('#selInfo');

  const varsDoItem = id => S.estoque.filter(e=>e.item_id==id && e.variacao_ativa)
                            .sort((a,b)=>a.tamanho_ordem-b.tamanho_ordem);
  function popularTam(){
    const vs = varsDoItem(si.value);
    st.innerHTML = vs.map(v=>`<option value="${v.variacao_id}">${esc(v.tamanho)} (saldo ${v.saldo})</option>`).join('')
                  || '<option value="">—</option>';
    mostrarInfo();
  }
  function mostrarInfo(){
    const v = S.estoque.find(e=>e.variacao_id==st.value);
    info.textContent = v ? `Saldo atual: ${v.saldo} · mínimo ${v.estoque_minimo} · ${v.sku||''}` : '';
  }
  si.onchange = popularTam; st.onchange = mostrarInfo;

  ovl.querySelector('#btnAdd').onclick = ()=>{
    const vid = Number(st.value), qtd = Number(sq.value);
    if(!vid) return toast('Escolha o item e o tamanho.','err');
    if(!qtd || qtd<1) return toast('Quantidade inválida.','err');
    const v = S.estoque.find(e=>e.variacao_id===vid);
    const ex = ovl._itens.find(x=>x.variacao_id===vid);
    if(ex) ex.quantidade += qtd;
    else ovl._itens.push({variacao_id:vid, quantidade:qtd, saldo:v.saldo,
            custo: sc? Number(sc.value||0) : null, rotulo:`${v.item} · ${v.tamanho}`});
    sq.value = 1; if(sc) sc.value='';
    pintar();
  };
  function pintar(){
    const l = ovl.querySelector('#listaSel');
    l.innerHTML = ovl._itens.length ? ovl._itens.map((x,i)=>`
      <div class="li"><span class="qt">${x.quantidade}×</span><span class="sp">${esc(x.rotulo)}
        ${x.custo?`<span class="muted small"> — ${brl(x.custo)}/un</span>`:''}</span>
        <span class="small muted">saldo ${x.saldo}</span>
        <button type="button" class="btn sm dan" data-i="${i}">Remover</button></div>`).join('')
      : '<div class="li muted">Nenhum item incluído.</div>';
    l.querySelectorAll('button[data-i]').forEach(b=> b.onclick=()=>{ ovl._itens.splice(+b.dataset.i,1); pintar(); });
  }
  if(preVarId){
    const v = S.estoque.find(e=>e.variacao_id===preVarId);
    if(v){ si.value = v.item_id; popularTam(); st.value = String(preVarId); mostrarInfo(); }
  }
  pintar();
}
const exigirItens = ovl => { if(!ovl._itens.length){ toast('Inclua ao menos um item.','err'); return false; } return true; };

// Aceita fornecedor digitado: usa o existente ou cadastra na hora.
async function idFornecedor(nome){
  nome = (nome||'').trim();
  if(!nome) return null;
  const achado = S.fornecedores.find(f=>f.nome.toLowerCase() === nome.toLowerCase());
  if(achado) return achado.id;
  if(!ehGestor()){ toast('Fornecedor novo só pode ser criado pelo gestor. Lançamento seguirá sem fornecedor.','err'); return null; }
  const { data, error } = await S.sb.from('almox_fornecedores').insert({nome, unidade_id:S.unidade.id}).select().single();
  if(error){ erro(error); return null; }
  S.fornecedores.push(data);
  return data.id;
}

async function gravarMovs(linhas){
  const base = { unidade_id: S.unidade?.id ?? null, usuario_id: S.user.id };
  const { error } = await S.sb.from('almox_movimentacoes').insert(linhas.map(l=>({...base, ...l})));
  if(error) throw error;
}
async function depoisDeMovimentar(msg){
  toast(msg,'ok');
  await Promise.all([carregarEstoque(), carregarAtrasados(), carregarLavanderia(),
                     carregarDotacao(), carregarCobrancas(), carregarPendencias()]);
  montarNav(); render();
}

/* =====================================================================
   LANCAMENTOS
   ===================================================================== */
function formEntradaCompra(varId=null){
  if(!podeOperar()) return toast('Sem permissão para lançar.','err');
  modal({titulo:'Entrada por compra', wide:true, corpo:`
    <div class="row-3">
      <label class="field"><span>Fornecedor</span>
        <input class="inp" id="fFor" list="fornecedores" placeholder="Digite o nome — cria se não existir">
        <datalist id="fornecedores">${S.fornecedores.filter(f=>f.ativo)
          .map(f=>`<option>${esc(f.nome)}</option>`).join('')}</datalist></label>
      <label class="field"><span>Nota fiscal / pedido</span><input class="inp" id="fDoc" placeholder="NF 12345"></label>
      <label class="field"><span>Data</span><input class="inp" id="fData" type="date" value="${hoje()}"></label>
    </div>
    ${htmlSeletor(true)}
    <label class="field" style="margin-top:14px"><span>Observações</span><textarea class="inp" id="fObs"></textarea></label>`,
    aoAbrir:o=>ligarSeletor(o, varId, true),
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar entrada',classe:'pri',acao:async(o,f,b)=>{
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        const data = o.querySelector('#fData').value;
        const forn = await idFornecedor(o.querySelector('#fFor').value);
        const quando = data ? new Date(data+'T12:00:00').toISOString() : new Date().toISOString();
        await gravarMovs(o._itens.map(x=>({
          variacao_id:x.variacao_id, tipo:'ENTRADA_COMPRA', quantidade:x.quantidade,
          custo_unitario: x.custo || null,
          data: quando,
          fornecedor_id: forn,
          documento: o.querySelector('#fDoc').value || null,
          justificativa: 'Compra',
          observacoes: o.querySelector('#fObs').value || null
        })));
        f(); depoisDeMovimentar('Entrada registrada.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formSaidaFuncionario(varId=null, funcId=null){
  if(!podeOperar()) return toast('Sem permissão para lançar.','err');
  modal({titulo:'Entrega definitiva a funcionário', wide:true, corpo:`
    <div class="row">
      <label class="field"><span>Funcionário de ${esc(S.unidade.codigo)} <em>*</em></span><select class="inp" id="fFunc">
        <option value="">Selecione…</option>
        ${S.funcionarios.filter(f=>f.ativo).map(f=>`<option value="${f.id}">${esc(f.nome)}${f.setor?' — '+esc(f.setor):''}</option>`).join('')}
      </select></label>
      <label class="field"><span>Justificativa <em>*</em></span><select class="inp" id="fJust">
        <option>Uniforme inicial (admissão)</option>
        <option>Troca por desgaste</option>
        <option>Troca por dano</option>
        <option>Troca de tamanho</option>
        <option>Perda pelo funcionário</option>
        <option>Reposição periódica</option>
        <option value="__outro">Outro motivo…</option>
      </select></label>
    </div>
    <label class="field hide" id="fJustOutroBox"><span>Descreva o motivo <em>*</em></span><input class="inp" id="fJustOutro"></label>
    ${htmlSeletor(false)}
    <label class="field" style="margin-top:14px"><span>Observações</span><textarea class="inp" id="fObs"></textarea></label>
    <label class="check"><input type="checkbox" id="fRecibo" checked> Imprimir termo de entrega para arquivo</label>`,
    aoAbrir:o=>{
      ligarSeletor(o, varId);
      if(funcId) o.querySelector('#fFunc').value = String(funcId);
      o.querySelector('#fJust').onchange = e =>
        o.querySelector('#fJustOutroBox').classList.toggle('hide', e.target.value!=='__outro');
    },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar entrega',classe:'pri',acao:async(o,f,b)=>{
      const func = o.querySelector('#fFunc').value;
      let just = o.querySelector('#fJust').value;
      if(just==='__outro') just = o.querySelector('#fJustOutro').value.trim();
      if(!func) return toast('Selecione o funcionário.','err');
      if(!just) return toast('A justificativa é obrigatória.','err');
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        const { data: codigo, error } = await S.sb.rpc('almox_saida_funcionario',{
          p_funcionario_id: Number(func),
          p_itens: o._itens.map(x=>({variacao_id:x.variacao_id, quantidade:x.quantidade})),
          p_justificativa: just,
          p_observacoes: o.querySelector('#fObs').value || null,
          p_unidade_id: S.unidade?.id ?? null
        });
        if(error) throw error;
        const gerar = o.querySelector('#fRecibo').checked;
        f(); await depoisDeMovimentar('Entrega '+codigo+' registrada.');
        if(gerar) termoEntrega(codigo);
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formEmprestimo(varId=null, funcId=null){
  if(!podeOperar()) return toast('Sem permissão para lançar.','err');
  const d = new Date(); d.setDate(d.getDate()+7);
  modal({titulo:'Empréstimo com recibo', wide:true, corpo:`
    <div class="row-3">
      <label class="field"><span>Funcionário de ${esc(S.unidade.codigo)} <em>*</em></span><select class="inp" id="fFunc">
        <option value="">Selecione…</option>
        ${S.funcionarios.filter(f=>f.ativo).map(f=>`<option value="${f.id}">${esc(f.nome)}${f.setor?' — '+esc(f.setor):''}</option>`).join('')}
      </select></label>
      <label class="field"><span>Previsão de devolução</span>
        <input class="inp" id="fPrev" type="date" value="${d.toISOString().slice(0,10)}"></label>
      <label class="field"><span>Motivo</span><select class="inp" id="fMot">
        <option>Uso temporário na câmara fria</option>
        <option>Cobertura de turno</option>
        <option>Evento / ação externa</option>
        <option>Substituição enquanto aguarda tamanho</option>
        <option>Visitante / prestador</option>
      </select></label>
    </div>
    ${htmlSeletor(false)}
    <label class="field" style="margin-top:14px"><span>Observações</span><textarea class="inp" id="fObs"
      placeholder="Estado da peça na saída, avarias, etc."></textarea></label>`,
    aoAbrir:o=>{ ligarSeletor(o, varId); if(funcId) o.querySelector('#fFunc').value = String(funcId); },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Gerar empréstimo e recibo',classe:'pri',acao:async(o,f,b)=>{
      const func = o.querySelector('#fFunc').value;
      if(!func) return toast('Selecione o funcionário.','err');
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        const { data, error } = await S.sb.rpc('almox_registrar_emprestimo',{
          p_funcionario_id: Number(func),
          p_itens: o._itens.map(x=>({variacao_id:x.variacao_id, quantidade:x.quantidade})),
          p_previsao_devolucao: o.querySelector('#fPrev').value || null,
          p_motivo: o.querySelector('#fMot').value,
          p_observacoes: o.querySelector('#fObs').value || null,
          p_unidade_id: S.unidade?.id ?? null
        });
        if(error) throw error;
        f(); await depoisDeMovimentar('Empréstimo '+data.codigo+' registrado.');
        reciboEmprestimo(data.id);
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formDevolucao(varId=null){
  if(!podeOperar()) return toast('Sem permissão para lançar.','err');
  modal({titulo:'Entrada por devolução', wide:true, corpo:`
    <p class="small muted" style="margin-top:0">Para peças que voltam fora de um empréstimo — desligamento, troca de tamanho
    ou peça entregue por engano. Peça usada não volta direto ao estoque: entra na fila da lavanderia interna e só
    fica disponível quando o lote for concluído.</p>
    <div class="row">
      <label class="field"><span>Funcionário que devolveu <em>*</em></span><select class="inp" id="fFunc">
        <option value="">Selecione…</option>
        ${S.funcionarios.map(f=>`<option value="${f.id}">${esc(f.nome)}${f.ativo?'':' (inativo)'}</option>`).join('')}
      </select></label>
      <label class="field"><span>Motivo <em>*</em></span><select class="inp" id="fJust">
        <option>Desligamento — devolução de uniforme</option>
        <option>Troca de tamanho</option>
        <option>Peça não utilizada</option>
        <option>Transferência de unidade</option>
        <option value="__outro">Outro motivo…</option>
      </select></label>
    </div>
    <label class="field hide" id="fJustOutroBox"><span>Descreva o motivo <em>*</em></span><input class="inp" id="fJustOutro"></label>
    <label class="field"><span>Destino da peça <em>*</em></span><select class="inp" id="fDest">
      <option value="LAVANDERIA">Peça usada — vai para a lavanderia</option>
      <option value="DISPONIVEL">Peça limpa ou nunca usada — volta direto ao estoque</option>
    </select></label>
    ${htmlSeletor(false)}
    <label class="field" style="margin-top:14px"><span>Estado das peças</span><textarea class="inp" id="fObs"
      placeholder="Ex.: 2 camisas em bom estado, 1 com mancha"></textarea></label>`,
    aoAbrir:o=>{ ligarSeletor(o, varId);
      o.querySelector('#fJust').onchange = e => o.querySelector('#fJustOutroBox').classList.toggle('hide', e.target.value!=='__outro'); },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar devolução',classe:'pri',acao:async(o,f,b)=>{
      const func = o.querySelector('#fFunc').value;
      let just = o.querySelector('#fJust').value;
      if(just==='__outro') just = o.querySelector('#fJustOutro').value.trim();
      if(!func) return toast('Selecione o funcionário.','err');
      if(!just) return toast('Informe o motivo.','err');
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        await gravarMovs(o._itens.map(x=>({
          variacao_id:x.variacao_id, tipo:'ENTRADA_DEVOLUCAO', quantidade:x.quantidade,
          bucket:o.querySelector('#fDest').value,
          funcionario_id:Number(func), justificativa:just,
          observacoes:o.querySelector('#fObs').value || null })));
        f(); depoisDeMovimentar(o.querySelector('#fDest').value==='LAVANDERIA'
          ? 'Devolução registrada. As peças entraram na fila da lavanderia.'
          : 'Devolução registrada direto no estoque.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formDescarte(varId=null){
  if(!ehGestor()) return toast('Descarte é restrito ao gestor.','err');
  modal({titulo:'Baixa por descarte ou perda', wide:true, corpo:`
    <label class="field"><span>Motivo <em>*</em></span><select class="inp" id="fJust">
      <option>Peça danificada / imprópria para uso</option>
      <option>Extravio no almoxarifado</option>
      <option>Contaminação — descarte sanitário</option>
      <option>Fim da vida útil do EPI</option>
      <option value="__outro">Outro motivo…</option>
    </select></label>
    <label class="field hide" id="fJustOutroBox"><span>Descreva o motivo <em>*</em></span><input class="inp" id="fJustOutro"></label>
    ${htmlSeletor(false)}
    <label class="field" style="margin-top:14px"><span>Observações</span><textarea class="inp" id="fObs"></textarea></label>`,
    aoAbrir:o=>{ ligarSeletor(o, varId);
      o.querySelector('#fJust').onchange = e => o.querySelector('#fJustOutroBox').classList.toggle('hide', e.target.value!=='__outro'); },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Dar baixa',classe:'dan',acao:async(o,f,b)=>{
      let just = o.querySelector('#fJust').value;
      if(just==='__outro') just = o.querySelector('#fJustOutro').value.trim();
      if(!just) return toast('Informe o motivo.','err');
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        await gravarMovs(o._itens.map(x=>({
          variacao_id:x.variacao_id, tipo:'SAIDA_DESCARTE', quantidade:x.quantidade,
          justificativa:just, observacoes:o.querySelector('#fObs').value || null })));
        f(); depoisDeMovimentar('Baixa registrada.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formAjuste(){
  if(!ehGestor()) return toast('Ajuste é restrito ao gestor.','err');
  modal({titulo:'Ajuste manual de saldo', wide:true, corpo:`
    <p class="small muted" style="margin-top:0">Todo ajuste fica registrado com autor e justificativa.
    Para conferência completa prefira o módulo Inventário.</p>
    <div class="row">
      <label class="field"><span>Sentido <em>*</em></span><select class="inp" id="fSent">
        <option value="ENTRADA_AJUSTE">Somar ao estoque</option>
        <option value="SAIDA_AJUSTE">Subtrair do estoque</option>
      </select></label>
      <label class="field"><span>Justificativa <em>*</em></span><input class="inp" id="fJust" placeholder="Ex.: peças encontradas no depósito"></label>
    </div>
    ${htmlSeletor(false)}`,
    aoAbrir:o=>ligarSeletor(o),
    acoes:[{rotulo:'Cancelar'},{rotulo:'Aplicar ajuste',classe:'pri',acao:async(o,f,b)=>{
      const just = o.querySelector('#fJust').value.trim();
      if(!just) return toast('A justificativa é obrigatória.','err');
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        const tipo = o.querySelector('#fSent').value;
        await gravarMovs(o._itens.map(x=>({
          variacao_id:x.variacao_id, tipo, quantidade:x.quantidade, justificativa:just })));
        f(); depoisDeMovimentar('Ajuste aplicado.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
</script>
<script>
/* =====================================================================
   MOVIMENTACOES
   ===================================================================== */
const FM = {tipo:'', periodo:'30', func:'', busca:'', cat:''};

async function viewMovimentacoes(){
  $('#topAcoes').innerHTML = podeOperar() ? `
    <button class="btn" onclick="formEntradaCompra()">Compra</button>
    <button class="btn" onclick="formDevolucao()">Devolução</button>
    <button class="btn pri" onclick="formSaidaFuncionario()">Entrega</button>
    <button class="btn" onclick="formEmprestimo()">Empréstimo</button>
    ${ehGestor()?`<button class="btn" onclick="formAjuste()">Ajuste</button>
      <button class="btn dan" onclick="formDescarte()">Descarte</button>`:''}` : '';

  $('#view').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-b" style="padding:12px 16px">
      <div class="pick" style="margin:0">
        <label class="field"><span>Período</span><select class="inp" id="fmPer">
          ${[['7','Últimos 7 dias'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['365','Últimos 12 meses'],['0','Tudo']]
            .map(([v,t])=>`<option value="${v}" ${FM.periodo===v?'selected':''}>${t}</option>`).join('')}
        </select></label>
        <label class="field"><span>Tipo</span><select class="inp" id="fmTipo">
          <option value="">Todos</option>
          ${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${FM.tipo===k?'selected':''}>${v}</option>`).join('')}
        </select></label>
        <label class="field"><span>Funcionário</span><select class="inp" id="fmFunc">
          <option value="">Todos</option>
          ${S.funcionarios.map(f=>`<option value="${f.id}" ${FM.func==String(f.id)?'selected':''}>${esc(f.nome)}</option>`).join('')}
        </select></label>
        <label class="field"><span>Buscar item</span><input class="inp" id="fmBusca" value="${esc(FM.busca)}" placeholder="Nome do item…"></label>
        <button class="btn" id="fmAplicar">Filtrar</button>
        <button class="btn" id="fmCsv">CSV</button>
      </div></div></div>
    <div class="card"><div id="movLista"><div class="empty">Carregando…</div></div></div>`;

  $('#fmAplicar').onclick = ()=>{
    FM.periodo=$('#fmPer').value; FM.tipo=$('#fmTipo').value;
    FM.func=$('#fmFunc').value; FM.busca=$('#fmBusca').value; carregarMovs();
  };
  $('#fmBusca').onkeydown = e=>{ if(e.key==='Enter') $('#fmAplicar').click(); };
  $('#fmCsv').onclick = ()=>exportarMovsCSV();
  carregarMovs();
}

let MOVS = [];
async function carregarMovs(){
  let b = uni(S.sb.from('almox_vw_movimentacoes').select('*')).order('data',{ascending:false}).limit(500);
  if(FM.periodo!=='0') b = b.gte('data', diasAtras(Number(FM.periodo)));
  if(FM.tipo) b = b.eq('tipo', FM.tipo);
  if(FM.func) b = b.eq('funcionario_id', Number(FM.func));
  if(FM.busca) b = b.ilike('item', '%'+FM.busca+'%');
  const { data, error } = await b;
  if(error) return erro(error);
  MOVS = data;
  const el = $('#movLista');
  if(!data.length) return el.innerHTML = '<div class="empty"><b>Nenhuma movimentação</b>Ajuste os filtros ou registre um lançamento.</div>';

  const totIn  = data.filter(m=>m.e_entrada && !m.cancelada).reduce((s,m)=>s+m.quantidade,0);
  const totOut = data.filter(m=>!m.e_entrada && !m.cancelada).reduce((s,m)=>s+m.quantidade,0);
  const valor  = data.filter(m=>m.tipo==='ENTRADA_COMPRA' && !m.cancelada).reduce((s,m)=>s+Number(m.valor_total||0),0);

  el.innerHTML = `
    <div class="card-h"><h3>${data.length} lançamentos</h3><div class="sp"></div>
      <span class="tag in">+${num(totIn)} entradas</span>
      <span class="tag out">−${num(totOut)} saídas</span>
      <span class="tag">${brl(valor)} em compras</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Data</th><th>Tipo</th><th>Item</th><th class="num">Qtd</th><th>Pessoa / documento</th>
        <th>Justificativa</th><th class="num">Saldo</th><th></th></tr></thead>
      <tbody>${data.map(m=>`<tr${m.cancelada?' style="opacity:.5"':''}>
        <td class="small mono">${dth(m.data)}</td>
        <td><span class="tag ${m.e_entrada?'in':'out'}">${m.e_entrada?'entrada':'saída'}</span>
          <div class="it-meta">${esc(TIPOS[m.tipo].split('— ')[1]||TIPOS[m.tipo])}</div></td>
        <td><div class="it-nome"${m.cancelada?' style="text-decoration:line-through"':''}>${esc(m.item)}</div>
          <div class="it-meta">${esc(m.tamanho)}</div></td>
        <td class="num" style="font-weight:600">${m.e_entrada?'+':'−'}${m.quantidade}</td>
        <td class="small">${esc(m.funcionario || m.fornecedor || '—')}
          ${m.documento?`<div class="it-meta">${esc(m.documento)}</div>`:''}</td>
        <td class="small muted">${esc(m.cancelada ? 'CANCELADA: '+(m.motivo_cancelamento||'') : (m.justificativa||'—'))}</td>
        <td class="num small muted">${m.saldo_posterior ?? ''}</td>
        <td style="text-align:right;white-space:nowrap">
          ${(m.documento||'').startsWith('ENT-')
            ? `<button class="btn sm" onclick="termoEntrega('${esc(m.documento)}')">Termo</button>`:''}
          ${(ehGestor() && !m.cancelada && !m.emprestimo_id)
            ? `<button class="btn sm dan" onclick="cancelarMov(${m.id})">Cancelar</button>`:''}</td>
      </tr>`).join('')}</tbody></table></div>`;
}
function cancelarMov(id){
  modal({titulo:'Cancelar movimentação', corpo:`
    <p style="margin-top:0">O lançamento fica no histórico marcado como cancelado e o saldo é estornado.</p>
    <label class="field"><span>Motivo do cancelamento <em>*</em></span><input class="inp" id="cMot" placeholder="Ex.: lançamento em duplicidade"></label>`,
    acoes:[{rotulo:'Voltar'},{rotulo:'Cancelar lançamento',classe:'dan',acao:async(o,f,b)=>{
      const mot = o.querySelector('#cMot').value.trim();
      if(!mot) return toast('Informe o motivo.','err');
      b.disabled=true;
      try{ const {error} = await S.sb.rpc('almox_cancelar_movimentacao',{p_id:id,p_motivo:mot});
        if(error) throw error; f(); await carregarEstoque(); montarNav(); carregarMovs(); toast('Lançamento cancelado.','ok');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
function exportarMovsCSV(){
  const l = [['Data','Tipo','Item','Tamanho','Qtd','Sentido','Pessoa','Documento','Justificativa','Valor','Cancelada']];
  MOVS.forEach(m=>l.push([dth(m.data),TIPOS[m.tipo],m.item,m.tamanho,m.quantidade,m.e_entrada?'ENTRADA':'SAIDA',
    m.funcionario||m.fornecedor||'',m.documento||'',m.justificativa||'',m.valor_total||0,m.cancelada?'SIM':'NAO']));
  const csv = l.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`movimentacoes-${hoje()}.csv`; a.click();
}

/* =====================================================================
   EMPRESTIMOS
   ===================================================================== */
let FE = 'abertos';
async function viewEmprestimos(){
  $('#topAcoes').innerHTML = podeOperar()
    ? `<button class="btn pri" onclick="formEmprestimo()">Novo empréstimo</button>` : '';
  const dados = await qu('almox_vw_emprestimos','*',b=>b.order('data_saida',{ascending:false}).limit(300));
  const filtra = f => f==='cobrancas' ? []
                    : f==='abertos' ? dados.filter(e=>['ABERTO','PARCIAL'].includes(e.status))
                    : f==='atrasados' ? dados.filter(e=>e.atrasado)
                    : f==='encerrados' ? dados.filter(e=>['DEVOLVIDO','BAIXADO'].includes(e.status)) : dados;
  const render = ()=>{
    const l = filtra(FE);
    $('#empLista').innerHTML = l.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>Recibo</th><th>Funcionário</th><th>Saída</th><th>Previsão</th>
        <th class="num">Itens</th><th class="num">Pendentes</th><th>Situação</th><th></th></tr></thead>
      <tbody>${l.map(e=>`<tr>
        <td class="mono" style="font-weight:600">${esc(e.codigo)}</td>
        <td>${esc(e.funcionario)}<div class="it-meta">${esc(e.setor||'—')}${e.matricula?' · '+esc(e.matricula):''}</div></td>
        <td class="small">${dth(e.data_saida)}</td>
        <td class="small">${e.atrasado?`<span class="tag zero">${dt(e.previsao_devolucao)}</span>`:dt(e.previsao_devolucao)}</td>
        <td class="num">${e.total_itens}</td>
        <td class="num" style="font-weight:600">${e.pendentes}
          ${e.pendentes?`<div class="it-meta">${brl(e.valor_em_aberto)}</div>`:''}</td>
        <td><span class="tag ${e.status==='DEVOLVIDO'?'ok':e.status==='BAIXADO'?'':'brand'}">${STATUS_EMP[e.status]}</span>
          ${e.recibo_assinado?'<div class="it-meta">recibo assinado</div>':'<div class="it-meta">aguardando assinatura</div>'}</td>
        <td style="text-align:right"><button class="btn sm" onclick="abrirEmprestimo(${e.id})">Abrir</button></td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="empty"><b>Nada por aqui</b>Nenhum empréstimo nesta situação.</div>';
  };
  $('#view').innerHTML = `
    <div class="tabs">
      ${[['abertos','Em aberto'],['atrasados','Atrasados'],['encerrados','Encerrados'],['todos','Todos']]
        .map(([k,t])=>`<button data-f="${k}" class="${FE===k?'on':''}">${t}
          <span class="mono small">(${filtra(k).length})</span></button>`).join('')}
      <button data-f="cobrancas" class="${FE==='cobrancas'?'on':''}">Cobranças por extravio
        ${S.cobrancas?`<span class="mono small">(${S.cobrancas} pendente${S.cobrancas>1?'s':''})</span>`:''}</button>
    </div><div class="card"><div id="empLista"></div></div>`;
  $$('.tabs button').forEach(b=> b.onclick = ()=>{ FE=b.dataset.f;
    $$('.tabs button').forEach(x=>x.classList.toggle('on', x.dataset.f===FE));
    FE==='cobrancas'? listarCobrancas() : render(); });
  FE==='cobrancas'? listarCobrancas() : render();
}

async function abrirEmprestimo(id){
  const [emp] = await q('almox_vw_emprestimos','*',b=>b.eq('id',id));
  const itens = await q('almox_emprestimo_itens','*, almox_variacoes(sku, tamanho_id, almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('emprestimo_id',id));
  const nomeDe = i => `${i.almox_variacoes.almox_itens.nome} · ${i.almox_variacoes.almox_tamanhos?.rotulo || 'ÚNICO'}`;
  const aberto = ['ABERTO','PARCIAL'].includes(emp.status);
  drawer({titulo:emp.codigo, sub:`${esc(emp.funcionario)} · ${STATUS_EMP[emp.status]}`, corpo:`
    <div class="rec-dados" style="grid-template-columns:1fr 1fr;font-size:12.5px;margin-bottom:18px">
      <div><b>Saída</b>${dth(emp.data_saida)}</div>
      <div><b>Previsão de devolução</b>${dt(emp.previsao_devolucao)}${emp.atrasado?' <span class="tag zero">atrasado</span>':''}</div>
      <div><b>Setor</b>${esc(emp.setor||'—')}</div>
      <div><b>Motivo</b>${esc(emp.motivo||'—')}</div>
      <div><b>Valor de reposição</b>${brl(emp.valor_reposicao)}</div>
      <div><b>Em aberto</b>${brl(emp.valor_em_aberto)}</div>
    </div>
    ${emp.termo_assinado_em?'':`<p class="small" style="color:var(--red);margin:-8px 0 12px">
      Funcionário sem termo de compromisso assinado.</p>`}
    ${emp.observacoes?`<p class="small muted">${esc(emp.observacoes)}</p>`:''}
    <div class="lista-itens" style="margin-bottom:18px">
      ${itens.map(i=>`<div class="li"><span class="qt">${i.quantidade}×</span>
        <span class="sp">${esc(nomeDe(i))}</span>
        <span class="small ${i.quantidade_devolvida>=i.quantidade?'':'muted'}">
          ${i.quantidade_devolvida>=i.quantidade?'<span class="tag ok">devolvido</span>':`devolvidos ${i.quantidade_devolvida}/${i.quantidade}`}</span>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="reciboEmprestimo(${id})">Imprimir recibo</button>
      ${aberto && podeOperar()?`<button class="btn pri" onclick="formDevolverEmprestimo(${id})">Registrar devolução</button>`:''}
      ${aberto && ehGestor()?`<button class="btn dan" onclick="formBaixarEmprestimo(${id})">Dar baixa</button>`:''}
      ${!emp.recibo_assinado && podeOperar()?`<button class="btn" onclick="marcarAssinado(${id})">Marcar como assinado</button>`:''}
    </div>`});
}

async function marcarAssinado(id){
  const { error } = await S.sb.from('almox_emprestimos')
    .update({recibo_assinado:true, assinado_em:new Date().toISOString()}).eq('id',id);
  if(error) return erro(error);
  toast('Recibo marcado como assinado.','ok'); $('#drawer').innerHTML=''; render();
}

async function formDevolverEmprestimo(id){
  const itens = await q('almox_emprestimo_itens','*, almox_variacoes(almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('emprestimo_id',id));
  const pend = itens.filter(i=>i.quantidade>i.quantidade_devolvida);
  if(!pend.length) return toast('Não há itens pendentes.','err');
  modal({titulo:'Registrar devolução', corpo:`
    <p class="small muted" style="margin-top:0">Informe quanto está voltando de cada item. As peças retornam ao estoque.</p>
    ${pend.map(i=>`<div class="pick" style="align-items:center">
      <div class="field" style="margin:0"><span>${esc(i.almox_variacoes.almox_itens.nome)} · ${esc(i.almox_variacoes.almox_tamanhos?.rotulo||'ÚNICO')}</span>
        <div class="small muted">pendente: ${i.quantidade-i.quantidade_devolvida}</div></div>
      <label class="field" style="max-width:100px;margin:0"><span>Devolver</span>
        <input class="inp mono" type="number" min="0" max="${i.quantidade-i.quantidade_devolvida}"
               value="${i.quantidade-i.quantidade_devolvida}" data-it="${i.id}"></label>
    </div>`).join('')}
    <label class="field" style="margin-top:10px"><span>Destino das peças <em>*</em></span><select class="inp" id="dDest">
      <option value="1">Peça usada — vai para a lavanderia</option>
      <option value="0">Peça limpa — volta direto ao estoque</option>
    </select></label>
    <label class="field"><span>Observações</span>
      <textarea class="inp" id="dObs" placeholder="Estado das peças devolvidas"></textarea></label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Confirmar devolução',classe:'pri',acao:async(o,f,b)=>{
      const lista = [...o.querySelectorAll('input[data-it]')]
        .map(i=>({emprestimo_item_id:Number(i.dataset.it), quantidade:Number(i.value||0)}))
        .filter(x=>x.quantidade>0);
      if(!lista.length) return toast('Informe ao menos uma quantidade.','err');
      b.disabled=true;
      try{
        const paraLav = o.querySelector('#dDest').value==='1';
        const {error} = await S.sb.rpc('almox_devolver_emprestimo',
          {p_emprestimo_id:id, p_itens:lista, p_observacoes:o.querySelector('#dObs').value||null,
           p_para_lavanderia:paraLav});
        if(error) throw error;
        f(); $('#drawer').innerHTML=''; await depoisDeMovimentar(paraLav
          ? 'Devolução registrada. As peças foram para a fila da lavanderia.'
          : 'Devolução registrada direto no estoque.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

async function formBaixarEmprestimo(id){
  const [emp] = await q('almox_vw_emprestimos','*',b=>b.eq('id',id));
  const itens = await q('almox_emprestimo_itens','*, almox_variacoes(almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('emprestimo_id',id));
  const pend = itens.filter(i=>i.quantidade > i.quantidade_devolvida);
  const total = pend.reduce((t,i)=>t+(i.quantidade-i.quantidade_devolvida)*Number(i.valor_unitario_reposicao||0),0);
  modal({titulo:'Dar baixa no empréstimo', wide:true, corpo:`
    <p style="margin-top:0">As ${emp.pendentes} peça(s) que não voltaram passam a contar como entrega definitiva
    ao funcionário e saem do controle de pendências.</p>
    ${!emp.termo_assinado_em?`<div class="card" style="border-color:#EBC7C3;background:var(--red-l);margin-bottom:14px">
      <div class="card-b" style="padding:10px 12px"><b style="color:var(--red)">Sem termo de compromisso assinado</b>
      <p class="small" style="margin:4px 0 0">O desconto em folha depende de acordo prévio (CLT art. 462, §1º).
      Sem o termo assinado <b>antes</b> do empréstimo, a cobrança fica frágil e só se sustenta com dolo comprovado.
      Você pode registrar a cobrança assim mesmo, mas trate como valor a negociar — e regularize o termo com
      ${esc(emp.funcionario.split(' ')[0])}.</p></div>`:''}
    <label class="field"><span>Motivo <em>*</em></span>
      <input class="inp" id="bMot" list="motivosBaixa" placeholder="Ex.: peça extraviada pelo funcionário">
      <datalist id="motivosBaixa">
        <option>Peça extraviada pelo funcionário</option>
        <option>Peça danificada por uso indevido</option>
        <option>Funcionário desligado sem devolver</option>
        <option>Peça não localizada após cobrança</option>
      </datalist></label>
    <label class="check"><input type="checkbox" id="bCobrar" checked>
      Gerar cobrança pelo valor de reposição assinado no recibo</label>
    <div id="bCobrarBox">
      <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:6px;margin-bottom:10px"><table>
        <thead><tr><th>Peça não devolvida</th><th class="num">Qtd</th><th class="num">Valor no recibo</th>
          <th class="num">Total</th></tr></thead>
        <tbody>${pend.map(i=>{ const q=i.quantidade-i.quantidade_devolvida;
          return `<tr><td>${esc(i.almox_variacoes.almox_itens.nome)} ·
            ${esc(i.almox_variacoes.almox_tamanhos?.rotulo||'ÚNICO')}</td>
            <td class="num">${q}</td>
            <td class="num mono">${brl(i.valor_unitario_reposicao)}</td>
            <td class="num mono">${brl(q*Number(i.valor_unitario_reposicao||0))}</td></tr>`; }).join('')}
          <tr><td colspan="3" style="text-align:right;font-weight:600">Total</td>
            <td class="num mono" style="font-weight:700">${brl(total)}</td></tr>
        </tbody></table></div>
      <label class="check"><input type="checkbox" id="bOutro"> Cobrar valor diferente do assinado</label>
      <label class="field hide" id="bValorBox"><span>Valor por peça (R$)</span>
        <input class="inp mono" id="bValor" type="number" min="0" step="0.01" value="">
        <span class="small muted">Cobrar acima do valor assinado no recibo é enriquecimento sem causa e
        derruba a cobrança inteira. Use só para cobrar <b>menos</b>.</span></label>
      <p class="small muted" style="margin:8px 0 0">A cobrança nasce pendente. O desconto em folha depende da
      anuência do funcionário (CLT art. 462, §1º) e, na rescisão, não pode passar de um mês de remuneração
      (art. 477, §5º).</p>
    </div>`,
    aoAbrir:o=>{
      o.querySelector('#bCobrar').onchange = e =>
        o.querySelector('#bCobrarBox').classList.toggle('hide', !e.target.checked);
      o.querySelector('#bOutro').onchange = e =>
        o.querySelector('#bValorBox').classList.toggle('hide', !e.target.checked);
    },
    acoes:[{rotulo:'Voltar'},{rotulo:'Dar baixa',classe:'dan',acao:async(o,f,b)=>{
      const mot = o.querySelector('#bMot').value.trim();
      if(!mot) return toast('Informe o motivo.','err');
      const cobrar = o.querySelector('#bCobrar').checked;
      const outro  = o.querySelector('#bOutro').checked;
      const vAlt   = Number(o.querySelector('#bValor').value||0);
      if(cobrar && outro && !vAlt) return toast('Informe o valor alternativo ou desmarque a opção.','err');
      b.disabled=true;
      try{ const {error} = await S.sb.rpc('almox_baixar_emprestimo',{
          p_emprestimo_id:id, p_motivo:mot, p_cobrar:cobrar,
          p_valor_unitario: (cobrar && outro) ? vAlt : null});
        if(error) throw error; f(); $('#drawer').innerHTML='';
        await depoisDeMovimentar(cobrar? 'Empréstimo baixado e cobrança gerada.' : 'Empréstimo baixado.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

  const abertos = await qu('almox_inventarios','*',b=>b.eq('status','ABERTO'));
  if(abertos.length) return telaContagem(abertos[0]);

  const hist = await qu('almox_inventarios','*',b=>b.order('iniciado_em',{ascending:false}).limit(30));

    <button class="btn" onclick="formFolhaContagem(null)">Imprimir folha de contagem</button>

function formAbrirInventario(){

      <option value="">Todas as categorias</option>
      ${S.categorias.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}

function linhaContagem(i){

  </tr>`;

async function salvarContagem(inp){
  const v = inp.value===''? null : Number(inp.value);
  const { error } = await S.sb.from('almox_inventario_itens').update({saldo_contado:v}).eq('id',Number(inp.dataset.id));
  if(error) return erro(error);
  const dif = v===null? null : v - Number(inp.dataset.sist);
  inp.closest('tr').querySelector('[data-dif]').innerHTML =
    dif===null?'':`<span class="tag ${dif===0?'ok':dif>0?'brand':'zero'}">${dif>0?'+':''}${dif}</span>`;
  const total = $$('#invBody input').length, feitos = $$('#invBody input').filter(i=>i.value!=='').length;
  $('#progCont').textContent = `${feitos} de ${total} contados`;
}
async function revisarInventario(id){

    <p style="margin-top:0">${itens.length} item(ns) contados. ${difs.length? difs.length+' divergência(s) gerarão ajuste automático:' : 'Nenhuma divergência — nada será ajustado.'}</p>
    ${difs.length?`<div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Tamanho</th>
      <th class="num">Sistema</th><th class="num">Contado</th><th class="num">Ajuste</th></tr></thead><tbody>
      ${difs.map(d=>`<tr><td>${esc(d.item)}</td><td>${esc(d.tamanho)}</td>
        <td class="num">${d.atual}</td><td class="num">${d.saldo_contado}</td>
        <td class="num"><span class="tag ${d.dif>0?'brand':'zero'}">${d.dif>0?'+':''}${d.dif}</span></td></tr>`).join('')}
      </tbody></table></div>`:''}
    <p class="small muted">Itens sem contagem lançada permanecem com o saldo atual.</p>`,
    acoes:[{rotulo:'Voltar'},{rotulo:'Finalizar e ajustar',classe:'pri',acao:async(o,f,b)=>{

function formFolhaContagem(inv){
  const base = S.estoque.filter(e=> (e.variacao_ativa && e.item_ativo) || e.saldo!==0 || e.saldo_lavanderia!==0);
  const cats = {};
  base.forEach(e=>{ const c = e.categoria || 'Sem categoria'; cats[c] = (cats[c]||0)+1; });
  const nomes = Object.keys(cats).sort();
  const escopoFixo = inv && inv.categoria_id ? nomeCat(inv.categoria_id) : null;

  modal({titulo:'Imprimir folha de contagem', corpo:`
    <p class="small muted" style="margin-top:0">${inv
      ? 'A folha sai com o escopo da contagem aberta '+esc(inv.codigo)+'.'
      : 'Marque o que vai contar. A folha é só papel — nada é aberto nem alterado no sistema.'}</p>
    ${escopoFixo ? `<p class="small"><b>Escopo:</b> ${esc(escopoFixo)}</p>` : `
    <div class="field"><span>Categorias</span>
      <div style="display:flex;gap:8px;margin:0 0 8px">
        <button type="button" class="btn sm" id="fcTudo">Marcar tudo</button>
        <button type="button" class="btn sm" id="fcNada">Desmarcar</button></div>
      <div class="lista-itens">
        ${nomes.map(c=>`<div class="li"><label class="check" style="margin:0;flex:1">
          <input type="checkbox" class="fcCat" value="${esc(c)}" checked> ${esc(c)}</label>
          <span class="mono small muted">${cats[c]} posições</span></div>`).join('')}
      </div></div>`}
    <label class="check" style="margin-top:12px"><input type="checkbox" id="fcCega" checked>
      Contagem cega — não imprimir o saldo do sistema</label>
    <p class="small muted" style="margin:-4px 0 10px">Recomendado. Se o papel já traz o saldo, quem conta tende
    a copiar o número em vez de conferir a prateleira.</p>
    <label class="check"><input type="checkbox" id="fcZerados" checked>
      Incluir peças com saldo zero</label>
    <p class="small muted" style="margin:-4px 0 12px">Deixe marcado no inventário de verdade: peça que o sistema
    diz estar zerada mas aparece na prateleira só é descoberta assim.</p>
    <label class="field"><span>Quem vai contar</span>
      <input class="inp" id="fcQuem" placeholder="Opcional — sai impresso no cabeçalho"></label>`,
    aoAbrir:o=>{
      const t = o.querySelector('#fcTudo'), n = o.querySelector('#fcNada');
      if(t) t.onclick = ()=> o.querySelectorAll('.fcCat').forEach(c=>c.checked=true);
      if(n) n.onclick = ()=> o.querySelectorAll('.fcCat').forEach(c=>c.checked=false);
    },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Imprimir folha',classe:'pri',acao:(o,f)=>{
      let cats2;
      if(escopoFixo) cats2 = [escopoFixo];
      else {
        cats2 = [...o.querySelectorAll('.fcCat:checked')].map(c=>c.value);
        if(!cats2.length) return toast('Marque ao menos uma categoria.','err');
      }
      f();
      imprimirFolhaContagem({
        inv, categorias: cats2,
        cega: o.querySelector('#fcCega').checked,
        zerados: o.querySelector('#fcZerados').checked,
        quem: o.querySelector('#fcQuem').value.trim()
      });
    }}]});
}

function imprimirFolhaContagem({inv, categorias, cega, zerados, quem}){
  // Inclui item inativo que ainda tem peça: ele está na prateleira e precisa ser contado.
  let dados = S.estoque.filter(e=> (e.variacao_ativa && e.item_ativo) || e.saldo!==0 || e.saldo_lavanderia!==0);
  if(categorias && categorias.length)
    dados = dados.filter(e=> categorias.includes(e.categoria || 'Sem categoria'));
  if(!zerados) dados = dados.filter(e=> e.saldo>0 || e.saldo_lavanderia>0);
  if(!dados.length) return toast('Nada a contar com esse filtro.','err');

  const porGrade = {};
  dados.forEach(e=>{
    (porGrade[e.grade_id] ||= {grade:e.grade, grade_id:e.grade_id, itens:{}});
    (porGrade[e.grade_id].itens[e.item_id] ||= {
      nome:e.item, cat:e.categoria, inativo:!(e.item_ativo && e.variacao_ativa), cels:{}});
    porGrade[e.grade_id].itens[e.item_id].cels[e.tamanho_id ?? 'u'] = e;
  });
  const grades = Object.values(porGrade)
    .sort((a,b)=> Object.keys(b.itens).length - Object.keys(a.itens).length);

  const totalItens = grades.reduce((t,g)=>t+Object.keys(g.itens).length,0);
  const resumo = grades.map(g=>`${esc(g.grade)}: ${Object.keys(g.itens).length}`).join(' · ');

  const tabelas = grades.map((g,ix)=>{
    const tams = tamanhosDaGrade(g.grade_id);
    const itens = Object.values(g.itens).sort((a,b)=>a.nome.localeCompare(b.nome));
    return `<div class="gr">Bloco ${ix+1} de ${grades.length} — ${esc(g.grade)}
      <span style="float:right;font-weight:400">${itens.length} itens</span></div>
      <table><thead><tr>
        <th style="text-align:left">Item</th>
        ${tams.map(t=>`<th>${esc(t.rotulo)}</th>`).join('')}
        <th style="width:52px">Total</th></tr></thead>
      <tbody>${itens.map(it=>`<tr>
        <td class="it"><b>${esc(it.nome)}</b>${it.inativo?' <span style="font-size:8px">(INATIVO — contar se houver)</span>':''}<br>
          <span style="font-size:8.5px;color:#666">${esc(it.cat||'')}</span></td>
        ${tams.map(t=>{ const c = it.cels[t.id];
          if(!c) return '<td class="cx na"></td>';
          return `<td class="cx">${cega?'':`<span style="font-size:8px;color:#aaa">${c.saldo}</span>`}</td>`;
        }).join('')}
        <td class="cx"></td></tr>`).join('')}
      </tbody></table>`;
  }).join('');

  imprimir(`<div class="folha">
    ${cabecalhoRecibo('Folha de contagem de estoque',
      inv ? inv.codigo : 'FC-'+S.unidade.codigo+'-'+hoje().replace(/-/g,'').slice(2))}
    <div class="cab">
      <div><b>Unidade</b>${esc(S.unidade.nome)}</div>
      <div><b>Escopo</b>${esc((categorias||[]).join(', ') || 'Todas as categorias')}</div>
      <div><b>Data da contagem</b>____/____/________</div>
      <div><b>Contado por</b>${quem ? esc(quem) : '&nbsp;'}</div>
    </div>
    <p style="font-size:9.5px;color:#444;margin:0 0 10px;border-left:3px solid #999;padding-left:8px">
      Conte o que está <b>fisicamente disponível na prateleira</b>. Não some peça em uso com funcionário
      nem peça suja aguardando lavagem — essas já estão fora do estoque disponível.
      ${cega ? 'Esta é uma contagem cega: o saldo do sistema não foi impresso de propósito.'
             : 'O número pequeno em cinza é o saldo do sistema, apenas para conferência.'}
      Quadro hachurado é tamanho que não existe para aquele item.<br>
      <b>Esta folha tem ${grades.length} bloco(s), ${totalItens} itens e ${dados.length} posições.</b>
      Confira se recebeu todos os blocos: ${resumo}.
    </p>
    ${tabelas}
    <div style="margin-top:14px;border:1px solid #999;padding:8px;font-size:10px">
      <b style="font-size:9px;text-transform:uppercase;letter-spacing:.06em">Observações da contagem</b>
      <div style="border-bottom:1px solid #ccc;height:18px;margin-top:6px"></div>
      <div style="border-bottom:1px solid #ccc;height:18px"></div>
      <div style="border-bottom:1px solid #ccc;height:18px"></div>
    </div>
    <div class="rec-ass" style="margin-top:34px">
      <div>&nbsp;<br><span style="font-size:10px;color:#555">Contado por — assinatura e data</span></div>
      <div>&nbsp;<br><span style="font-size:10px;color:#555">Conferido por — assinatura e data</span></div>
    </div>
    <div style="margin-top:12px;font-size:8.5px;color:#666">
      Gerado pelo ${esc(CONFIG.SISTEMA)} em ${new Date().toLocaleString('pt-BR')}${
        inv?` · lançar em Inventário → ${esc(inv.codigo)}`:''}.
    </div></div>`);
}

let buscaFunc = '', filtroVinculo = 'ATIVOS';

         ...Object.entries(VINCULOS).map(([k,v])=>[k, 'Vínculo · '+v]),
         ...SETORES.map(x=>['S:'+x, 'Setor · '+x]),
         ...[...new Set(S.funcionarios.filter(f=>f.ativo && f.cargo).map(f=>f.cargo))].sort()
