<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almoxarifado de Uniformes e EPI — Ilha do Caranguejo VIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1418; --ink-2:#38434D; --mut:#78838F; --line:#DCE3E8; --line-2:#EDF1F4;
  --paper:#FFFFFF; --bg:#EBEFF2; --sur:#F6F8FA;
  --sea:#0B4F53; --sea-d:#073A3D; --sea-l:#E4EFEF; --sea-t:#0E6B70;
  --amber:#A85B06; --amber-l:#FBF0E0;
  --red:#A82015; --red-l:#FBE9E7;
  --green:#12734F; --green-l:#E3F1EA;
  --r:6px; --sh:0 1px 2px rgba(14,20,24,.06), 0 6px 20px rgba(14,20,24,.06);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sea-t)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ---------- LOGIN / CONFIG ---------- */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(160deg,var(--sea-d),#0B4F53 60%,#0E6B70)}
.gate-card{width:100%;max-width:400px;background:var(--paper);border-radius:10px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.gate-card h1{font-size:19px}
.gate-card .sub{color:var(--mut);font-size:13px;margin:6px 0 22px}
.brandmark{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--sea-t);text-transform:uppercase;font-weight:600}

/* ---------- SHELL ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100dvh}
.side{background:var(--sea-d);color:#CFE0E0;display:flex;flex-direction:column;position:sticky;top:0;height:100dvh}
.side-top{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.side-top .u{font-size:15px;color:#fff;font-weight:600;letter-spacing:-.01em}
.side-top .brandmark{color:#7FB6B6}
.nav{padding:10px 10px;flex:1;overflow:auto}
.nav-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5E8C8C;padding:14px 8px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:#CFE0E0;text-decoration:none;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--sea-t);color:#fff;font-weight:500}
.nav a .ic{width:16px;text-align:center;opacity:.9;font-size:13px}
.nav a .badge{margin-left:auto;background:var(--amber);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;font-family:var(--mono)}
.side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:12px;color:#8FB3B3}
.side-foot b{color:#fff;font-weight:500;display:block}
.side-foot button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.2);color:#CFE0E0;padding:4px 10px;border-radius:var(--r);cursor:pointer;font-size:12px}
.side-foot button:hover{background:rgba(255,255,255,.1)}

.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h2{font-size:18px}
.top .crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:2px}
.top .sp{flex:1}
.content{padding:22px 26px 60px;max-width:1500px;width:100%}

/* ---------- COMPONENTES ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:14px}
.card-h .sp{flex:1}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.muted{color:var(--mut)}
.small{font-size:12.5px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--paper);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:.12s}
.btn:hover{background:var(--sur);border-color:#C6D0D8}
.btn:focus-visible{outline:2px solid var(--sea-t);outline-offset:2px}
.btn.pri{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.pri:hover{background:var(--sea-t);border-color:var(--sea-t)}
.btn.dan{color:var(--red);border-color:#E8C4C0}
.btn.dan:hover{background:var(--red-l)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.field>span em{color:var(--red);font-style:normal}
.inp{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);transition:.12s}
.inp:focus{outline:none;border-color:var(--sea-t);box-shadow:0 0 0 3px rgba(14,107,112,.12)}
textarea.inp{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.check{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--sea)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);
   color:var(--mut);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sur);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:var(--sur)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:500;
  background:var(--sur);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--green-l);border-color:#BFE0D0;color:var(--green)}
.tag.low{background:var(--amber-l);border-color:#EDD4AC;color:var(--amber)}
.tag.zero{background:var(--red-l);border-color:#EFC6C1;color:var(--red)}
.tag.sea{background:var(--sea-l);border-color:#BFD9D9;color:var(--sea)}
.tag.in{background:var(--green-l);border-color:#BFE0D0;color:var(--green)}
.tag.out{background:#EFEAF7;border-color:#D9CEEC;color:#5B3E96}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sea)}
.kpi.warn::after{background:var(--amber)} .kpi.bad::after{background:var(--red)} .kpi.good::after{background:var(--green)}
.kpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--mut);margin-top:2px}

/* ---------- ASSINATURA: MATRIZ DE ESTOQUE ---------- */
.matriz{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);margin-bottom:18px}
.matriz-h{padding:12px 16px;background:var(--sea);color:#fff;display:flex;align-items:center;gap:10px}
.matriz-h h3{font-size:13px;color:#fff}
.matriz-h .g{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9CC6C6;margin-left:auto}
.matriz table{table-layout:auto}
.matriz th.item-col,.matriz td.item-col{position:sticky;left:0;background:var(--paper);z-index:2;min-width:250px;border-right:1px solid var(--line)}
.matriz th.item-col{background:var(--sur)}
.matriz tbody tr:hover td.item-col{background:var(--sur)}
.matriz td{padding:0;text-align:center;border-right:1px solid var(--line-2)}
.matriz td.item-col{padding:9px 12px;text-align:left}
.cel{width:100%;min-width:58px;padding:11px 4px;border:0;background:none;cursor:pointer;font-family:var(--mono);
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);transition:.1s}
.cel:hover{background:var(--sea-l);box-shadow:inset 0 0 0 2px var(--sea-t)}
.cel.zero{color:#C6CED4}
.cel.low{background:var(--amber-l);color:var(--amber)}
.cel.neg{background:var(--red-l);color:var(--red)}
.cel .m{display:block;font-size:9.5px;font-weight:400;color:var(--mut);letter-spacing:.04em}
.cel .lav{display:block;font-size:9px;font-weight:500;color:var(--sea-t);letter-spacing:.03em}
.cel.na{cursor:default;color:#D5DCE1}
.cel.na:hover{background:none;box-shadow:none}
.it-nome{font-weight:500;font-size:13px}
.it-meta{font-size:11px;color:var(--mut);font-family:var(--mono)}

/* ---------- MODAL / DRAWER ---------- */
.ovl{position:fixed;inset:0;background:rgba(14,20,24,.44);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.mdl{background:var(--paper);border-radius:10px;width:100%;max-width:600px;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:up .16s ease-out}
.mdl.wide{max-width:900px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mdl-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mdl-h h3{font-size:16px}
.mdl-h .x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--mut);cursor:pointer;line-height:1;padding:0 4px}
.mdl-b{padding:22px;max-height:65vh;overflow:auto}
.mdl-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--sur);border-radius:0 0 10px 10px}

.drw{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper);z-index:70;
  box-shadow:-14px 0 46px rgba(0,0,0,.22);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drw-h{padding:20px 22px;border-bottom:1px solid var(--line)}
.drw-b{flex:1;overflow:auto;padding:20px 22px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:13px;box-shadow:var(--sh);max-width:520px}
.tst.err{background:var(--red)} .tst.ok{background:var(--green)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;font-size:13px;color:var(--mut);white-space:nowrap}
.tabs button.on{color:var(--sea);border-bottom-color:var(--sea);font-weight:600}

.chart{width:100%;height:200px}
.chart .bar-in{fill:var(--sea-t)} .chart .bar-out{fill:#8FA3B0}
.chart .ax{stroke:var(--line)} .chart .lbl{font-size:10px;fill:var(--mut);font-family:var(--mono)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

.empty{padding:44px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:14px}
.pick{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
.pick .field{flex:1;min-width:150px;margin:0}
.lista-itens{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:8px}
.lista-itens .li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:13px}
.lista-itens .li:last-child{border-bottom:0}
.lista-itens .li .sp{flex:1}
.lista-itens .li .qt{font-family:var(--mono);font-weight:600}

/* ---------- RECIBO / IMPRESSAO ---------- */
#print{display:none}
@media print{
  body{background:#fff}
  .shell,.ovl,.drw,.toast{display:none !important}
  #print{display:block !important;padding:0;font-size:12px;color:#000}
  @page{size:A4;margin:16mm}
}
.rec-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:16px}
.rec-h .t{font-size:17px;font-weight:700;letter-spacing:-.01em}
.rec-h .s{font-size:11px;color:#444}
.rec-cod{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}
.rec-dados{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:16px;font-size:12px}
.rec-dados div{border-bottom:1px solid #ccc;padding:5px 0}
.rec-dados b{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#555;display:block}
#print table{width:100%;border-collapse:collapse;margin-bottom:16px}
#print th{background:#eee;border:1px solid #999;padding:6px;font-size:10px;text-transform:uppercase}
#print td{border:1px solid #bbb;padding:6px;font-size:12px}
.rec-termo{font-size:10.5px;line-height:1.55;text-align:justify;border:1px solid #999;padding:10px;margin-bottom:26px;background:#fafafa}
.rec-ass{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px;text-align:center;font-size:11px}
.rec-ass div{border-top:1px solid #000;padding-top:5px}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .side-top{border:0;padding:12px 16px} .nav{display:flex;flex-wrap:wrap;padding:6px}
  .nav-lbl{display:none} .side-foot{border:0;width:100%}
  .content,.top{padding-left:14px;padding-right:14px}
  .row,.row-3{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="gate" class="gate"></div>
<div id="shell" class="shell hide">
  <aside class="side">
    <div class="side-top">
      <span class="brandmark">Grupo Ilha</span>
      <div class="u">Almoxarifado</div>
      <div class="small" style="color:#7FB6B6" id="uniLbl">Ilha do Caranguejo — VIX</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <b id="userNome">—</b>
      <span id="userPapel" class="mono small">—</span>
      <button onclick="sair()">Sair</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div><span class="crumb" id="crumb">Painel</span><h2 id="titulo">Painel</h2></div>
      <div class="sp"></div>
      <div id="topAcoes" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="modal"></div>
<div id="drawer"></div>
<div class="toast" id="toast"></div>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   ALMOXARIFADO DE UNIFORMES E EPI - Ilha do Caranguejo VIX
   Front-end: HTML unico + Supabase. Publicavel no GitHub Pages.
   ===================================================================== */

/* --- 1. CONFIGURACAO -------------------------------------------------
   Preencha abaixo OU deixe em branco e informe na tela inicial
   (fica salvo no navegador).                                          */
const CONFIG = {
  SUPABASE_URL: 'https://vribagnmtksszdfczjcy.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_QpfTr4uyVBrbig-CVlynzg_U_cWqRzz',
  UNIDADE_PADRAO: 'VIX',
  EMPRESA: 'Grupo Ilha',
  LOJA: 'Ilha do Caranguejo — Vitória (VIX)'
};

const LS = 'almox.cfg';
function cfg(){
  const s = JSON.parse(localStorage.getItem(LS) || '{}');
  return { url: CONFIG.SUPABASE_URL || s.url || '', key: CONFIG.SUPABASE_ANON_KEY || s.key || '' };
}

/* --- 2. ESTADO ------------------------------------------------------ */
const S = {
  sb:null, user:null, perfil:null, unidade:null, rota:'painel',
  unidades:[], categorias:[], grades:[], tamanhos:[], itens:[],
  funcionarios:[], fornecedores:[], dotacoes:[], estoque:[], lavanderia:[],
  alertas:0, atrasados:0, aguardando:0, semDotacao:0
};

/* --- 3. UTILITARIOS ------------------------------------------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v||0).toLocaleString('pt-BR');
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt  = v => v ? new Date(v).toLocaleDateString('pt-BR') : '—';
const dth = v => v ? new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const hoje = ()=> new Date().toISOString().slice(0,10);
const diasAtras = n => new Date(Date.now()-n*864e5).toISOString();

const TIPOS = {
  ENTRADA_COMPRA:'Entrada — compra',
  ENTRADA_DEVOLUCAO:'Entrada — devolução',
  ENTRADA_RETORNO_EMPRESTIMO:'Entrada — retorno de empréstimo',
  ENTRADA_AJUSTE:'Entrada — ajuste de inventário',
  SAIDA_FUNCIONARIO:'Saída — funcionário',
  SAIDA_EMPRESTIMO:'Saída — empréstimo',
  SAIDA_DESCARTE:'Saída — descarte',
  SAIDA_AJUSTE:'Saída — ajuste de inventário',
  RETORNO_LAVANDERIA:'Entrada — retorno limpo da lavanderia',
  DESCARTE_LAVANDERIA:'Saída — peça condenada na lavagem'
};
const STATUS_REM = {ENVIADA:'Na lavanderia',RECEBIDA:'Recebida',CANCELADA:'Cancelada'};
const STATUS_EMP = {ABERTO:'Em aberto',PARCIAL:'Devolução parcial',DEVOLVIDO:'Devolvido',BAIXADO:'Baixado'};

function toast(msg,tipo=''){
  const el = document.createElement('div');
  el.className = 'tst '+tipo; el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s';setTimeout(()=>el.remove(),300)}, tipo==='err'?6000:3200);
}
function erro(e){ console.error(e); toast(e?.message || String(e), 'err'); }

function modal({titulo, corpo, acoes=[], wide=false, aoAbrir}){
  const ovl = document.createElement('div'); ovl.className='ovl';
  ovl.innerHTML = `<div class="mdl ${wide?'wide':''}" role="dialog" aria-modal="true">
    <div class="mdl-h"><h3>${esc(titulo)}</h3><button class="x" aria-label="Fechar">&times;</button></div>
    <div class="mdl-b">${corpo}</div>
    <div class="mdl-f"></div></div>`;
  const fechar = ()=> ovl.remove();
  ovl.querySelector('.x').onclick = fechar;
  ovl.onclick = e => { if(e.target===ovl) fechar(); };
  const f = ovl.querySelector('.mdl-f');
  acoes.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'btn '+(a.classe||''); b.textContent = a.rotulo;
    b.onclick = ()=> a.acao ? a.acao(ovl, fechar, b) : fechar();
    f.appendChild(b);
  });
  $('#modal').appendChild(ovl);
  document.addEventListener('keydown', function esq(e){ if(e.key==='Escape'){fechar();document.removeEventListener('keydown',esq);} });
  aoAbrir && aoAbrir(ovl);
  const first = ovl.querySelector('input,select,textarea'); first && first.focus();
  return {ovl, fechar};
}
function confirmar(titulo, texto, aoConfirmar, rotulo='Confirmar'){
  modal({titulo, corpo:`<p style="margin:0">${texto}</p>`, acoes:[
    {rotulo:'Cancelar'},
    {rotulo, classe:'pri', acao:async(o,f,b)=>{ b.disabled=true; try{ await aoConfirmar(); f(); }catch(e){ erro(e); b.disabled=false; } }}
  ]});
}
function drawer({titulo, sub='', corpo}){
  $('#drawer').innerHTML='';
  const ovl = document.createElement('div'); ovl.className='ovl'; ovl.style.padding='0'; ovl.style.justifyContent='flex-end';
  ovl.innerHTML = `<div class="drw"><div class="drw-h"><div style="display:flex;align-items:center;gap:12px">
      <div style="flex:1"><h3 style="font-size:16px">${esc(titulo)}</h3>
      <div class="small muted">${sub}</div></div>
      <button class="x" style="background:none;border:0;font-size:24px;color:var(--mut);cursor:pointer">&times;</button>
    </div></div><div class="drw-b">${corpo}</div></div>`;
  const fechar=()=>ovl.remove();
  ovl.querySelector('.x').onclick=fechar;
  ovl.onclick=e=>{ if(e.target===ovl) fechar(); };
  $('#drawer').appendChild(ovl);
  return {ovl, fechar};
}

const podeOperar = ()=> ['GESTOR','OPERADOR'].includes(S.perfil?.papel);
const ehGestor   = ()=> S.perfil?.papel === 'GESTOR';
function exigeGestor(){ if(!ehGestor()){ toast('Ação restrita ao gestor.','err'); return false; } return true; }

/* --- 4. ACESSO ------------------------------------------------------ */
function telaConfig(msg=''){
  $('#gate').innerHTML = `<div class="gate-card">
    <span class="brandmark">Grupo Ilha</span>
    <h1>Conectar ao Supabase</h1>
    <p class="sub">Informe o endereço do projeto e a chave pública (anon). Fica salvo apenas neste navegador.</p>
    ${msg?`<p class="small" style="color:var(--red);margin:-10px 0 16px">${esc(msg)}</p>`:''}
    <label class="field"><span>URL do projeto</span>
      <input class="inp mono" id="cfgUrl" placeholder="https://xxxx.supabase.co"></label>
    <label class="field"><span>Chave anon (public)</span>
      <input class="inp mono" id="cfgKey" placeholder="eyJhbGciOi..."></label>
    <button class="btn pri" style="width:100%;justify-content:center" onclick="salvarConfig()">Conectar</button>
  </div>`;
}
function salvarConfig(){
  const url = $('#cfgUrl').value.trim().replace(/\/$/,''), key = $('#cfgKey').value.trim();
  if(!url || !key) return toast('Preencha os dois campos.','err');
  localStorage.setItem(LS, JSON.stringify({url,key}));
  location.reload();
}
function telaLogin(msg=''){
  $('#gate').innerHTML = `<div class="gate-card">
    <span class="brandmark">Grupo Ilha</span>
    <h1>Almoxarifado de uniformes e EPI</h1>
    <p class="sub">${esc(CONFIG.LOJA)}</p>
    ${msg?`<p class="small" style="color:var(--red);margin:-10px 0 16px">${esc(msg)}</p>`:''}
    <label class="field"><span>E-mail</span><input class="inp" id="loginEmail" type="email" autocomplete="username"></label>
    <label class="field"><span>Senha</span><input class="inp" id="loginSenha" type="password" autocomplete="current-password"></label>
    <button class="btn pri" style="width:100%;justify-content:center" id="btnEntrar">Entrar</button>
    <p class="small muted" style="margin:16px 0 0;text-align:center">
      <a href="#" onclick="localStorage.removeItem('${LS}');location.reload();return false">Trocar projeto Supabase</a></p>
  </div>`;
  const go = async ()=>{
    const b = $('#btnEntrar'); b.disabled = true; b.textContent = 'Entrando…';
    const { error } = await S.sb.auth.signInWithPassword({
      email: $('#loginEmail').value.trim(), password: $('#loginSenha').value });
    if(error){ b.disabled=false; b.textContent='Entrar'; return telaLogin('Não foi possível entrar: '+error.message); }
    iniciarSessao();
  };
  $('#btnEntrar').onclick = go;
  $('#loginSenha').onkeydown = e => { if(e.key==='Enter') go(); };
}
async function sair(){ await S.sb.auth.signOut(); location.reload(); }

/* --- 5. CARGA DE DADOS ---------------------------------------------- */
async function q(tabela, sel='*', mod = b=>b){
  const { data, error } = await mod(S.sb.from(tabela).select(sel));
  if(error) throw error; return data || [];
}
async function carregarBase(){
  const [uni, cat, gra, tam, ite, fun, forn, dot] = await Promise.all([
    q('almox_unidades','*',b=>b.order('codigo')),
    q('almox_categorias','*',b=>b.order('ordem').order('nome')),
    q('almox_grades','*',b=>b.order('nome')),
    q('almox_tamanhos','*',b=>b.order('ordem')),
    q('almox_itens','*',b=>b.order('nome')),
    q('almox_funcionarios','*',b=>b.order('nome')),
    q('almox_fornecedores','*',b=>b.order('nome')),
    q('almox_dotacoes','*',b=>b.order('grupo'))
  ]);
  S.unidades=uni; S.categorias=cat; S.grades=gra; S.tamanhos=tam;
  S.itens=ite; S.funcionarios=fun; S.fornecedores=forn; S.dotacoes=dot;
  S.unidade = (S.perfil?.unidade_id && uni.find(u=>u.id===S.perfil.unidade_id))
              || uni.find(u=>u.codigo===CONFIG.UNIDADE_PADRAO) || uni[0] || null;
}
async function carregarEstoque(){
  S.estoque = await q('almox_vw_estoque','*',b=>b.order('item').order('tamanho_ordem'));
  S.alertas = S.estoque.filter(e=>e.variacao_ativa && e.item_ativo && e.situacao!=='OK').length;
}
async function carregarLavanderia(){
  S.lavanderia = await q('almox_vw_lavanderia','*',b=>b.gt('em_lavanderia',0).order('item'));
  S.aguardando = S.lavanderia.reduce((t,l)=>t+l.aguardando_envio,0);
}
async function carregarDotacao(){
  const d = await q('almox_vw_dotacao','funcionario_id,falta',b=>b.gt('falta',0));
  S.semDotacao = new Set(d.map(x=>x.funcionario_id)).size;
}
async function carregarAtrasados(){
  const d = await q('almox_vw_emprestimos','id,atrasado,status',b=>b.in('status',['ABERTO','PARCIAL']));
  S.atrasados = d.filter(e=>e.atrasado).length;
}
const nomeCat  = id => S.categorias.find(c=>c.id===id)?.nome || '—';
const nomeItem = id => S.itens.find(i=>i.id===id)?.nome || '—';
const tamanhosDaGrade = gid => S.tamanhos.filter(t=>t.grade_id===gid && t.ativo).sort((a,b)=>a.ordem-b.ordem);

/* --- 6. NAVEGACAO --------------------------------------------------- */
const ROTAS = [
  {g:'Operação'},
  {id:'painel',       t:'Painel',        ic:'▤', f:()=>viewPainel()},
  {id:'estoque',      t:'Estoque',       ic:'▦', f:()=>viewEstoque()},
  {id:'movimentacoes',t:'Movimentações', ic:'⇄', f:()=>viewMovimentacoes()},
  {id:'emprestimos',  t:'Empréstimos',   ic:'✎', f:()=>viewEmprestimos()},
  {id:'lavanderia',   t:'Lavanderia',    ic:'≈', f:()=>viewLavanderia()},
  {id:'inventario',   t:'Inventário',    ic:'☑', f:()=>viewInventario()},
  {g:'Equipe'},
  {id:'funcionarios', t:'Funcionários',  ic:'☺', f:()=>viewFuncionarios()},
  {id:'dotacao',      t:'Dotação',       ic:'≡', f:()=>viewDotacao()},
  {g:'Cadastros'},
  {id:'cadastros',    t:'Itens e grades',ic:'⚙', f:()=>viewCadastros()}
];
function montarNav(){
  $('#nav').innerHTML = ROTAS.map(r=>{
    if(r.g) return `<div class="nav-lbl">${r.g}</div>`;
    const badge = r.id==='estoque' && S.alertas ? `<span class="badge">${S.alertas}</span>`
               : r.id==='emprestimos' && S.atrasados ? `<span class="badge">${S.atrasados}</span>`
               : r.id==='lavanderia' && S.aguardando ? `<span class="badge">${S.aguardando}</span>`
               : r.id==='dotacao' && S.semDotacao ? `<span class="badge">${S.semDotacao}</span>` : '';
    return `<a href="#${r.id}" class="${S.rota===r.id?'on':''}"><span class="ic">${r.ic}</span>${r.t}${badge}</a>`;
  }).join('');
}
function irPara(id){ location.hash = id; }
async function render(){
  const r = ROTAS.find(x=>x.id===S.rota) || ROTAS[1];
  $('#crumb').textContent = 'Ilha VIX'; $('#titulo').textContent = r.t;
  $('#topAcoes').innerHTML = ''; $('#view').innerHTML = '<div class="empty">Carregando…</div>';
  montarNav();
  try { await r.f(); } catch(e){ erro(e); $('#view').innerHTML = `<div class="card"><div class="empty"><b>Não foi possível carregar</b>${esc(e.message||e)}</div></div>`; }
}
window.addEventListener('hashchange', ()=>{
  const h = location.hash.slice(1);
  S.rota = ROTAS.some(r=>r.id===h) ? h : 'painel';
  render();
});

/* --- 7. BOOT -------------------------------------------------------- */
async function iniciarSessao(){
  const { data:{ user } } = await S.sb.auth.getUser();
  if(!user) return telaLogin();
  S.user = user;
  const { data: perfil, error } = await S.sb.from('almox_usuarios').select('*').eq('id', user.id).maybeSingle();
  if(error) return telaLogin('Erro ao ler o perfil: '+error.message);
  if(!perfil || !perfil.ativo){
    return telaLogin('Seu usuário existe, mas ainda não tem acesso liberado. Peça ao gestor para ativar o cadastro.');
  }
  S.perfil = perfil;
  $('#gate').classList.add('hide'); $('#shell').classList.remove('hide');
  $('#userNome').textContent = perfil.nome;
  $('#userPapel').textContent = {GESTOR:'Gestor',OPERADOR:'Operador',LEITURA:'Consulta'}[perfil.papel];
  await carregarBase(); await carregarEstoque(); await carregarAtrasados();
  await carregarLavanderia(); await carregarDotacao();
  $('#uniLbl').textContent = S.unidade ? S.unidade.nome : CONFIG.LOJA;
  const h = location.hash.slice(1);
  S.rota = ROTAS.some(r=>r.id===h) ? h : 'painel';
  render();
}
(async function boot(){
  const c = cfg();
  if(!c.url || !c.key) return telaConfig();
  try { S.sb = supabase.createClient(c.url, c.key); }
  catch(e){ return telaConfig('Configuração inválida: '+e.message); }
  const { data:{ session } } = await S.sb.auth.getSession();
  session ? iniciarSessao() : telaLogin();
})();
</script>
<script>
/* =====================================================================
   VIEWS — PAINEL E ESTOQUE
   ===================================================================== */

function chartBarras(dados, alt=190){
  if(!dados.length) return '<div class="empty">Sem movimento no período.</div>';
  const w=760, h=alt, pad={t:12,r:8,b:26,l:44};
  const max = Math.max(1, ...dados.flatMap(d=>[d.a,d.b]));
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const bw = iw/dados.length, bar = Math.min(20, bw/3);
  const y = v => pad.t + ih - (v/max)*ih;
  let g='';
  for(let i=0;i<=3;i++){
    const v = max*i/3, yy = y(v);
    g += `<line class="ax" x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}"/>
          <text class="lbl" x="${pad.l-8}" y="${yy+3}" text-anchor="end">${Math.round(v)}</text>`;
  }
  dados.forEach((d,i)=>{
    const cx = pad.l + bw*i + bw/2;
    g += `<rect class="bar-in"  x="${cx-bar-2}" y="${y(d.a)}" width="${bar}" height="${pad.t+ih-y(d.a)}" rx="2"><title>${esc(d.r)} · entradas ${d.a}</title></rect>
          <rect class="bar-out" x="${cx+2}"     y="${y(d.b)}" width="${bar}" height="${pad.t+ih-y(d.b)}" rx="2"><title>${esc(d.r)} · saídas ${d.b}</title></rect>
          <text class="lbl" x="${cx}" y="${h-8}" text-anchor="middle">${esc(d.r)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${g}</svg>
    <div class="legend"><span><i style="background:var(--sea-t)"></i>Entradas</span><span><i style="background:#8FA3B0"></i>Saídas</span></div>`;
}

async function viewPainel(){
  const desde = diasAtras(180);
  const [mensal, saidas90, empAbertos, faltas] = await Promise.all([
    q('almox_vw_mov_mensal','*',b=>b.gte('mes', desde.slice(0,10))),
    q('almox_vw_movimentacoes','tipo,quantidade,item,tamanho,setor,funcionario,data',
      b=>b.gte('data', diasAtras(90)).eq('cancelada',false).in('tipo',['SAIDA_FUNCIONARIO','SAIDA_EMPRESTIMO'])),
    q('almox_vw_emprestimos','*',b=>b.in('status',['ABERTO','PARCIAL']).order('previsao_devolucao')),
    q('almox_vw_dotacao','*',b=>b.gt('falta',0).order('falta',{ascending:false}).limit(10))
  ]);

  const pecas  = S.estoque.reduce((s,e)=>s+e.saldo,0);
  const valor  = S.estoque.reduce((s,e)=>s+Number(e.valor_estoque||0),0);
  const zerados= S.estoque.filter(e=>e.variacao_ativa && e.item_ativo && e.situacao==='ZERADO').length;
  const baixos = S.estoque.filter(e=>e.variacao_ativa && e.item_ativo && e.situacao==='BAIXO').length;
  const atras  = empAbertos.filter(e=>e.atrasado).length;
  const saidas30 = saidas90.filter(m=>new Date(m.data)>=new Date(diasAtras(30))).reduce((s,m)=>s+m.quantidade,0);
  const emLav  = S.estoque.reduce((s,e)=>s+(e.saldo_lavanderia||0),0);

  // serie mensal
  const meses = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const k = d.toISOString().slice(0,7);
    const ent = mensal.filter(m=>m.mes.slice(0,7)===k && m.tipo.startsWith('ENTRADA')).reduce((s,m)=>s+m.quantidade,0);
    const sai = mensal.filter(m=>m.mes.slice(0,7)===k && m.tipo.startsWith('SAIDA')).reduce((s,m)=>s+m.quantidade,0);
    meses.push({r: d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), a:ent, b:sai});
  }
  // top itens e setores
  const agr = (arr,campo)=>{
    const m = {}; arr.forEach(x=>{ const k = x[campo] || '—'; m[k]=(m[k]||0)+x.quantidade; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  };
  const topItens  = agr(saidas90.map(m=>({...m, chave:`${m.item} ${m.tamanho}`})),'chave').slice(0,6);
  const topSetor  = agr(saidas90,'setor').slice(0,6);
  const critico   = S.estoque.filter(e=>e.variacao_ativa && e.item_ativo && e.situacao!=='OK')
                    .sort((a,b)=>a.saldo-b.saldo || a.item.localeCompare(b.item)).slice(0,10);

  $('#topAcoes').innerHTML = podeOperar()
    ? `<button class="btn" onclick="formEntradaCompra()">Registrar compra</button>
       <button class="btn pri" onclick="formSaidaFuncionario()">Entregar a funcionário</button>` : '';

  $('#view').innerHTML = `
    <div class="kpis" style="margin-bottom:18px">
      <div class="kpi"><div class="l">Disponível para entregar</div><div class="v">${num(pecas)}</div>
        <div class="d">${S.estoque.filter(e=>e.variacao_ativa && e.item_ativo).length} combinações item/tamanho</div></div>
      <div class="kpi good"><div class="l">Valor imobilizado</div><div class="v" style="font-size:23px">${brl(valor)}</div>
        <div class="d">pelo custo de referência</div></div>
      <div class="kpi ${zerados?'bad':baixos?'warn':''}"><div class="l">Reposição</div><div class="v">${num(zerados+baixos)}</div>
        <div class="d">${zerados} zerados · ${baixos} abaixo do mínimo</div></div>
      <div class="kpi ${atras?'bad':''}"><div class="l">Empréstimos abertos</div><div class="v">${num(empAbertos.length)}</div>
        <div class="d">${atras? atras+' com devolução atrasada' : 'nenhum atrasado'}</div></div>
      <div class="kpi ${S.aguardando?'warn':''}"><div class="l">Na lavanderia</div><div class="v">${num(emLav)}</div>
        <div class="d">${S.aguardando} aguardando envio</div></div>
      <div class="kpi ${S.semDotacao?'bad':'good'}"><div class="l">Abaixo da dotação</div><div class="v">${num(S.semDotacao)}</div>
        <div class="d">funcionários sem o mínimo de peças</div></div>
      <div class="kpi"><div class="l">Saídas em 30 dias</div><div class="v">${num(saidas30)}</div>
        <div class="d">peças entregues ou emprestadas</div></div>
    </div>

    <div class="grid" style="grid-template-columns:1.4fr 1fr;align-items:start">
      <div class="card">
        <div class="card-h"><h3>Entradas e saídas por mês</h3><div class="sp"></div>
          <span class="small muted">últimos 6 meses</span></div>
        <div class="card-b">${chartBarras(meses)}</div>
      </div>
      <div class="card">
        <div class="card-h"><h3>Precisa de reposição</h3><div class="sp"></div>
          <button class="btn sm" onclick="irPara('estoque')">Ver estoque</button></div>
        ${critico.length ? `<div class="tbl-wrap"><table><tbody>${critico.map(e=>`
          <tr style="cursor:pointer" onclick="drawerVariacao(${e.variacao_id})">
            <td><div class="it-nome">${esc(e.item)}</div><div class="it-meta">${esc(e.tamanho)} · ${esc(e.categoria||'—')}</div></td>
            <td class="num" style="width:110px"><span class="tag ${e.situacao==='ZERADO'?'zero':'low'}">${e.saldo} / mín ${e.estoque_minimo}</span></td>
          </tr>`).join('')}</tbody></table></div>`
          : '<div class="empty">Estoque todo acima do mínimo.</div>'}
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px;align-items:start">
      <div class="card">
        <div class="card-h"><h3>Mais consumidos</h3><div class="sp"></div><span class="small muted">90 dias</span></div>
        ${topItens.length? `<div class="tbl-wrap"><table><tbody>${topItens.map(([k,v])=>`
          <tr><td>${esc(k)}</td><td class="num" style="width:70px">${v}</td></tr>`).join('')}</tbody></table></div>`
          : '<div class="empty">Nenhuma saída registrada ainda.</div>'}
      </div>
      <div class="card">
        <div class="card-h"><h3>Consumo por setor</h3><div class="sp"></div><span class="small muted">90 dias</span></div>
        ${topSetor.length? `<div class="tbl-wrap"><table><tbody>${topSetor.map(([k,v])=>`
          <tr><td>${esc(k)}</td><td class="num" style="width:70px">${v}</td></tr>`).join('')}</tbody></table></div>`
          : '<div class="empty">Nenhuma saída registrada ainda.</div>'}
      </div>
    </div>

    ${faltas.length? `<div class="card" style="margin-top:14px">
      <div class="card-h"><h3>Funcionários abaixo da dotação</h3><div class="sp"></div>
        <button class="btn sm" onclick="irPara('dotacao')">Ver todos</button></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Funcionário</th><th>Setor</th><th>Grupo</th><th class="num">Tem</th>
          <th class="num">Mínimo</th><th class="num">Falta</th><th></th></tr></thead>
        <tbody>${faltas.map(d=>`<tr>
          <td>${esc(d.funcionario)}</td><td class="small">${esc(d.setor||'—')}</td>
          <td>${esc(d.grupo)}</td><td class="num">${d.em_posse}</td><td class="num muted">${d.quantidade_minima}</td>
          <td class="num"><span class="tag zero">${d.falta}</span></td>
          <td style="text-align:right">${podeOperar()?`<button class="btn sm" onclick="formSaidaFuncionario(null,${d.funcionario_id})">Entregar</button>`:''}</td>
        </tr>`).join('')}</tbody></table></div></div>` : ''}

    ${empAbertos.length? `<div class="card" style="margin-top:14px">
      <div class="card-h"><h3>Empréstimos a devolver</h3><div class="sp"></div>
        <button class="btn sm" onclick="irPara('emprestimos')">Abrir módulo</button></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Recibo</th><th>Funcionário</th><th>Saída</th><th>Previsão</th><th class="num">Pendentes</th><th></th></tr></thead>
        <tbody>${empAbertos.slice(0,8).map(e=>`<tr>
          <td class="mono">${esc(e.codigo)}</td>
          <td>${esc(e.funcionario)}<div class="it-meta">${esc(e.setor||'—')}</div></td>
          <td>${dt(e.data_saida)}</td>
          <td>${e.atrasado? `<span class="tag zero">${dt(e.previsao_devolucao)}</span>` : dt(e.previsao_devolucao)}</td>
          <td class="num">${e.pendentes}</td>
          <td style="text-align:right"><button class="btn sm" onclick="abrirEmprestimo(${e.id})">Detalhes</button></td>
        </tr>`).join('')}</tbody></table></div></div>` : ''}
  `;
}

/* --------------------- ESTOQUE : MATRIZ ITEM x TAMANHO --------------- */
let filtroCat = 'todas', filtroBusca = '';

async function viewEstoque(){
  await carregarEstoque();
  $('#topAcoes').innerHTML = `
    <input class="inp" style="width:200px" placeholder="Buscar item…" value="${esc(filtroBusca)}"
      oninput="filtroBusca=this.value;desenharMatriz()">
    <select class="inp" style="width:180px" onchange="filtroCat=this.value;desenharMatriz()">
      <option value="todas">Todas as categorias</option>
      ${S.categorias.map(c=>`<option value="${c.id}" ${filtroCat==String(c.id)?'selected':''}>${esc(c.nome)}</option>`).join('')}
    </select>
    <button class="btn" onclick="exportarEstoqueCSV()">Exportar CSV</button>
    ${ehGestor()?`<button class="btn" onclick="recalcularSaldos()">Recalcular saldos</button>`:''}`;
  $('#view').innerHTML = `<div id="matrizes"></div>`;
  desenharMatriz();
}

function desenharMatriz(){
  const busca = filtroBusca.trim().toLowerCase();
  let dados = S.estoque.filter(e=>e.variacao_ativa && e.item_ativo);
  if(filtroCat!=='todas') dados = dados.filter(e=>String(e.categoria_id)===filtroCat);
  if(busca) dados = dados.filter(e=>(e.item+' '+(e.categoria||'')+' '+(e.cor||'')).toLowerCase().includes(busca));

  if(!dados.length) return $('#matrizes').innerHTML =
    `<div class="card"><div class="empty"><b>Nada encontrado</b>Ajuste a busca ou cadastre itens em “Itens e grades”.</div></div>`;

  // agrupa por grade -> item
  const porGrade = {};
  dados.forEach(e=>{ (porGrade[e.grade_id] ||= {grade:e.grade, grade_id:e.grade_id, itens:{}});
    (porGrade[e.grade_id].itens[e.item_id] ||= {nome:e.item, cat:e.categoria, cor:e.cor, epi:e.epi, cels:{}, total:0});
    porGrade[e.grade_id].itens[e.item_id].cels[e.tamanho_id ?? 'u'] = e;
    porGrade[e.grade_id].itens[e.item_id].total += e.saldo;
  });

  $('#matrizes').innerHTML = Object.values(porGrade).map(g=>{
    const tams = tamanhosDaGrade(g.grade_id);
    const itens = Object.values(g.itens).sort((a,b)=>a.nome.localeCompare(b.nome));
    const totalGrade = itens.reduce((s,i)=>s+i.total,0);
    return `<div class="matriz">
      <div class="matriz-h"><h3>${esc(g.grade)}</h3>
        <span class="g">${itens.length} itens · ${num(totalGrade)} peças</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th class="item-col">Item</th>
          ${tams.map(t=>`<th class="num" style="text-align:center">${esc(t.rotulo)}</th>`).join('')}
          <th class="num">Total</th></tr></thead>
        <tbody>${itens.map(it=>`<tr>
          <td class="item-col"><div class="it-nome">${esc(it.nome)}</div>
            <div class="it-meta">${esc(it.cat||'—')}${it.epi?' · EPI':''}</div></td>
          ${tams.map(t=>{
            const c = it.cels[t.id];
            if(!c) return `<td><button class="cel na" disabled>–</button></td>`;
            const cls = c.saldo<=0?'zero':(c.situacao==='BAIXO'?'low':'');
            return `<td><button class="cel ${cls}" onclick="drawerVariacao(${c.variacao_id})"
                      title="${esc(it.nome)} ${esc(t.rotulo)} — disponível ${c.saldo}, mínimo ${c.estoque_minimo}${c.saldo_lavanderia?', '+c.saldo_lavanderia+' na lavanderia':''}">${c.saldo}
                      ${c.saldo_lavanderia?`<span class="lav">+${c.saldo_lavanderia} lav</span>`:
                        c.situacao!=='OK'?`<span class="m">mín ${c.estoque_minimo}</span>`:''}</button></td>`;
          }).join('')}
          <td class="num" style="font-weight:600">${num(it.total)}</td>
        </tr>`).join('')}</tbody></table></div></div>`;
  }).join('');
}

async function drawerVariacao(id){
  const e = S.estoque.find(x=>x.variacao_id===id);
  if(!e) return;
  const d = drawer({
    titulo: e.item,
    sub: `${esc(e.tamanho)} · ${esc(e.categoria||'—')} · <span class="mono">${esc(e.sku||'')}</span>`,
    corpo: `
      <div class="kpis" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px">
        <div class="kpi ${e.situacao==='ZERADO'?'bad':e.situacao==='BAIXO'?'warn':'good'}" style="padding:12px 14px">
          <div class="l">Disponível</div><div class="v" style="font-size:24px">${e.saldo}</div></div>
        <div class="kpi ${e.saldo_lavanderia?'warn':''}" style="padding:12px 14px">
          <div class="l">Lavanderia</div><div class="v" style="font-size:24px">${e.saldo_lavanderia}</div></div>
        <div class="kpi" style="padding:12px 14px"><div class="l">Mínimo</div><div class="v" style="font-size:24px">${e.estoque_minimo}</div></div>
        <div class="kpi" style="padding:12px 14px"><div class="l">Valor</div><div class="v" style="font-size:16px">${brl(e.valor_estoque)}</div></div>
      </div>
      ${podeOperar()?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
        <button class="btn sm" onclick="formEntradaCompra(${id})">Entrada</button>
        <button class="btn sm" onclick="formSaidaFuncionario(${id})">Entregar</button>
        <button class="btn sm" onclick="formEmprestimo(${id})">Emprestar</button>
        <button class="btn sm" onclick="formDevolucao(${id})">Devolução</button>
        <button class="btn sm dan" onclick="formDescarte(${id})">Descarte</button>
      </div>`:''}
      <h4 style="font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-family:var(--mono);margin-bottom:8px">Últimas movimentações</h4>
      <div id="histVar" class="muted small">Carregando…</div>`
  });
  const h = await q('almox_vw_movimentacoes','*',b=>b.eq('variacao_id',id).order('data',{ascending:false}).limit(30));
  const el = d.ovl.querySelector('#histVar');
  el.innerHTML = h.length ? `<div class="tbl-wrap"><table><tbody>${h.map(m=>`
    <tr${m.cancelada?' style="opacity:.45;text-decoration:line-through"':''}>
      <td style="width:88px" class="small muted">${dth(m.data)}</td>
      <td><span class="tag ${m.e_entrada?'in':'out'}">${m.e_entrada?'+':'−'}${m.quantidade}</span>
        <div class="it-meta" style="margin-top:3px">${esc(TIPOS[m.tipo])}${m.funcionario?' · '+esc(m.funcionario):''}</div></td>
      <td class="num small muted">${m.saldo_posterior ?? ''}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">Sem movimentações.</div>';
}

async function recalcularSaldos(){
  if(!exigeGestor()) return;
  confirmar('Recalcular saldos','Os saldos serão reconstruídos a partir do histórico de movimentações. Use quando desconfiar de divergência.',
    async()=>{ const {data,error}=await S.sb.rpc('almox_recalcular_saldos'); if(error) throw error;
      toast(data.length? `${data.length} saldo(s) corrigido(s).`:'Nenhuma divergência encontrada.','ok');
      await carregarEstoque(); desenharMatriz(); montarNav(); }, 'Recalcular');
}
function exportarEstoqueCSV(){
  const linhas = [['Categoria','Item','Tamanho','SKU','Saldo','Minimo','Situacao','Custo','Valor']];
  S.estoque.filter(e=>e.variacao_ativa && e.item_ativo).forEach(e=>linhas.push([e.categoria,e.item,e.tamanho,e.sku,e.saldo,e.estoque_minimo,e.situacao,e.custo_referencia,e.valor_estoque]));
  const csv = linhas.map(l=>l.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8'}));
  a.download = `estoque-uniformes-${hoje()}.csv`; a.click();
}
</script>
<script>
/* =====================================================================
   SELETOR DE ITENS (usado em todos os lançamentos)
   ===================================================================== */
function htmlSeletor(comCusto=false){
  return `<div class="pick">
      <label class="field"><span>Item</span>
        <select class="inp" id="selItem"><option value="">Selecione…</option>
        ${S.itens.filter(i=>i.ativo).map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('')}
        </select></label>
      <label class="field" style="max-width:130px"><span>Tamanho</span>
        <select class="inp" id="selTam"><option value="">—</option></select></label>
      <label class="field" style="max-width:88px"><span>Qtd</span>
        <input class="inp mono" id="selQtd" type="number" min="1" value="1"></label>
      ${comCusto?`<label class="field" style="max-width:120px"><span>Custo un. (R$)</span>
        <input class="inp mono" id="selCusto" type="number" min="0" step="0.01" placeholder="0,00"></label>`:''}
      <button type="button" class="btn" id="btnAdd">Adicionar</button>
    </div>
    <div id="selInfo" class="small muted" style="margin:-6px 0 10px"></div>
    <div class="lista-itens" id="listaSel"><div class="li muted">Nenhum item incluído.</div></div>`;
}
function ligarSeletor(ovl, preVarId=null, comCusto=false){
  ovl._itens = [];
  const si=ovl.querySelector('#selItem'), st=ovl.querySelector('#selTam'),
        sq=ovl.querySelector('#selQtd'), sc=ovl.querySelector('#selCusto'),
        info=ovl.querySelector('#selInfo');

  const varsDoItem = id => S.estoque.filter(e=>e.item_id==id && e.variacao_ativa)
                            .sort((a,b)=>a.tamanho_ordem-b.tamanho_ordem);
  function popularTam(){
    const vs = varsDoItem(si.value);
    st.innerHTML = vs.map(v=>`<option value="${v.variacao_id}">${esc(v.tamanho)} (saldo ${v.saldo})</option>`).join('')
                  || '<option value="">—</option>';
    mostrarInfo();
  }
  function mostrarInfo(){
    const v = S.estoque.find(e=>e.variacao_id==st.value);
    info.textContent = v ? `Saldo atual: ${v.saldo} · mínimo ${v.estoque_minimo} · ${v.sku||''}` : '';
  }
  si.onchange = popularTam; st.onchange = mostrarInfo;

  ovl.querySelector('#btnAdd').onclick = ()=>{
    const vid = Number(st.value), qtd = Number(sq.value);
    if(!vid) return toast('Escolha o item e o tamanho.','err');
    if(!qtd || qtd<1) return toast('Quantidade inválida.','err');
    const v = S.estoque.find(e=>e.variacao_id===vid);
    const ex = ovl._itens.find(x=>x.variacao_id===vid);
    if(ex) ex.quantidade += qtd;
    else ovl._itens.push({variacao_id:vid, quantidade:qtd, saldo:v.saldo,
            custo: sc? Number(sc.value||0) : null, rotulo:`${v.item} · ${v.tamanho}`});
    sq.value = 1; if(sc) sc.value='';
    pintar();
  };
  function pintar(){
    const l = ovl.querySelector('#listaSel');
    l.innerHTML = ovl._itens.length ? ovl._itens.map((x,i)=>`
      <div class="li"><span class="qt">${x.quantidade}×</span><span class="sp">${esc(x.rotulo)}
        ${x.custo?`<span class="muted small"> — ${brl(x.custo)}/un</span>`:''}</span>
        <span class="small muted">saldo ${x.saldo}</span>
        <button type="button" class="btn sm dan" data-i="${i}">Remover</button></div>`).join('')
      : '<div class="li muted">Nenhum item incluído.</div>';
    l.querySelectorAll('button[data-i]').forEach(b=> b.onclick=()=>{ ovl._itens.splice(+b.dataset.i,1); pintar(); });
  }
  if(preVarId){
    const v = S.estoque.find(e=>e.variacao_id===preVarId);
    if(v){ si.value = v.item_id; popularTam(); st.value = String(preVarId); mostrarInfo(); }
  }
  pintar();
}
const exigirItens = ovl => { if(!ovl._itens.length){ toast('Inclua ao menos um item.','err'); return false; } return true; };

async function gravarMovs(linhas){
  const base = { unidade_id: S.unidade?.id ?? null, usuario_id: S.user.id };
  const { error } = await S.sb.from('almox_movimentacoes').insert(linhas.map(l=>({...base, ...l})));
  if(error) throw error;
}
async function depoisDeMovimentar(msg){
  await carregarEstoque(); await carregarAtrasados();
  await carregarLavanderia(); await carregarDotacao(); montarNav();
  toast(msg,'ok'); render();
}

/* =====================================================================
   LANCAMENTOS
   ===================================================================== */
function formEntradaCompra(varId=null){
  if(!podeOperar()) return toast('Sem permissão para lançar.','err');
  modal({titulo:'Entrada por compra', wide:true, corpo:`
    <div class="row-3">
      <label class="field"><span>Fornecedor</span><select class="inp" id="fFor">
        <option value="">Não informado</option>
        ${S.fornecedores.filter(f=>f.ativo).map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('')}
      </select></label>
      <label class="field"><span>Nota fiscal / pedido</span><input class="inp" id="fDoc" placeholder="NF 12345"></label>
      <label class="field"><span>Data</span><input class="inp" id="fData" type="date" value="${hoje()}"></label>
    </div>
    ${htmlSeletor(true)}
    <label class="field" style="margin-top:14px"><span>Observações</span><textarea class="inp" id="fObs"></textarea></label>`,
    aoAbrir:o=>ligarSeletor(o, varId, true),
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar entrada',classe:'pri',acao:async(o,f,b)=>{
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        const data = o.querySelector('#fData').value;
        await gravarMovs(o._itens.map(x=>({
          variacao_id:x.variacao_id, tipo:'ENTRADA_COMPRA', quantidade:x.quantidade,
          custo_unitario: x.custo || null,
          data: data? new Date(data+'T12:00:00').toISOString() : new Date().toISOString(),
          fornecedor_id: o.querySelector('#fFor').value || null,
          documento: o.querySelector('#fDoc').value || null,
          justificativa: 'Compra',
          observacoes: o.querySelector('#fObs').value || null
        })));
        f(); depoisDeMovimentar('Entrada registrada.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formSaidaFuncionario(varId=null, funcId=null){
  if(!podeOperar()) return toast('Sem permissão para lançar.','err');
  modal({titulo:'Entrega definitiva a funcionário', wide:true, corpo:`
    <div class="row">
      <label class="field"><span>Funcionário <em>*</em></span><select class="inp" id="fFunc">
        <option value="">Selecione…</option>
        ${S.funcionarios.filter(f=>f.ativo).map(f=>`<option value="${f.id}">${esc(f.nome)}${f.setor?' — '+esc(f.setor):''}</option>`).join('')}
      </select></label>
      <label class="field"><span>Justificativa <em>*</em></span><select class="inp" id="fJust">
        <option>Uniforme inicial (admissão)</option>
        <option>Troca por desgaste</option>
        <option>Troca por dano</option>
        <option>Troca de tamanho</option>
        <option>Perda pelo funcionário</option>
        <option>Reposição periódica</option>
        <option value="__outro">Outro motivo…</option>
      </select></label>
    </div>
    <label class="field hide" id="fJustOutroBox"><span>Descreva o motivo <em>*</em></span><input class="inp" id="fJustOutro"></label>
    ${htmlSeletor(false)}
    <label class="field" style="margin-top:14px"><span>Observações</span><textarea class="inp" id="fObs"></textarea></label>
    <label class="check"><input type="checkbox" id="fRecibo" checked> Gerar comprovante de entrega para assinatura</label>`,
    aoAbrir:o=>{
      ligarSeletor(o, varId);
      if(funcId) o.querySelector('#fFunc').value = String(funcId);
      o.querySelector('#fJust').onchange = e =>
        o.querySelector('#fJustOutroBox').classList.toggle('hide', e.target.value!=='__outro');
    },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar entrega',classe:'pri',acao:async(o,f,b)=>{
      const func = o.querySelector('#fFunc').value;
      let just = o.querySelector('#fJust').value;
      if(just==='__outro') just = o.querySelector('#fJustOutro').value.trim();
      if(!func) return toast('Selecione o funcionário.','err');
      if(!just) return toast('A justificativa é obrigatória.','err');
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        const { error } = await S.sb.rpc('almox_saida_funcionario',{
          p_funcionario_id: Number(func),
          p_itens: o._itens.map(x=>({variacao_id:x.variacao_id, quantidade:x.quantidade})),
          p_justificativa: just,
          p_observacoes: o.querySelector('#fObs').value || null,
          p_unidade_id: S.unidade?.id ?? null
        });
        if(error) throw error;
        const gerar = o.querySelector('#fRecibo').checked;
        const dadosRecibo = {func:Number(func), just, itens:[...o._itens]};
        f(); await depoisDeMovimentar('Entrega registrada.');
        if(gerar) reciboEntrega(dadosRecibo);
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formDevolucao(varId=null){
  if(!podeOperar()) return toast('Sem permissão para lançar.','err');
  modal({titulo:'Entrada por devolução', wide:true, corpo:`
    <p class="small muted" style="margin-top:0">Para peças que voltam fora de um empréstimo — desligamento, troca de tamanho

    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar devolução',classe:'pri',acao:async(o,f,b)=>{

      if(!func) return toast('Selecione o funcionário.','err');
      if(!just) return toast('Informe o motivo.','err');
      if(!exigirItens(o)) return;

          bucket:o.querySelector('#fDest').value,
          funcionario_id:Number(func), justificativa:just,
          observacoes:o.querySelector('#fObs').value || null })));
        f(); depoisDeMovimentar(o.querySelector('#fDest').value==='LAVANDERIA'
          ? 'Devolução registrada. As peças entraram na fila da lavanderia.'
          : 'Devolução registrada direto no estoque.');
      }catch(e){ erro(e); b.disabled=false; }

}

function formDescarte(varId=null){
  if(!ehGestor()) return toast('Descarte é restrito ao gestor.','err');
  modal({titulo:'Baixa por descarte ou perda', wide:true, corpo:`
    <label class="field"><span>Motivo <em>*</em></span><select class="inp" id="fJust">
      <option>Peça danificada / imprópria para uso</option>
      <option>Extravio no almoxarifado</option>
