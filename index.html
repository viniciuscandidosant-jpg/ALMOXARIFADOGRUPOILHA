    <label class="field" style="margin-top:14px"><span>Observações</span><textarea class="inp" id="fObs"></textarea></label>`,
    aoAbrir:o=>{ ligarSeletor(o, varId);
      o.querySelector('#fJust').onchange = e => o.querySelector('#fJustOutroBox').classList.toggle('hide', e.target.value!=='__outro'); },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Dar baixa',classe:'dan',acao:async(o,f,b)=>{
      let just = o.querySelector('#fJust').value;
      if(just==='__outro') just = o.querySelector('#fJustOutro').value.trim();
      if(!just) return toast('Informe o motivo.','err');
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        await gravarMovs(o._itens.map(x=>({
          variacao_id:x.variacao_id, tipo:'SAIDA_DESCARTE', quantidade:x.quantidade,
          justificativa:just, observacoes:o.querySelector('#fObs').value || null })));
        f(); depoisDeMovimentar('Baixa registrada.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formAjuste(){
  if(!ehGestor()) return toast('Ajuste é restrito ao gestor.','err');
  modal({titulo:'Ajuste manual de saldo', wide:true, corpo:`
    <p class="small muted" style="margin-top:0">Todo ajuste fica registrado com autor e justificativa.
    Para conferência completa prefira o módulo Inventário.</p>
    <div class="row">
      <label class="field"><span>Sentido <em>*</em></span><select class="inp" id="fSent">
        <option value="ENTRADA_AJUSTE">Somar ao estoque</option>
        <option value="SAIDA_AJUSTE">Subtrair do estoque</option>
      </select></label>
      <label class="field"><span>Justificativa <em>*</em></span><input class="inp" id="fJust" placeholder="Ex.: peças encontradas no depósito"></label>
    </div>
    ${htmlSeletor(false)}`,
    aoAbrir:o=>ligarSeletor(o),
    acoes:[{rotulo:'Cancelar'},{rotulo:'Aplicar ajuste',classe:'pri',acao:async(o,f,b)=>{
      const just = o.querySelector('#fJust').value.trim();
      if(!just) return toast('A justificativa é obrigatória.','err');
      if(!exigirItens(o)) return;
      b.disabled=true;
      try{
        const tipo = o.querySelector('#fSent').value;
        await gravarMovs(o._itens.map(x=>({
          variacao_id:x.variacao_id, tipo, quantidade:x.quantidade, justificativa:just })));
        f(); depoisDeMovimentar('Ajuste aplicado.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
</script>
<script>
/* =====================================================================
   MOVIMENTACOES
   ===================================================================== */
const FM = {tipo:'', periodo:'30', func:'', busca:'', cat:''};

async function viewMovimentacoes(){
  $('#topAcoes').innerHTML = podeOperar() ? `
    <button class="btn" onclick="formEntradaCompra()">Compra</button>
    <button class="btn" onclick="formDevolucao()">Devolução</button>
    <button class="btn pri" onclick="formSaidaFuncionario()">Entrega</button>
    <button class="btn" onclick="formEmprestimo()">Empréstimo</button>
    ${ehGestor()?`<button class="btn" onclick="formAjuste()">Ajuste</button>
      <button class="btn dan" onclick="formDescarte()">Descarte</button>`:''}` : '';

  $('#view').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-b" style="padding:12px 16px">
      <div class="pick" style="margin:0">
        <label class="field"><span>Período</span><select class="inp" id="fmPer">
          ${[['7','Últimos 7 dias'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['365','Últimos 12 meses'],['0','Tudo']]
            .map(([v,t])=>`<option value="${v}" ${FM.periodo===v?'selected':''}>${t}</option>`).join('')}
        </select></label>
        <label class="field"><span>Tipo</span><select class="inp" id="fmTipo">
          <option value="">Todos</option>
          ${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${FM.tipo===k?'selected':''}>${v}</option>`).join('')}
        </select></label>
        <label class="field"><span>Funcionário</span><select class="inp" id="fmFunc">
          <option value="">Todos</option>
          ${S.funcionarios.map(f=>`<option value="${f.id}" ${FM.func==String(f.id)?'selected':''}>${esc(f.nome)}</option>`).join('')}
        </select></label>
        <label class="field"><span>Buscar item</span><input class="inp" id="fmBusca" value="${esc(FM.busca)}" placeholder="Nome do item…"></label>
        <button class="btn" id="fmAplicar">Filtrar</button>
        <button class="btn" id="fmCsv">CSV</button>
      </div></div></div>
    <div class="card"><div id="movLista"><div class="empty">Carregando…</div></div></div>`;

  $('#fmAplicar').onclick = ()=>{
    FM.periodo=$('#fmPer').value; FM.tipo=$('#fmTipo').value;
    FM.func=$('#fmFunc').value; FM.busca=$('#fmBusca').value; carregarMovs();
  };
  $('#fmBusca').onkeydown = e=>{ if(e.key==='Enter') $('#fmAplicar').click(); };
  $('#fmCsv').onclick = ()=>exportarMovsCSV();
  carregarMovs();
}

let MOVS = [];
async function carregarMovs(){
  let b = S.sb.from('almox_vw_movimentacoes').select('*').order('data',{ascending:false}).limit(500);
  if(FM.periodo!=='0') b = b.gte('data', diasAtras(Number(FM.periodo)));
  if(FM.tipo) b = b.eq('tipo', FM.tipo);
  if(FM.func) b = b.eq('funcionario_id', Number(FM.func));
  if(FM.busca) b = b.ilike('item', '%'+FM.busca+'%');
  const { data, error } = await b;
  if(error) return erro(error);
  MOVS = data;
  const el = $('#movLista');
  if(!data.length) return el.innerHTML = '<div class="empty"><b>Nenhuma movimentação</b>Ajuste os filtros ou registre um lançamento.</div>';

  const totIn  = data.filter(m=>m.e_entrada && !m.cancelada).reduce((s,m)=>s+m.quantidade,0);
  const totOut = data.filter(m=>!m.e_entrada && !m.cancelada).reduce((s,m)=>s+m.quantidade,0);
  const valor  = data.filter(m=>m.tipo==='ENTRADA_COMPRA' && !m.cancelada).reduce((s,m)=>s+Number(m.valor_total||0),0);

  el.innerHTML = `
    <div class="card-h"><h3>${data.length} lançamentos</h3><div class="sp"></div>
      <span class="tag in">+${num(totIn)} entradas</span>
      <span class="tag out">−${num(totOut)} saídas</span>
      <span class="tag">${brl(valor)} em compras</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Data</th><th>Tipo</th><th>Item</th><th class="num">Qtd</th><th>Pessoa / documento</th>
        <th>Justificativa</th><th class="num">Saldo</th><th></th></tr></thead>
      <tbody>${data.map(m=>`<tr${m.cancelada?' style="opacity:.5"':''}>
        <td class="small mono">${dth(m.data)}</td>
        <td><span class="tag ${m.e_entrada?'in':'out'}">${m.e_entrada?'entrada':'saída'}</span>
          <div class="it-meta">${esc(TIPOS[m.tipo].split('— ')[1]||TIPOS[m.tipo])}</div></td>
        <td><div class="it-nome"${m.cancelada?' style="text-decoration:line-through"':''}>${esc(m.item)}</div>
          <div class="it-meta">${esc(m.tamanho)}</div></td>
        <td class="num" style="font-weight:600">${m.e_entrada?'+':'−'}${m.quantidade}</td>
        <td class="small">${esc(m.funcionario || m.fornecedor || '—')}
          ${m.documento?`<div class="it-meta">${esc(m.documento)}</div>`:''}</td>
        <td class="small muted">${esc(m.cancelada ? 'CANCELADA: '+(m.motivo_cancelamento||'') : (m.justificativa||'—'))}</td>
        <td class="num small muted">${m.saldo_posterior ?? ''}</td>
        <td style="text-align:right">${(ehGestor() && !m.cancelada && !m.emprestimo_id)
          ? `<button class="btn sm dan" onclick="cancelarMov(${m.id})">Cancelar</button>`:''}</td>
      </tr>`).join('')}</tbody></table></div>`;
}
function cancelarMov(id){
  modal({titulo:'Cancelar movimentação', corpo:`
    <p style="margin-top:0">O lançamento fica no histórico marcado como cancelado e o saldo é estornado.</p>
    <label class="field"><span>Motivo do cancelamento <em>*</em></span><input class="inp" id="cMot" placeholder="Ex.: lançamento em duplicidade"></label>`,
    acoes:[{rotulo:'Voltar'},{rotulo:'Cancelar lançamento',classe:'dan',acao:async(o,f,b)=>{
      const mot = o.querySelector('#cMot').value.trim();
      if(!mot) return toast('Informe o motivo.','err');
      b.disabled=true;
      try{ const {error} = await S.sb.rpc('almox_cancelar_movimentacao',{p_id:id,p_motivo:mot});
        if(error) throw error; f(); await carregarEstoque(); montarNav(); carregarMovs(); toast('Lançamento cancelado.','ok');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
function exportarMovsCSV(){
  const l = [['Data','Tipo','Item','Tamanho','Qtd','Sentido','Pessoa','Documento','Justificativa','Valor','Cancelada']];
  MOVS.forEach(m=>l.push([dth(m.data),TIPOS[m.tipo],m.item,m.tamanho,m.quantidade,m.e_entrada?'ENTRADA':'SAIDA',
    m.funcionario||m.fornecedor||'',m.documento||'',m.justificativa||'',m.valor_total||0,m.cancelada?'SIM':'NAO']));
  const csv = l.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`movimentacoes-${hoje()}.csv`; a.click();
}

/* =====================================================================
   EMPRESTIMOS
   ===================================================================== */
let FE = 'abertos';
async function viewEmprestimos(){
  $('#topAcoes').innerHTML = podeOperar()
    ? `<button class="btn pri" onclick="formEmprestimo()">Novo empréstimo</button>` : '';
  const dados = await q('almox_vw_emprestimos','*',b=>b.order('data_saida',{ascending:false}).limit(300));
  const filtra = f => f==='abertos' ? dados.filter(e=>['ABERTO','PARCIAL'].includes(e.status))
                    : f==='atrasados' ? dados.filter(e=>e.atrasado)
                    : f==='encerrados' ? dados.filter(e=>['DEVOLVIDO','BAIXADO'].includes(e.status)) : dados;
  const render = ()=>{
    const l = filtra(FE);
    $('#empLista').innerHTML = l.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>Recibo</th><th>Funcionário</th><th>Saída</th><th>Previsão</th>
        <th class="num">Itens</th><th class="num">Pendentes</th><th>Situação</th><th></th></tr></thead>
      <tbody>${l.map(e=>`<tr>
        <td class="mono" style="font-weight:600">${esc(e.codigo)}</td>
        <td>${esc(e.funcionario)}<div class="it-meta">${esc(e.setor||'—')}${e.matricula?' · '+esc(e.matricula):''}</div></td>
        <td class="small">${dth(e.data_saida)}</td>
        <td class="small">${e.atrasado?`<span class="tag zero">${dt(e.previsao_devolucao)}</span>`:dt(e.previsao_devolucao)}</td>
        <td class="num">${e.total_itens}</td>
        <td class="num" style="font-weight:600">${e.pendentes}</td>
        <td><span class="tag ${e.status==='DEVOLVIDO'?'ok':e.status==='BAIXADO'?'':'sea'}">${STATUS_EMP[e.status]}</span>
          ${e.recibo_assinado?'<div class="it-meta">recibo assinado</div>':'<div class="it-meta">aguardando assinatura</div>'}</td>
        <td style="text-align:right"><button class="btn sm" onclick="abrirEmprestimo(${e.id})">Abrir</button></td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="empty"><b>Nada por aqui</b>Nenhum empréstimo nesta situação.</div>';
  };
  $('#view').innerHTML = `
    <div class="tabs">
      ${[['abertos','Em aberto'],['atrasados','Atrasados'],['encerrados','Encerrados'],['todos','Todos']]
        .map(([k,t])=>`<button data-f="${k}" class="${FE===k?'on':''}">${t}
          <span class="mono small">(${filtra(k).length})</span></button>`).join('')}
    </div><div class="card"><div id="empLista"></div></div>`;
  $$('.tabs button').forEach(b=> b.onclick = ()=>{ FE=b.dataset.f;
    $$('.tabs button').forEach(x=>x.classList.toggle('on', x.dataset.f===FE)); render(); });
  render();
}

async function abrirEmprestimo(id){
  const [emp] = await q('almox_vw_emprestimos','*',b=>b.eq('id',id));
  const itens = await q('almox_emprestimo_itens','*, almox_variacoes(sku, tamanho_id, almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('emprestimo_id',id));
  const nomeDe = i => `${i.almox_variacoes.almox_itens.nome} · ${i.almox_variacoes.almox_tamanhos?.rotulo || 'ÚNICO'}`;
  const aberto = ['ABERTO','PARCIAL'].includes(emp.status);
  drawer({titulo:emp.codigo, sub:`${esc(emp.funcionario)} · ${STATUS_EMP[emp.status]}`, corpo:`
    <div class="rec-dados" style="grid-template-columns:1fr 1fr;font-size:12.5px;margin-bottom:18px">
      <div><b>Saída</b>${dth(emp.data_saida)}</div>
      <div><b>Previsão de devolução</b>${dt(emp.previsao_devolucao)}${emp.atrasado?' <span class="tag zero">atrasado</span>':''}</div>
      <div><b>Setor</b>${esc(emp.setor||'—')}</div>
      <div><b>Motivo</b>${esc(emp.motivo||'—')}</div>
    </div>
    ${emp.observacoes?`<p class="small muted">${esc(emp.observacoes)}</p>`:''}
    <div class="lista-itens" style="margin-bottom:18px">
      ${itens.map(i=>`<div class="li"><span class="qt">${i.quantidade}×</span>
        <span class="sp">${esc(nomeDe(i))}</span>
        <span class="small ${i.quantidade_devolvida>=i.quantidade?'':'muted'}">
          ${i.quantidade_devolvida>=i.quantidade?'<span class="tag ok">devolvido</span>':`devolvidos ${i.quantidade_devolvida}/${i.quantidade}`}</span>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="reciboEmprestimo(${id})">Imprimir recibo</button>
      ${aberto && podeOperar()?`<button class="btn pri" onclick="formDevolverEmprestimo(${id})">Registrar devolução</button>`:''}
      ${aberto && ehGestor()?`<button class="btn dan" onclick="formBaixarEmprestimo(${id})">Dar baixa</button>`:''}
      ${!emp.recibo_assinado && podeOperar()?`<button class="btn" onclick="marcarAssinado(${id})">Marcar como assinado</button>`:''}
    </div>`});
}

async function marcarAssinado(id){
  const { error } = await S.sb.from('almox_emprestimos')
    .update({recibo_assinado:true, assinado_em:new Date().toISOString()}).eq('id',id);
  if(error) return erro(error);
  toast('Recibo marcado como assinado.','ok'); $('#drawer').innerHTML=''; render();
}

async function formDevolverEmprestimo(id){
  const itens = await q('almox_emprestimo_itens','*, almox_variacoes(almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('emprestimo_id',id));
  const pend = itens.filter(i=>i.quantidade>i.quantidade_devolvida);
  if(!pend.length) return toast('Não há itens pendentes.','err');
  modal({titulo:'Registrar devolução', corpo:`
    <p class="small muted" style="margin-top:0">Informe quanto está voltando de cada item. As peças retornam ao estoque.</p>
    ${pend.map(i=>`<div class="pick" style="align-items:center">
      <div class="field" style="margin:0"><span>${esc(i.almox_variacoes.almox_itens.nome)} · ${esc(i.almox_variacoes.almox_tamanhos?.rotulo||'ÚNICO')}</span>
        <div class="small muted">pendente: ${i.quantidade-i.quantidade_devolvida}</div></div>
      <label class="field" style="max-width:100px;margin:0"><span>Devolver</span>
        <input class="inp mono" type="number" min="0" max="${i.quantidade-i.quantidade_devolvida}"
               value="${i.quantidade-i.quantidade_devolvida}" data-it="${i.id}"></label>
    </div>`).join('')}
    <label class="field" style="margin-top:10px"><span>Destino das peças <em>*</em></span><select class="inp" id="dDest">
      <option value="1">Peça usada — vai para a lavanderia</option>
      <option value="0">Peça limpa — volta direto ao estoque</option>
    </select></label>
    <label class="field"><span>Observações</span>
      <textarea class="inp" id="dObs" placeholder="Estado das peças devolvidas"></textarea></label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Confirmar devolução',classe:'pri',acao:async(o,f,b)=>{
      const lista = [...o.querySelectorAll('input[data-it]')]
        .map(i=>({emprestimo_item_id:Number(i.dataset.it), quantidade:Number(i.value||0)}))
        .filter(x=>x.quantidade>0);
      if(!lista.length) return toast('Informe ao menos uma quantidade.','err');
      b.disabled=true;
      try{
        const paraLav = o.querySelector('#dDest').value==='1';
        const {error} = await S.sb.rpc('almox_devolver_emprestimo',
          {p_emprestimo_id:id, p_itens:lista, p_observacoes:o.querySelector('#dObs').value||null,
           p_para_lavanderia:paraLav});
        if(error) throw error;
        f(); $('#drawer').innerHTML=''; await depoisDeMovimentar(paraLav
          ? 'Devolução registrada. As peças foram para a fila da lavanderia.'
          : 'Devolução registrada direto no estoque.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

function formBaixarEmprestimo(id){
  modal({titulo:'Dar baixa no empréstimo', corpo:`
    <p style="margin-top:0">O que não voltou passa a contar como entrega definitiva ao funcionário e sai do controle de pendências.</p>
    <label class="field"><span>Motivo <em>*</em></span><input class="inp" id="bMot" placeholder="Ex.: peça extraviada, desconto em folha"></label>`,
    acoes:[{rotulo:'Voltar'},{rotulo:'Dar baixa',classe:'dan',acao:async(o,f,b)=>{
      const mot = o.querySelector('#bMot').value.trim();
      if(!mot) return toast('Informe o motivo.','err');
      b.disabled=true;
      try{ const {error} = await S.sb.rpc('almox_baixar_emprestimo',{p_emprestimo_id:id,p_motivo:mot});
        if(error) throw error; f(); $('#drawer').innerHTML=''; await depoisDeMovimentar('Empréstimo baixado.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

/* --------------------------- RECIBOS --------------------------------- */
function cabecalhoRecibo(titulo, codigo){
  return `<div class="rec-h">
    <div><div class="t">${esc(CONFIG.EMPRESA)}</div>
      <div class="s">${esc(S.unidade?.nome || CONFIG.LOJA)}<br>Almoxarifado de uniformes e EPI</div></div>
    <div><div class="t" style="font-size:14px;text-align:right">${esc(titulo)}</div>
      <div class="rec-cod">${esc(codigo)}</div>
      <div class="s" style="text-align:right">${new Date().toLocaleString('pt-BR')}</div></div></div>`;
}
const TERMO_EMPRESTIMO = `Declaro ter recebido, a título de empréstimo, os itens relacionados acima, em bom estado de conservação e em quantidade conferida por mim. Comprometo-me a utilizá-los exclusivamente no exercício das minhas funções, a zelar pela sua conservação e higiene e a devolvê-los ao almoxarifado até a data prevista de devolução ou imediatamente quando solicitado, bem como no ato do desligamento. Estou ciente de que a perda, o extravio ou o dano por uso indevido poderão ser objeto de reposição ou de desconto, conforme o artigo 462, §1º, da CLT, mediante minha anuência. No caso de equipamentos de proteção individual, declaro ter recebido orientação sobre o uso correto, a guarda e a conservação, nos termos da NR-6.`;
const TERMO_ENTREGA = `Declaro ter recebido do almoxarifado os itens relacionados acima, conferidos por mim quanto a tipo, tamanho e quantidade, em perfeitas condições de uso. Comprometo-me a utilizá-los exclusivamente no exercício das minhas funções, a mantê-los limpos e conservados e a devolvê-los no ato do desligamento ou quando substituídos. Estou ciente de que a perda ou o dano por uso indevido poderá ser objeto de reposição, conforme o artigo 462, §1º, da CLT, mediante minha anuência. No caso de equipamentos de proteção individual, declaro ter recebido orientação sobre uso, guarda e conservação, nos termos da NR-6, e me responsabilizo pelo seu uso durante toda a jornada.`;

function imprimir(html){
  $('#print').innerHTML = html;
  setTimeout(()=>window.print(), 60);
}
function tabelaRecibo(linhas){
  return `<table><thead><tr><th style="width:44px">Qtd</th><th>Item</th><th style="width:90px">Tamanho</th>
    <th style="width:110px">Código</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td class="mono" style="text-align:center">${l.q}</td><td>${esc(l.n)}</td>
      <td style="text-align:center">${esc(l.t)}</td><td class="mono">${esc(l.s||'')}</td></tr>`).join('')}
    </tbody></table>`;
}
function assinaturas(nomeFunc){
  return `<div class="rec-ass">
    <div>${esc(nomeFunc)}<br><span style="font-size:10px;color:#555">Funcionário — assinatura e data</span></div>
    <div>${esc(S.perfil?.nome||'')}<br><span style="font-size:10px;color:#555">Almoxarifado — responsável pela entrega</span></div></div>`;
}

async function reciboEmprestimo(id){
  const [emp] = await q('almox_vw_emprestimos','*',b=>b.eq('id',id));
  const itens = await q('almox_emprestimo_itens','*, almox_variacoes(sku, almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('emprestimo_id',id));
  imprimir(`${cabecalhoRecibo('Recibo de empréstimo', emp.codigo)}
    <div class="rec-dados">
      <div><b>Funcionário</b>${esc(emp.funcionario)}</div>
      <div><b>Matrícula</b>${esc(emp.matricula||'—')}</div>
      <div><b>Cargo</b>${esc(emp.cargo||'—')}</div>
      <div><b>Setor</b>${esc(emp.setor||'—')}</div>
      <div><b>Data da saída</b>${dth(emp.data_saida)}</div>
      <div><b>Devolução prevista</b>${dt(emp.previsao_devolucao)}</div>
      <div style="grid-column:1/-1"><b>Motivo</b>${esc(emp.motivo||'—')}</div>
    </div>
    ${tabelaRecibo(itens.map(i=>({q:i.quantidade, n:i.almox_variacoes.almox_itens.nome,
        t:i.almox_variacoes.almox_tamanhos?.rotulo||'ÚNICO', s:i.almox_variacoes.sku})))}
    <div class="rec-termo"><b>TERMO DE RESPONSABILIDADE</b><br>${TERMO_EMPRESTIMO}</div>
    ${assinaturas(emp.funcionario)}
    <div style="margin-top:26px;border-top:1px dashed #999;padding-top:8px;font-size:10px;color:#555">
      Devolução — preenchimento no retorno das peças: data ____/____/______ &nbsp;&nbsp;
      recebido por ______________________________ &nbsp;&nbsp; observações ____________________________________</div>`);
}
function reciboEntrega({func, just, itens}){
  const f = S.funcionarios.find(x=>x.id===func) || {};
  const linhas = itens.map(x=>{ const v = S.estoque.find(e=>e.variacao_id===x.variacao_id)||{};
    return {q:x.quantidade, n:v.item, t:v.tamanho, s:v.sku}; });
  imprimir(`${cabecalhoRecibo('Comprovante de entrega', 'ENT-'+(S.unidade?.codigo||'VIX')+'-'+hoje().replace(/-/g,'').slice(2))}
    <div class="rec-dados">
      <div><b>Funcionário</b>${esc(f.nome||'')}</div>
      <div><b>Matrícula</b>${esc(f.matricula||'—')}</div>
      <div><b>Cargo</b>${esc(f.cargo||'—')}</div>
      <div><b>Setor</b>${esc(f.setor||'—')}</div>
      <div style="grid-column:1/-1"><b>Motivo da entrega</b>${esc(just)}</div>
    </div>
    ${tabelaRecibo(linhas)}
    <div class="rec-termo"><b>TERMO DE RECEBIMENTO E RESPONSABILIDADE</b><br>${TERMO_ENTREGA}</div>
    ${assinaturas(f.nome||'')}`);
}
</script>
<script>
/* =====================================================================
   INVENTARIO
   ===================================================================== */
async function viewInventario(){
  const abertos = await q('almox_inventarios','*',b=>b.eq('status','ABERTO'));
  if(abertos.length) return telaContagem(abertos[0]);

  const hist = await q('almox_inventarios','*',b=>b.order('iniciado_em',{ascending:false}).limit(30));
  $('#topAcoes').innerHTML = podeOperar() ? `<button class="btn pri" onclick="formAbrirInventario()">Abrir contagem</button>` : '';
  $('#view').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-b">
      <b>Nenhuma contagem em andamento.</b>
      <p class="small muted" style="margin:6px 0 0">Abra uma contagem por categoria — camisas numa semana, calçados na outra —
      lance o que foi contado na prateleira e finalize. O sistema gera sozinho os ajustes de entrada e saída,
      com o inventário registrado como justificativa.</p>
    </div></div>
    <div class="card"><div class="card-h"><h3>Contagens anteriores</h3></div>
    ${hist.length?`<div class="tbl-wrap"><table>
      <thead><tr><th>Código</th><th>Escopo</th><th>Início</th><th>Fim</th><th>Situação</th><th></th></tr></thead>
      <tbody>${hist.map(i=>`<tr>
        <td class="mono">${esc(i.codigo)}</td>
        <td>${esc(i.categoria_id? nomeCat(i.categoria_id) : 'Todas as categorias')}
          ${i.descricao?`<div class="it-meta">${esc(i.descricao)}</div>`:''}</td>
        <td class="small">${dth(i.iniciado_em)}</td><td class="small">${dth(i.finalizado_em)}</td>
        <td><span class="tag ${i.status==='FINALIZADO'?'ok':''}">${i.status}</span></td>
        <td style="text-align:right"><button class="btn sm" onclick="verInventario(${i.id})">Ver</button></td>
      </tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma contagem registrada.</div>'}</div>`;
}
function formAbrirInventario(){
  modal({titulo:'Abrir contagem de inventário', corpo:`
    <label class="field"><span>Escopo</span><select class="inp" id="iCat">
      <option value="">Todas as categorias</option>
      ${S.categorias.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}
    </select></label>
    <label class="field"><span>Descrição</span><input class="inp" id="iDesc" placeholder="Ex.: contagem de segunda-feira"></label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Abrir contagem',classe:'pri',acao:async(o,f,b)=>{
      b.disabled=true;
      try{ const {error} = await S.sb.rpc('almox_abrir_inventario',{
          p_categoria_id: o.querySelector('#iCat').value || null,
          p_descricao: o.querySelector('#iDesc').value || null,
          p_unidade_id: S.unidade?.id ?? null });
        if(error) throw error; f(); toast('Contagem aberta.','ok'); render();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
async function telaContagem(inv){
  const itens = await q('almox_inventario_itens','*, almox_variacoes(id, sku, saldo, tamanho_id, item_id)',
                        b=>b.eq('inventario_id',inv.id));
  const enriquecido = itens.map(i=>{
    const e = S.estoque.find(x=>x.variacao_id===i.variacao_id) || {};
    return {...i, item:e.item||'?', tamanho:e.tamanho||'—', categoria:e.categoria||'—', saldo_atual:e.saldo??0};
  }).sort((a,b)=> a.item.localeCompare(b.item) || String(a.tamanho).localeCompare(String(b.tamanho)));

  const contados = enriquecido.filter(i=>i.saldo_contado!==null).length;
  $('#topAcoes').innerHTML = `
    <span class="tag sea mono">${esc(inv.codigo)}</span>
    <button class="btn" onclick="cancelarInventario(${inv.id})">Cancelar contagem</button>
    <button class="btn pri" onclick="revisarInventario(${inv.id})">Revisar e finalizar</button>`;
  $('#view').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-b" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
      <div><div class="l mono small muted">ESCOPO</div><b>${esc(inv.categoria_id? nomeCat(inv.categoria_id):'Todas as categorias')}</b></div>
      <div><div class="l mono small muted">ABERTA EM</div><b>${dth(inv.iniciado_em)}</b></div>
      <div><div class="l mono small muted">PROGRESSO</div><b id="progCont">${contados} de ${enriquecido.length} contados</b></div>
      <div class="sp" style="flex:1"></div>
      <input class="inp" style="width:220px" id="invBusca" placeholder="Buscar item…">
    </div></div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Item</th><th>Tamanho</th><th class="num">Sistema</th><th class="num">Contado</th><th class="num">Diferença</th></tr></thead>
      <tbody id="invBody">${enriquecido.map(i=>linhaContagem(i)).join('')}</tbody>
    </table></div></div>`;
  $('#invBusca').oninput = e=>{
    const t = e.target.value.toLowerCase();
    $$('#invBody tr').forEach(tr=> tr.style.display = tr.dataset.busca.includes(t)?'':'none');
  };
  $$('#invBody input').forEach(inp=> inp.onchange = ()=>salvarContagem(inp));
}
function linhaContagem(i){
  const dif = i.saldo_contado===null? null : i.saldo_contado - i.saldo_atual;
  return `<tr data-busca="${esc((i.item+' '+i.tamanho+' '+i.categoria).toLowerCase())}">
    <td><div class="it-nome">${esc(i.item)}</div><div class="it-meta">${esc(i.categoria)}</div></td>
    <td>${esc(i.tamanho)}</td>
    <td class="num muted">${i.saldo_atual}</td>
    <td class="num"><input class="inp mono" style="width:80px;text-align:right" type="number" min="0"
        value="${i.saldo_contado ?? ''}" data-id="${i.id}" data-sist="${i.saldo_atual}" placeholder="—"></td>
    <td class="num" data-dif>${dif===null?'' : `<span class="tag ${dif===0?'ok':dif>0?'sea':'zero'}">${dif>0?'+':''}${dif}</span>`}</td>
  </tr>`;
}
async function salvarContagem(inp){
  const v = inp.value===''? null : Number(inp.value);
  const { error } = await S.sb.from('almox_inventario_itens').update({saldo_contado:v}).eq('id',Number(inp.dataset.id));
  if(error) return erro(error);
  const dif = v===null? null : v - Number(inp.dataset.sist);
  inp.closest('tr').querySelector('[data-dif]').innerHTML =
    dif===null?'':`<span class="tag ${dif===0?'ok':dif>0?'sea':'zero'}">${dif>0?'+':''}${dif}</span>`;
  const total = $$('#invBody input').length, feitos = $$('#invBody input').filter(i=>i.value!=='').length;
  $('#progCont').textContent = `${feitos} de ${total} contados`;
}
async function revisarInventario(id){
  const itens = await q('almox_inventario_itens','*',b=>b.eq('inventario_id',id).not('saldo_contado','is',null));
  const difs = itens.map(i=>{ const e=S.estoque.find(x=>x.variacao_id===i.variacao_id)||{};
      return {...i, item:e.item, tamanho:e.tamanho, atual:e.saldo??0, dif:i.saldo_contado-(e.saldo??0)}; })
    .filter(i=>i.dif!==0);
  modal({titulo:'Finalizar inventário', wide:true, corpo:`
    <p style="margin-top:0">${itens.length} item(ns) contados. ${difs.length? difs.length+' divergência(s) gerarão ajuste automático:' : 'Nenhuma divergência — nada será ajustado.'}</p>
    ${difs.length?`<div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Tamanho</th>
      <th class="num">Sistema</th><th class="num">Contado</th><th class="num">Ajuste</th></tr></thead><tbody>
      ${difs.map(d=>`<tr><td>${esc(d.item)}</td><td>${esc(d.tamanho)}</td>
        <td class="num">${d.atual}</td><td class="num">${d.saldo_contado}</td>
        <td class="num"><span class="tag ${d.dif>0?'sea':'zero'}">${d.dif>0?'+':''}${d.dif}</span></td></tr>`).join('')}
      </tbody></table></div>`:''}
    <p class="small muted">Itens sem contagem lançada permanecem com o saldo atual.</p>`,
    acoes:[{rotulo:'Voltar'},{rotulo:'Finalizar e ajustar',classe:'pri',acao:async(o,f,b)=>{
      b.disabled=true;
      try{ const {error} = await S.sb.rpc('almox_finalizar_inventario',{p_inventario_id:id});
        if(error) throw error; f(); await depoisDeMovimentar('Inventário finalizado.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
function cancelarInventario(id){
  confirmar('Cancelar contagem','As contagens lançadas serão descartadas e nenhum ajuste será feito.',
    async()=>{ const {error} = await S.sb.from('almox_inventarios').update({status:'CANCELADO',finalizado_em:new Date().toISOString()}).eq('id',id);
      if(error) throw error; toast('Contagem cancelada.','ok'); render(); }, 'Cancelar contagem');
}
async function verInventario(id){
  const [inv] = await q('almox_inventarios','*',b=>b.eq('id',id));
  const itens = await q('almox_inventario_itens','*',b=>b.eq('inventario_id',id).not('saldo_contado','is',null));
  const linhas = itens.map(i=>{ const e=S.estoque.find(x=>x.variacao_id===i.variacao_id)||{};
    return {item:e.item||'?', tam:e.tamanho||'—', sis:i.saldo_sistema, cont:i.saldo_contado, dif:i.saldo_contado-i.saldo_sistema}; });
  drawer({titulo:inv.codigo, sub:`${esc(inv.categoria_id?nomeCat(inv.categoria_id):'Todas as categorias')} · ${inv.status}`,
    corpo: linhas.length?`<div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Tam</th>
      <th class="num">Sist.</th><th class="num">Cont.</th><th class="num">Dif.</th></tr></thead><tbody>
      ${linhas.map(l=>`<tr><td>${esc(l.item)}</td><td>${esc(l.tam)}</td><td class="num">${l.sis}</td>
        <td class="num">${l.cont}</td><td class="num">${l.dif?`<span class="tag ${l.dif>0?'sea':'zero'}">${l.dif>0?'+':''}${l.dif}</span>`:'—'}</td></tr>`).join('')}
      </tbody></table></div>`:'<div class="empty">Sem contagens lançadas.</div>'});
}

/* =====================================================================
   FUNCIONARIOS
   ===================================================================== */
let buscaFunc = '';
async function viewFuncionarios(){
  $('#topAcoes').innerHTML = `
    <input class="inp" style="width:220px" placeholder="Buscar…" value="${esc(buscaFunc)}"
      oninput="buscaFunc=this.value;listarFuncionarios()">
    ${ehGestor()?`<button class="btn pri" onclick="formFuncionario()">Novo funcionário</button>`:''}`;
  $('#view').innerHTML = `<div class="card"><div id="funcLista"></div></div>`;
  await listarFuncionarios();
}
async function listarFuncionarios(){
  const posse = await q('almox_vw_posse','funcionario_id,quantidade');
  const porFunc = {}; posse.forEach(p=> porFunc[p.funcionario_id] = (porFunc[p.funcionario_id]||0)+p.quantidade);
  const t = buscaFunc.trim().toLowerCase();
  const lista = S.funcionarios.filter(f=> !t || (f.nome+' '+(f.setor||'')+' '+(f.matricula||'')).toLowerCase().includes(t));
  $('#funcLista').innerHTML = lista.length? `
    <div class="card-h"><h3>${lista.length} funcionários</h3><div class="sp"></div>
      <span class="small muted">${S.funcionarios.filter(f=>f.ativo).length} ativos</span></div>
    <div class="tbl-wrap"><table>
    <thead><tr><th>Nome</th><th>Matrícula</th><th>Cargo</th><th>Setor</th><th class="num">Peças em posse</th><th></th></tr></thead>
    <tbody>${lista.map(f=>`<tr style="cursor:pointer" onclick="fichaFuncionario(${f.id})">
      <td><div class="it-nome">${esc(f.nome)}</div>${f.ativo?'':'<span class="tag">inativo</span>'}</td>
      <td class="mono small">${esc(f.matricula||'—')}</td><td class="small">${esc(f.cargo||'—')}</td>
      <td class="small">${esc(f.setor||'—')}</td>
      <td class="num" style="font-weight:600">${porFunc[f.id]||0}</td>
      <td style="text-align:right"><button class="btn sm">Ficha</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty"><b>Nenhum funcionário</b>Cadastre a equipe para começar a registrar entregas.</div>';
}
async function fichaFuncionario(id){
  const f = S.funcionarios.find(x=>x.id===id);
  const [posse, emps, hist, dota] = await Promise.all([
    q('almox_vw_posse','*',b=>b.eq('funcionario_id',id)),
    q('almox_vw_emprestimos','*',b=>b.eq('funcionario_id',id).order('data_saida',{ascending:false}).limit(20)),
    q('almox_vw_movimentacoes','*',b=>b.eq('funcionario_id',id).order('data',{ascending:false}).limit(40)),
    q('almox_vw_dotacao','*',b=>b.eq('funcionario_id',id))
  ]);
  drawer({titulo:f.nome, sub:`${esc(f.cargo||'—')} · ${esc(f.setor||'—')}${f.matricula?' · '+esc(f.matricula):''}`, corpo:`
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">
      ${podeOperar()?`<button class="btn sm pri" onclick="formSaidaFuncionario(null,${id})">Entregar peça</button>
      <button class="btn sm" onclick="formEmprestimo(null,${id})">Emprestar</button>`:''}
      ${ehGestor()?`<button class="btn sm" onclick="formFuncionario(${id})">Editar cadastro</button>`:''}
    </div>
    ${dota.length?`<h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Dotação</h4>
    <div class="lista-itens" style="margin-bottom:20px">${dota.map(d=>`
      <div class="li"><span class="sp">${esc(d.grupo)}</span>
        <span class="mono small muted">${d.em_posse} de ${d.quantidade_minima}${d.emprestado?` · ${d.emprestado} emprestada(s)`:''}</span>
        <span class="tag ${d.falta?'zero':'ok'}">${d.falta? 'faltam '+d.falta : 'completo'}</span></div>`).join('')}</div>`:''}
    <h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Em posse hoje</h4>
    ${posse.length?`<div class="lista-itens" style="margin-bottom:20px">${posse.map(p=>`
      <div class="li"><span class="qt">${p.quantidade}×</span><span class="sp">${esc(p.item)} · ${esc(p.tamanho)}</span>
      <span class="small muted">desde ${dt(p.ultima_entrega)}</span></div>`).join('')}</div>`
      : '<p class="small muted" style="margin-bottom:20px">Nenhuma peça entregue em definitivo.</p>'}
    <h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Empréstimos</h4>
    ${emps.length?`<div class="lista-itens" style="margin-bottom:20px">${emps.map(e=>`
      <div class="li"><span class="mono">${esc(e.codigo)}</span><span class="sp small muted">${dt(e.data_saida)}</span>
      <span class="tag ${e.atrasado?'zero':e.status==='DEVOLVIDO'?'ok':'sea'}">${STATUS_EMP[e.status]}</span>
      <button class="btn sm" onclick="abrirEmprestimo(${e.id})">Ver</button></div>`).join('')}</div>`
      : '<p class="small muted" style="margin-bottom:20px">Nenhum empréstimo.</p>'}
    <h4 class="mono small muted" style="text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Histórico</h4>
    ${hist.length?`<div class="tbl-wrap"><table><tbody>${hist.map(m=>`
      <tr${m.cancelada?' style="opacity:.45"':''}><td class="small muted" style="width:86px">${dth(m.data)}</td>
      <td><span class="tag ${m.e_entrada?'in':'out'}">${m.e_entrada?'+':'−'}${m.quantidade}</span>
        <div class="it-meta">${esc(m.item)} ${esc(m.tamanho)} — ${esc(m.justificativa||'')}</div></td></tr>`).join('')}
      </tbody></table></div>`:'<p class="small muted">Sem movimentações.</p>'}`});
}
function formFuncionario(id=null){
  if(!exigeGestor()) return;
  const f = id? S.funcionarios.find(x=>x.id===id) : {};
  modal({titulo: id?'Editar funcionário':'Novo funcionário', corpo:`
    <label class="field"><span>Nome completo <em>*</em></span><input class="inp" id="nNome" value="${esc(f.nome||'')}"></label>
    <div class="row">
      <label class="field"><span>Matrícula</span><input class="inp" id="nMat" value="${esc(f.matricula||'')}"></label>
      <label class="field"><span>CPF</span><input class="inp" id="nCpf" value="${esc(f.cpf||'')}"></label>
      <label class="field"><span>Cargo</span><input class="inp" id="nCargo" value="${esc(f.cargo||'')}"></label>
      <label class="field"><span>Setor</span><input class="inp" id="nSetor" list="setores" value="${esc(f.setor||'')}">
        <datalist id="setores">${[...new Set(S.funcionarios.map(x=>x.setor).filter(Boolean))]
          .map(s=>`<option>${esc(s)}</option>`).join('')}</datalist></label>
      <label class="field"><span>Admissão</span><input class="inp" id="nAdm" type="date" value="${f.data_admissao||''}"></label>
    </div>
    <label class="field"><span>Observações</span><textarea class="inp" id="nObs">${esc(f.observacoes||'')}</textarea></label>
    <label class="check"><input type="checkbox" id="nAtivo" ${f.ativo!==false?'checked':''}> Funcionário ativo</label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Salvar',classe:'pri',acao:async(o,fe,b)=>{
      const nome = o.querySelector('#nNome').value.trim();
      if(!nome) return toast('Informe o nome.','err');
      b.disabled=true;
      const reg = {nome, matricula:o.querySelector('#nMat').value.trim()||null, cpf:o.querySelector('#nCpf').value.trim()||null,
        cargo:o.querySelector('#nCargo').value.trim()||null, setor:o.querySelector('#nSetor').value.trim()||null,
        data_admissao:o.querySelector('#nAdm').value||null, observacoes:o.querySelector('#nObs').value||null,
        ativo:o.querySelector('#nAtivo').checked, unidade_id:S.unidade?.id??null};
      try{
        const { error } = id ? await S.sb.from('almox_funcionarios').update(reg).eq('id',id)
                             : await S.sb.from('almox_funcionarios').insert(reg);
        if(error) throw error;
        fe(); $('#drawer').innerHTML=''; await carregarBase(); toast('Cadastro salvo.','ok'); render();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
</script>
<script>
/* =====================================================================
   CADASTROS — itens, categorias, grades/tamanhos, fornecedores, usuários
   ===================================================================== */
let abaCad = 'itens';
async function viewCadastros(){
  const abas = [['itens','Itens'],['grades','Grades e tamanhos'],['categorias','Categorias'],
                ['regras','Regras de dotação'],['fornecedores','Fornecedores'],['usuarios','Usuários e acessos']];
  $('#view').innerHTML = `<div class="tabs">${abas.map(([k,t])=>
      `<button data-a="${k}" class="${abaCad===k?'on':''}">${t}</button>`).join('')}</div>
    <div id="cadArea"></div>`;
  $$('.tabs button').forEach(b=> b.onclick = ()=>{ abaCad=b.dataset.a;
    $$('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.a===abaCad)); pintarCadastro(); });
  pintarCadastro();
}
function pintarCadastro(){
  ({itens:cadItens, grades:cadGrades, categorias:cadCategorias, regras:cadRegras,
    fornecedores:cadFornecedores, usuarios:cadUsuarios})[abaCad]();
}

/* --- itens ---------------------------------------------------------- */
function cadItens(){
  $('#topAcoes').innerHTML = ehGestor()? `<button class="btn pri" onclick="formItem()">Novo item</button>`:'';
  const saldos = {}; S.estoque.forEach(e=> saldos[e.item_id]=(saldos[e.item_id]||0)+e.saldo);
  $('#cadArea').innerHTML = `<div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Item</th><th>Categoria</th><th>Grade</th><th>Dotação</th><th class="num">Mínimo</th>
      <th class="num">Custo ref.</th><th class="num">Saldo</th><th>Marcações</th><th></th></tr></thead>
    <tbody>${S.itens.map(i=>`<tr${i.ativo?'':' style="opacity:.5"'}>
      <td><div class="it-nome">${esc(i.nome)}</div><div class="it-meta">${esc(i.codigo||'')}${i.cor?' · '+esc(i.cor):''}</div></td>
      <td class="small">${esc(nomeCat(i.categoria_id))}</td>
      <td class="small">${esc(S.grades.find(g=>g.id===i.grade_id)?.nome||'—')}</td>
      <td class="small">${i.grupo_dotacao?`<span class="tag sea">${esc(i.grupo_dotacao)}</span>`:'—'}</td>

        placeholder="Ex.: CAMISA (COM LOGO) VERDE"></label>

      </select></label>
      <label class="field"><span>Grade de tamanhos <em>*</em></span><select class="inp" id="iGrade">

      </select></label>
      <label class="field"><span>Cor</span><input class="inp" id="iCor" value="${esc(i.cor||'')}"></label>
    </div>
    <div class="row-3">

        min="0" step="0.01" value="${i.custo_referencia??0}"></label>
      <label class="field"><span>Vida útil (meses)</span><input class="inp mono" id="iVida" type="number" min="0"
        value="${i.vida_util_meses??''}"></label>
    </div>
    <label class="field"><span>Grupo de dotação</span>
      <input class="inp" id="iGrupo" list="gruposDot" value="${esc(i.grupo_dotacao||'')}"
        placeholder="Ex.: Camisa, Calça/Bermuda — deixe vazio se não conta para a dotação mínima">
      <datalist id="gruposDot">${[...new Set([...S.dotacoes.map(d=>d.grupo), ...S.itens.map(x=>x.grupo_dotacao)])]
        .filter(Boolean).map(g=>`<option>${esc(g)}</option>`).join('')}</datalist></label>
    <div class="row">
      <label class="check"><input type="checkbox" id="iEpi" ${i.epi?'checked':''}> É EPI</label>
      <label class="field ${i.epi?'':'hide'}" id="iCaBox"><span>Nº do CA</span>
        <input class="inp mono" id="iCa" value="${esc(i.ca_epi||'')}"></label>
    </div>
    <label class="check"><input type="checkbox" id="iDev" ${i.exige_devolucao?'checked':''}> Exige devolução ao desligamento</label>
    <label class="check"><input type="checkbox" id="iAtivo" ${i.ativo!==false?'checked':''}> Item ativo</label>
    <p class="small muted">Ao salvar, o sistema cria automaticamente uma posição de estoque para cada tamanho da grade escolhida.</p>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Salvar item',classe:'pri',acao:async(o,f,b)=>{
      const nome = o.querySelector('#iNome').value.trim();
      if(!nome) return toast('Informe o nome do item.','err');
      b.disabled=true;
      const reg = {nome, codigo:o.querySelector('#iCod').value.trim()||null,
        categoria_id:Number(o.querySelector('#iCat').value)||null, grade_id:Number(o.querySelector('#iGrade').value),
        cor:o.querySelector('#iCor').value.trim()||null, estoque_minimo:Number(o.querySelector('#iMin').value||0),
        custo_referencia:Number(o.querySelector('#iCusto').value||0),
        vida_util_meses:o.querySelector('#iVida').value? Number(o.querySelector('#iVida').value):null,
        grupo_dotacao:o.querySelector('#iGrupo').value.trim()||null,
        epi:o.querySelector('#iEpi').checked, ca_epi:o.querySelector('#iCa').value.trim()||null,
        exige_devolucao:o.querySelector('#iDev').checked, ativo:o.querySelector('#iAtivo').checked,
        atualizado_em:new Date().toISOString()};
      try{
        let itemId = id;
        if(id){ const {error} = await S.sb.from('almox_itens').update(reg).eq('id',id); if(error) throw error; }
        else { const {data,error} = await S.sb.from('almox_itens').insert(reg).select().single();
               if(error) throw error; itemId = data.id; }
        await sincronizarVariacoes(itemId, reg.grade_id);
        f(); await carregarBase(); await carregarEstoque(); montarNav(); toast('Item salvo.','ok'); pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]
    ,aoAbrir:o=>{ o.querySelector('#iEpi').onchange = e=>
        o.querySelector('#iCaBox').classList.toggle('hide', !e.target.checked); }});
}
async function sincronizarVariacoes(itemId, gradeId){
  const tams = tamanhosDaGrade(gradeId);
  const exist = await q('almox_variacoes','tamanho_id',b=>b.eq('item_id',itemId));
  const ja = new Set(exist.map(e=>e.tamanho_id));
  const novos = tams.filter(t=>!ja.has(t.id)).map(t=>({item_id:itemId, tamanho_id:t.id}));
  if(novos.length){ const {error} = await S.sb.from('almox_variacoes').insert(novos); if(error) throw error; }
}

function cadGrades(){
  $('#topAcoes').innerHTML = ehGestor()? `<button class="btn pri" onclick="formGrade()">Nova grade</button>`:'';

      const tams = S.tamanhos.filter(t=>t.grade_id===g.id).sort((a,b)=>a.ordem-b.ordem);

      return `<div class="card"><div class="card-h"><h3>${esc(g.nome)}</h3><div class="sp"></div>

          </div></div></div>`;
    }).join('')}</div>`;
}
function formGrade(id=null){
  if(!exigeGestor()) return;
  const g = id? S.grades.find(x=>x.id===id):{};
  modal({titulo:id?'Editar grade':'Nova grade de tamanhos', corpo:`
    <label class="field"><span>Nome <em>*</em></span><input class="inp" id="gNome" value="${esc(g.nome||'')}"
      placeholder="Ex.: Numérico calçado infantil"></label>
    <label class="field"><span>Descrição</span><input class="inp" id="gDesc" value="${esc(g.descricao||'')}"></label>
    ${id?'':`<label class="field"><span>Tamanhos (separados por vírgula)</span>
      <input class="inp mono" id="gTams" placeholder="PP, P, M, G, GG"></label>`}`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Salvar',classe:'pri',acao:async(o,f,b)=>{
      const nome=o.querySelector('#gNome').value.trim(); if(!nome) return toast('Informe o nome.','err');
      b.disabled=true;
      try{
        const reg={nome, descricao:o.querySelector('#gDesc').value.trim()||null};
        if(id){ const {error}=await S.sb.from('almox_grades').update(reg).eq('id',id); if(error) throw error; }
        else{
          const {data,error}=await S.sb.from('almox_grades').insert(reg).select().single(); if(error) throw error;
          const lista=(o.querySelector('#gTams').value||'').split(',').map(s=>s.trim()).filter(Boolean);
          if(lista.length){ const {error:e2}=await S.sb.from('almox_tamanhos')
              .insert(lista.map((r,ix)=>({grade_id:data.id, rotulo:r, ordem:ix+1}))); if(e2) throw e2; }
        }
        f(); await carregarBase(); toast('Grade salva.','ok'); pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
function formTamanho(gradeId){
  if(!exigeGestor()) return;
  const ord = Math.max(0,...S.tamanhos.filter(t=>t.grade_id===gradeId).map(t=>t.ordem))+1;
  modal({titulo:'Novo tamanho', corpo:`
    <div class="row">
      <label class="field"><span>Rótulo <em>*</em></span><input class="inp mono" id="tRot" placeholder="Ex.: 52 ou XGG"></label>
      <label class="field"><span>Ordem na régua</span><input class="inp mono" id="tOrd" type="number" value="${ord}"></label>
    </div>
    <p class="small muted">O tamanho será criado para todos os itens que usam esta grade, com saldo zero.</p>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Adicionar',classe:'pri',acao:async(o,f,b)=>{
      const rot=o.querySelector('#tRot').value.trim(); if(!rot) return toast('Informe o rótulo.','err');
      b.disabled=true;
      try{
        const {error}=await S.sb.from('almox_tamanhos').insert(
          {grade_id:gradeId, rotulo:rot, ordem:Number(o.querySelector('#tOrd').value||ord)});
        if(error) throw error;
        await carregarBase();
        for(const it of S.itens.filter(i=>i.grade_id===gradeId)) await sincronizarVariacoes(it.id, gradeId);
        f(); await carregarEstoque(); toast('Tamanho adicionado.','ok'); pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
function removerTamanho(id){
  if(!exigeGestor()) return;
  const t = S.tamanhos.find(x=>x.id===id);
  const comSaldo = S.estoque.filter(e=>e.tamanho_id===id && e.saldo>0);
  confirmar('Remover tamanho',
    comSaldo.length? `Existem ${comSaldo.length} posições com saldo neste tamanho. Ele será apenas desativado e sairá da grade, preservando o histórico.`
                   : `O tamanho <b>${esc(t.rotulo)}</b> sairá da grade. Posições sem movimentação são apagadas; as demais ficam desativadas.`,
    async()=>{
      const { error } = await S.sb.from('almox_tamanhos').update({ativo:false}).eq('id',id);
      if(error) throw error;
      await S.sb.from('almox_variacoes').update({ativo:false}).eq('tamanho_id',id);
      await carregarBase(); await carregarEstoque(); montarNav(); toast('Tamanho removido da grade.','ok'); pintarCadastro();
    },'Remover');
}

        <td class="mono" style="font-weight:600">${esc(r.codigo)}</td>
        <td class="small">${esc(r.lavanderia||'—')}${r.custo?`<div class="it-meta">${brl(r.custo)}</div>`:''}</td>
        <td class="small">${dt(r.data_envio)}${r.demorada?'<div class="it-meta" style="color:var(--red)">há mais de 10 dias</div>':''}</td>
        <td class="num">${r.total_pecas}</td>
        <td class="num" style="font-weight:600">${r.pendentes}</td>
        <td><span class="tag ${r.status==='RECEBIDA'?'ok':r.demorada?'zero':'sea'}">${STATUS_REM[r.status]}</span>
          ${r.condenadas?`<div class="it-meta">${r.condenadas} condenada(s)</div>`:''}</td>
        <td style="text-align:right">${r.status==='ENVIADA'&&podeOperar()
          ? `<button class="btn sm pri" onclick="formReceberLavanderia(${r.id})">Receber</button>`
          : `<button class="btn sm" onclick="verRemessa(${r.id})">Ver</button>`}</td>
      </tr>`).join('')}</tbody></table></div>`
      : '<div class="empty"><b>Nenhuma remessa</b>Peças sujas viram remessa quando você as envia para lavar.</div>';
  };
  $$('.tabs button[data-l]').forEach(b=> b.onclick = ()=>{ FL=b.dataset.l;
    $$('.tabs button[data-l]').forEach(x=>x.classList.toggle('on',x.dataset.l===FL)); pintar(); });
  pintar();
}

function formEnviarLavanderia(){
  if(!podeOperar()) return toast('Sem permissão.','err');
  const disp = S.lavanderia.filter(l=>l.aguardando_envio>0);
  if(!disp.length) return toast('Não há peças aguardando envio.','err');
  modal({titulo:'Enviar remessa para a lavanderia', wide:true, corpo:`
    <div class="row">
      <label class="field"><span>Lavanderia</span><select class="inp" id="rFor">
        <option value="">Não informada</option>
        ${S.fornecedores.filter(f=>f.ativo).map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('')}
      </select></label>
      <label class="field"><span>Observações</span><input class="inp" id="rObs" placeholder="Ex.: retirada de sexta"></label>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button type="button" class="btn sm" id="rTudo">Selecionar tudo</button>
      <button type="button" class="btn sm" id="rNada">Limpar</button></div>
    <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:6px"><table>
      <thead><tr><th>Peça</th><th class="num">Aguardando</th><th class="num">Enviar</th></tr></thead>
      <tbody>${disp.map(l=>`<tr>
        <td><div class="it-nome">${esc(l.item)}</div><div class="it-meta">${esc(l.tamanho)}</div></td>
        <td class="num muted">${l.aguardando_envio}</td>
        <td class="num"><input class="inp mono" style="width:80px;text-align:right" type="number" min="0"
          max="${l.aguardando_envio}" value="${l.aguardando_envio}" data-v="${l.variacao_id}"></td>
      </tr>`).join('')}</tbody></table></div>`,
    aoAbrir:o=>{
      o.querySelector('#rTudo').onclick = ()=> o.querySelectorAll('input[data-v]').forEach(i=>i.value=i.max);
      o.querySelector('#rNada').onclick = ()=> o.querySelectorAll('input[data-v]').forEach(i=>i.value=0);
    },
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar envio',classe:'pri',acao:async(o,f,b)=>{
      const itens = [...o.querySelectorAll('input[data-v]')]
        .map(i=>({variacao_id:Number(i.dataset.v), quantidade:Number(i.value||0)}))
        .filter(x=>x.quantidade>0);
      if(!itens.length) return toast('Informe ao menos uma quantidade.','err');
      b.disabled=true;
      try{
        const {data,error} = await S.sb.rpc('almox_enviar_lavanderia',{
          p_itens:itens, p_fornecedor_id:o.querySelector('#rFor').value||null,
          p_observacoes:o.querySelector('#rObs').value||null, p_unidade_id:S.unidade?.id??null});
        if(error) throw error;
        f(); await depoisDeMovimentar('Remessa '+data.codigo+' registrada.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

async function formReceberLavanderia(id){
  const [rem] = await q('almox_vw_remessas','*',b=>b.eq('id',id));
  const itens = await q('almox_remessa_itens','*, almox_variacoes(almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('remessa_id',id));
  const pend = itens.filter(i=>i.quantidade > i.quantidade_retornada + i.quantidade_condenada);
  if(!pend.length) return toast('Remessa já totalmente baixada.','err');
  const nome = i => `${i.almox_variacoes.almox_itens.nome} · ${i.almox_variacoes.almox_tamanhos?.rotulo||'ÚNICO'}`;
  modal({titulo:'Receber remessa '+rem.codigo, wide:true, corpo:`
    <p class="small muted" style="margin-top:0">O que voltou limpo entra no estoque disponível. O que a lavanderia
    condenou sai de vez, com a baixa registrada.</p>
    <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:6px;margin-bottom:14px"><table>
      <thead><tr><th>Peça</th><th class="num">Pendente</th><th class="num">Voltou limpa</th><th class="num">Condenada</th></tr></thead>
      <tbody>${pend.map(i=>{ const p = i.quantidade - i.quantidade_retornada - i.quantidade_condenada;
        return `<tr><td>${esc(nome(i))}</td><td class="num muted">${p}</td>
        <td class="num"><input class="inp mono" style="width:74px;text-align:right" type="number" min="0" max="${p}"
          value="${p}" data-ret="${i.id}"></td>
        <td class="num"><input class="inp mono" style="width:74px;text-align:right" type="number" min="0" max="${p}"
          value="0" data-con="${i.id}"></td></tr>`; }).join('')}</tbody></table></div>
    <div class="row">
      <label class="field"><span>Custo da lavagem (R$)</span><input class="inp mono" id="rCusto" type="number"
        min="0" step="0.01" value="${rem.custo??''}"></label>
      <label class="field"><span>Observações</span><input class="inp" id="rObs2" value="${esc(rem.observacoes||'')}"></label>
    </div>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Registrar retorno',classe:'pri',acao:async(o,f,b)=>{
      const mapa = {};
      o.querySelectorAll('input[data-ret]').forEach(i=> mapa[i.dataset.ret] = {remessa_item_id:Number(i.dataset.ret),
        retornadas:Number(i.value||0), condenadas:0});
      o.querySelectorAll('input[data-con]').forEach(i=> mapa[i.dataset.con].condenadas = Number(i.value||0));
      const lista = Object.values(mapa).filter(x=>x.retornadas>0||x.condenadas>0);
      if(!lista.length) return toast('Informe ao menos uma quantidade.','err');
      b.disabled=true;
      try{
        const {error} = await S.sb.rpc('almox_receber_lavanderia',{
          p_remessa_id:id, p_itens:lista,
          p_custo:o.querySelector('#rCusto').value? Number(o.querySelector('#rCusto').value):null,
          p_observacoes:o.querySelector('#rObs2').value||null});
        if(error) throw error;
        f(); await depoisDeMovimentar('Retorno registrado. Peças limpas de volta ao estoque.');
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}

async function verRemessa(id){
  const [rem] = await q('almox_vw_remessas','*',b=>b.eq('id',id));
  const itens = await q('almox_remessa_itens','*, almox_variacoes(almox_itens(nome), almox_tamanhos(rotulo))',
                        b=>b.eq('remessa_id',id));
  drawer({titulo:rem.codigo, sub:`${esc(rem.lavanderia||'sem lavanderia informada')} · ${STATUS_REM[rem.status]}`, corpo:`
    <div class="rec-dados" style="grid-template-columns:1fr 1fr;font-size:12.5px;margin-bottom:18px">
      <div><b>Envio</b>${dth(rem.data_envio)}</div>
      <div><b>Retorno</b>${dth(rem.data_retorno)}</div>
      <div><b>Custo</b>${rem.custo?brl(rem.custo):'—'}</div>
      <div><b>Peças</b>${rem.total_pecas}</div>
    </div>
    ${rem.observacoes?`<p class="small muted">${esc(rem.observacoes)}</p>`:''}
    <div class="lista-itens">${itens.map(i=>`<div class="li">
      <span class="qt">${i.quantidade}×</span>
      <span class="sp">${esc(i.almox_variacoes.almox_itens.nome)} · ${esc(i.almox_variacoes.almox_tamanhos?.rotulo||'ÚNICO')}</span>
      <span class="tag ok">${i.quantidade_retornada} limpa(s)</span>
      ${i.quantidade_condenada?`<span class="tag zero">${i.quantidade_condenada} condenada(s)</span>`:''}
    </div>`).join('')}</div>`});
}

/* =====================================================================
   DOTAÇÃO — quem tem menos peças do que deveria
   ===================================================================== */
let FD = 'faltando', buscaDot = '';
async function viewDotacao(){
  const dados = await q('almox_vw_dotacao','*',b=>b.order('funcionario').order('grupo'));
  $('#topAcoes').innerHTML = `
    <input class="inp" style="width:200px" placeholder="Buscar funcionário…" value="${esc(buscaDot)}"
      oninput="buscaDot=this.value;pintarDotacao()">
    <button class="btn" onclick="exportarDotacaoCSV()">Exportar CSV</button>
    ${ehGestor()?`<button class="btn" onclick="abaCad='regras';irPara('cadastros')">Editar regras</button>`:''}`;

  window._dot = dados;
  const porFunc = {};
  dados.forEach(d=>{ (porFunc[d.funcionario_id] ||= {nome:d.funcionario, setor:d.setor, cargo:d.cargo, linhas:[]});
    porFunc[d.funcionario_id].linhas.push(d); });
  window._dotFunc = porFunc;

  $('#view').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-b" style="padding:12px 16px">
      <p class="small muted" style="margin:0">A dotação mede o que cada funcionário tem <b>em posse definitiva</b>.
      Peça emprestada não conta — ela volta. Peça na lavanderia também não, porque ainda não foi entregue a ninguém.</p>
    </div></div>
    <div class="tabs">
      ${[['faltando','Abaixo do mínimo'],['completos','Completos'],['todos','Todos']]
        .map(([k,t])=>`<button data-d="${k}" class="${FD===k?'on':''}">${t}</button>`).join('')}
    </div>
    <div class="card"><div id="dotLista"></div></div>`;
  $$('.tabs button[data-d]').forEach(b=> b.onclick = ()=>{ FD=b.dataset.d;
    $$('.tabs button[data-d]').forEach(x=>x.classList.toggle('on',x.dataset.d===FD)); pintarDotacao(); });
  pintarDotacao();
}
function pintarDotacao(){
  const t = buscaDot.trim().toLowerCase();
  let lista = Object.entries(window._dotFunc||{}).map(([id,f])=>({id:Number(id),...f,
    falta: f.linhas.reduce((s,l)=>s+l.falta,0)}));
  if(FD==='faltando')  lista = lista.filter(f=>f.falta>0);
  if(FD==='completos') lista = lista.filter(f=>f.falta===0);
  if(t) lista = lista.filter(f=>(f.nome+' '+(f.setor||'')+' '+(f.cargo||'')).toLowerCase().includes(t));
  lista.sort((a,b)=> b.falta-a.falta || a.nome.localeCompare(b.nome));

  const grupos = [...new Set((window._dot||[]).map(d=>d.grupo))].sort();
  $('#dotLista').innerHTML = lista.length? `
    <div class="card-h"><h3>${lista.length} funcionários</h3><div class="sp"></div>
      <span class="small muted">${lista.reduce((s,f)=>s+f.falta,0)} peças faltando no total</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Funcionário</th><th>Cargo / setor</th>
        ${grupos.map(g=>`<th class="num" style="text-align:center">${esc(g)}</th>`).join('')}
        <th class="num">Falta</th><th></th></tr></thead>
      <tbody>${lista.map(f=>`<tr>
        <td><div class="it-nome">${esc(f.nome)}</div></td>
        <td class="small muted">${esc(f.cargo||'—')}${f.setor?' · '+esc(f.setor):''}</td>
        ${grupos.map(g=>{ const l = f.linhas.find(x=>x.grupo===g);
          if(!l) return '<td class="num muted" style="text-align:center">–</td>';
          return `<td class="num" style="text-align:center"><span class="tag ${l.falta?'zero':'ok'}">
            ${l.em_posse}/${l.quantidade_minima}</span></td>`; }).join('')}
        <td class="num" style="font-weight:600">${f.falta||'—'}</td>
        <td style="text-align:right">
          <button class="btn sm" onclick="fichaFuncionario(${f.id})">Ficha</button>
          ${f.falta&&podeOperar()?`<button class="btn sm pri" onclick="formSaidaFuncionario(null,${f.id})">Entregar</button>`:''}
        </td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty"><b>Nada aqui</b>Nenhum funcionário nesta situação.</div>';
}
function exportarDotacaoCSV(){
  const l = [['Funcionario','Matricula','Cargo','Setor','Grupo','Minimo','Em posse','Emprestado','Falta']];
  (window._dot||[]).forEach(d=>l.push([d.funcionario,d.matricula||'',d.cargo||'',d.setor||'',
    d.grupo,d.quantidade_minima,d.em_posse,d.emprestado,d.falta]));
  const csv = l.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`dotacao-${hoje()}.csv`; a.click();
}

/* --- cadastro das regras de dotação --------------------------------- */
function cadRegras(){
  $('#topAcoes').innerHTML = ehGestor()? `<button class="btn pri" onclick="formRegra()">Nova regra</button>`:'';
  const itensSemGrupo = S.itens.filter(i=>i.ativo && !i.grupo_dotacao).length;
  $('#cadArea').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="card-b">
      <p class="small muted" style="margin:0">Cada regra define quantas peças de um grupo o funcionário precisa ter.
      Sem cargo nem setor, a regra vale para todo mundo; preenchendo um deles, ela substitui a regra geral para
      quem se encaixa. Um item só entra na conta se tiver um grupo de dotação preenchido no cadastro.
      ${itensSemGrupo?`<b>${itensSemGrupo} item(ns) ativos ainda estão sem grupo.</b>`:''}</p>
    </div></div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Grupo</th><th>Vale para</th><th class="num">Mínimo</th><th>Observação</th><th></th></tr></thead>
      <tbody>${S.dotacoes.length? S.dotacoes.map(d=>`<tr${d.ativo?'':' style="opacity:.5"'}>
        <td><span class="tag sea">${esc(d.grupo)}</span></td>
        <td class="small">${d.cargo||d.setor
          ? [d.cargo?'cargo '+esc(d.cargo):'', d.setor?'setor '+esc(d.setor):''].filter(Boolean).join(' · ')
          : '<span class="muted">todos os funcionários</span>'}</td>
        <td class="num" style="font-weight:600">${d.quantidade_minima}</td>
        <td class="small muted">${esc(d.observacoes||'—')}</td>
        <td style="text-align:right">${ehGestor()?`<button class="btn sm" onclick="formRegra(${d.id})">Editar</button>`:''}</td>
      </tr>`).join('') : '<tr><td colspan="5"><div class="empty">Nenhuma regra cadastrada.</div></td></tr>'}
    </tbody></table></div></div>`;
}
function formRegra(id=null){
  if(!exigeGestor()) return;
  const d = id? S.dotacoes.find(x=>x.id===id):{};
  const grupos = [...new Set([...S.itens.map(i=>i.grupo_dotacao), ...S.dotacoes.map(x=>x.grupo)])].filter(Boolean);
  modal({titulo:id?'Editar regra de dotação':'Nova regra de dotação', corpo:`
    <div class="row">
      <label class="field"><span>Grupo de peça <em>*</em></span>
        <input class="inp" id="dGrupo" list="dGrupos" value="${esc(d.grupo||'')}" placeholder="Ex.: Camisa">
        <datalist id="dGrupos">${grupos.map(g=>`<option>${esc(g)}</option>`).join('')}</datalist></label>
      <label class="field"><span>Quantidade mínima <em>*</em></span>
        <input class="inp mono" id="dQtd" type="number" min="1" value="${d.quantidade_minima??2}"></label>
    </div>
    <p class="small muted" style="margin:-4px 0 12px">Deixe cargo e setor em branco para a regra valer para todos.</p>
    <div class="row">
      <label class="field"><span>Só para o cargo</span><input class="inp" id="dCargo" list="cargosD" value="${esc(d.cargo||'')}">
        <datalist id="cargosD">${[...new Set(S.funcionarios.map(f=>f.cargo).filter(Boolean))]
          .map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></label>
      <label class="field"><span>Só para o setor</span><input class="inp" id="dSetor" list="setoresD" value="${esc(d.setor||'')}">
        <datalist id="setoresD">${[...new Set(S.funcionarios.map(f=>f.setor).filter(Boolean))]
          .map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></label>
    </div>
    <label class="field"><span>Observação</span><input class="inp" id="dObsR" value="${esc(d.observacoes||'')}"></label>
    <label class="check"><input type="checkbox" id="dAtivo" ${d.ativo!==false?'checked':''}> Regra ativa</label>`,
    acoes:[{rotulo:'Cancelar'},{rotulo:'Salvar regra',classe:'pri',acao:async(o,f,b)=>{
      const grupo = o.querySelector('#dGrupo').value.trim();
      const qtd = Number(o.querySelector('#dQtd').value||0);
      if(!grupo) return toast('Informe o grupo.','err');
      if(qtd<1) return toast('A quantidade mínima precisa ser pelo menos 1.','err');
      b.disabled=true;
      const reg = {grupo, quantidade_minima:qtd,
        cargo:o.querySelector('#dCargo').value.trim()||null, setor:o.querySelector('#dSetor').value.trim()||null,
        observacoes:o.querySelector('#dObsR').value.trim()||null, ativo:o.querySelector('#dAtivo').checked};
      try{ const {error} = id? await S.sb.from('almox_dotacoes').update(reg).eq('id',id)
                             : await S.sb.from('almox_dotacoes').insert(reg);
        if(error) throw error;
        f(); await carregarBase(); await carregarDotacao(); montarNav(); toast('Regra salva.','ok'); pintarCadastro();
      }catch(e){ erro(e); b.disabled=false; }
    }}]});
}
</script>
